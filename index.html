     * @param {number} beatTime Seconds into the fireworks beat.
     * @returns {void}
     */
    play(beatTime) {
      while (nextLaunch < FIREWORK_SCHEDULE.length && FIREWORK_SCHEDULE[nextLaunch].at <= beatTime) {
        launch(FIREWORK_SCHEDULE[nextLaunch], nextLaunch);
        nextLaunch += 1;
      }
    },
    /**
     * Advances rockets, particles, the name hold and the flash.
     * @param {number} dt Seconds since the last frame.
     * @param {THREE.PerspectiveCamera} camera Camera, for point-size scaling.
     * @param {THREE.WebGLRenderer} renderer Renderer, for the drawing-buffer height.
     * @returns {void}
     */
    update(dt, camera, renderer) {
      uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
      flashLevel *= Math.exp(-5 * dt);
      flash.intensity = flashLevel;
      if (active.length === 0 && rockets.length === 0) {
        return;
      }
      updateRockets(dt);
      updateParticles(dt);
      positionAttribute.needsUpdate = true;
      colorAttribute.needsUpdate = true;
      sizeAttribute.needsUpdate = true;
      alphaAttribute.needsUpdate = true;
    },
  };
}

/**
 * Creates the star field: twinkling points on a far sphere that fade in once the sky is dark.
 * @param {{tier: string, pixelRatio: number}} quality Quality settings.
 * @returns {{object3d: THREE.Points, update: (dusk: number, time: number) => void}} Stars.
 */
function createStars(quality) {
  const count = quality.tier === 'high' ? 1400 : 700;
  const random = createRandom(77);
  const positions = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const phases = new Float32Array(count);
  const direction = new THREE.Vector3();
  for (let i = 0; i < count; i += 1) {
    do {
      direction.set(random() * 2 - 1, random(), random() * 2 - 1);
    } while (direction.lengthSq() > 1 || direction.y < 0.05 * direction.length());
    direction.normalize().multiplyScalar(1500);
    direction.toArray(positions, i * 3);
    sizes[i] = 0.7 + Math.pow(random(), 4) * 2.2;
    phases[i] = random() * Math.PI * 2;
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  geometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
  const uniforms = {
    uOpacity: { value: 0 },
    uTime: { value: 0 },
    uPixelRatio: { value: quality.pixelRatio },
  };
  const material = new THREE.ShaderMaterial({
    uniforms,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute float aSize;
      attribute float aPhase;
      uniform float uTime;
      uniform float uPixelRatio;
      varying float vBrightness;
      void main() {
        float twinkle = 0.75 + 0.25 * sin(uTime * (1.3 + fract(aPhase) * 2.0) + aPhase * 7.0);
        vBrightness = twinkle * smoothstep(0.0, 0.35, normalize(position).y);
        gl_PointSize = aSize * uPixelRatio * (0.85 + 0.3 * twinkle);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uOpacity;
      varying float vBrightness;
      void main() {
        float falloff = 1.0 - smoothstep(0.1, 0.5, length(gl_PointCoord - 0.5));
        gl_FragColor = vec4(vec3(0.86, 0.9, 1.0) * falloff * vBrightness * uOpacity, 1.0);
      }
    `,
  });
  const points = new THREE.Points(geometry, material);
  points.frustumCulled = false;
  points.visible = false;

  return {
    object3d: points,
    /**
     * Fades the stars with dusk and drives the twinkle.
     * @param {number} dusk Dusk 0..1.
     * @param {number} time World time in seconds.
     * @returns {void}
     */
    update(dusk, time) {
      uniforms.uOpacity.value = smoothstep(0.78, 0.97, dusk);
      uniforms.uTime.value = time;
      points.visible = uniforms.uOpacity.value > 0.001;
    },
    /**
     * Keeps star sizes steady when the renderer's pixel ratio changes.
     * @param {number} pixelRatio New pixel ratio.
     * @returns {void}
     */
    setPixelRatio(pixelRatio) {
      uniforms.uPixelRatio.value = pixelRatio;
    },
  };
}

const MELODY = [
  ['G4', 0.75], ['G4', 0.25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
  ['G4', 0.75], ['G4', 0.25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
  ['G4', 0.75], ['G4', 0.25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
  ['F5', 0.75], ['F5', 0.25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 3],
];
const MELODY_BASS = [['C3', 1], ['G2', 4], ['G2', 7], ['C3', 10], ['C3', 13], ['F2', 16], ['C3', 19], ['G2', 21], ['C3', 22]];
const NOTE_STEPS = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const MUTE_STORAGE_KEY = 'andrii-birthday-muted';

/**
 * Converts a note name such as `G4` or `F#5` to its frequency.
 * @param {string} name Note letter, optional sharp and octave.
 * @param {number} [transpose] Semitones to shift by.
 * @returns {number} Frequency in hertz.
 */
function noteFrequency(name, transpose = 0) {
  const sharp = name[1] === '#' ? 1 : 0;
  const octave = Number(name.slice(1 + sharp));
  const midi = 12 * (octave + 1) + NOTE_STEPS[name[0]] + sharp + transpose;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

/**
 * Reads the saved mute choice; storage can be unavailable, in which case sound is on.
 * @returns {boolean} True when the visitor muted the page before.
 */
function readSavedMute() {
  try {
    return localStorage.getItem(MUTE_STORAGE_KEY) === '1';
  } catch {
    return false;
  }
}

/**
 * Saves the mute choice for the next visit; storage can be unavailable, in which case it is simply not kept.
 * @param {boolean} value True when muted.
 * @returns {void}
 */
function saveMute(value) {
  try {
    localStorage.setItem(MUTE_STORAGE_KEY, value ? '1' : '0');
  } catch {
    return;
  }
}

/**
 * Creates the synthesised sound: surf from filtered noise, a music-box «Happy Birthday» and the effects.
 * Nothing plays until `unlock` runs inside a user gesture; if Web Audio fails, every call stays silent.
 * @returns {object} Audio controller.
 */
function createAudio() {
  let context = null;
  let master = null;
  let musicBus = null;
  let effectsBus = null;
  let surfGain = null;
  let noiseBuffer = null;
  let crackleBuffer = null;
  let muted = readSavedMute();
  let performances = [];

  /**
   * Fills a buffer with brown noise, which sounds like distant surf once filtered.
   * @param {number} seconds Buffer length.
   * @returns {AudioBuffer} Stereo noise buffer.
   */
  function createNoiseBuffer(seconds) {
    const buffer = context.createBuffer(2, Math.round(context.sampleRate * seconds), context.sampleRate);
    for (let channel = 0; channel < 2; channel += 1) {
      const data = buffer.getChannelData(channel);
      let last = 0;
      for (let i = 0; i < data.length; i += 1) {
        last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
        data[i] = last * 3.5;
      }
    }
    return buffer;
  }

  /**
   * Builds the crackle of falling sparks: sparse short clicks that thin out over time.
   * @returns {AudioBuffer} Mono crackle buffer.
   */
  function createCrackleBuffer() {
    const buffer = context.createBuffer(1, Math.round(context.sampleRate * 1.8), context.sampleRate);
    const data = buffer.getChannelData(0);
    for (let click = 0; click < 70; click += 1) {
      const start = Math.floor(Math.pow(Math.random(), 1.6) * (data.length - 600));
      const length = 80 + Math.floor(Math.random() * 300);
      const level = (0.3 + Math.random() * 0.7) * (1 - start / data.length);
      for (let i = 0; i < length; i += 1) {
        data[start + i] += (Math.random() * 2 - 1) * level * (1 - i / length);
      }
    }
    return buffer;
  }

  /**
   * Builds a short decaying-noise impulse response for a soft room reverb.
   * @param {number} seconds Reverb tail length.
   * @returns {AudioBuffer} Stereo impulse response.
   */
  function createImpulse(seconds) {
    const buffer = context.createBuffer(2, Math.round(context.sampleRate * seconds), context.sampleRate);
    for (let channel = 0; channel < 2; channel += 1) {
      const data = buffer.getChannelData(channel);
      for (let i = 0; i < data.length; i += 1) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2.6);
      }
    }
    return buffer;
  }

  /**
   * Starts the endless surf: a low swell and a hiss of breaking foam, both rising and falling with a slow wave rhythm.
   * @returns {void}
   */
  function startSurf() {
    surfGain = context.createGain();
    surfGain.gain.value = 0;
    surfGain.connect(master);
    const source = context.createBufferSource();
    source.buffer = noiseBuffer;
    source.loop = true;
    const swellFilter = context.createBiquadFilter();
    swellFilter.type = 'lowpass';
    swellFilter.frequency.value = 520;
    const swell = context.createGain();
    swell.gain.value = 0.55;
    const hissFilter = context.createBiquadFilter();
    hissFilter.type = 'bandpass';
    hissFilter.frequency.value = 2400;
    hissFilter.Q.value = 0.4;
    const hiss = context.createGain();
    hiss.gain.value = 0.05;
    const rhythm = context.createOscillator();
    rhythm.frequency.value = 0.085;
    const swellDepth = context.createGain();
    swellDepth.gain.value = 0.3;
    const hissDepth = context.createGain();
    hissDepth.gain.value = 0.045;
    rhythm.connect(swellDepth).connect(swell.gain);
    rhythm.connect(hissDepth).connect(hiss.gain);
    source.connect(swellFilter).connect(swell).connect(surfGain);
    source.connect(hissFilter).connect(hiss).connect(surfGain);
    source.start();
    rhythm.start();
  }

  /**
   * Plays one music-box tine: a sine with a quickly fading metallic overtone and a long soft decay.
   * @param {AudioNode} destination Where the note goes.
   * @param {number} time Start time on the audio clock.
   * @param {number} frequency Fundamental in hertz.
   * @param {number} velocity Peak level.
   * @returns {void}
   */
  function tine(destination, time, frequency, velocity) {
    const envelope = context.createGain();
    envelope.gain.setValueAtTime(0, time);
    envelope.gain.linearRampToValueAtTime(velocity, time + 0.004);
    envelope.gain.exponentialRampToValueAtTime(0.0005, time + 1.9);
    envelope.connect(destination);
    for (const [ratio, level, fade] of [[1, 1, 1.9], [2, 0.18, 0.6], [4.2, 0.12, 0.18]]) {
      const oscillator = context.createOscillator();
      oscillator.frequency.value = frequency * ratio;
      const partial = context.createGain();
      partial.gain.setValueAtTime(level, time);
      partial.gain.exponentialRampToValueAtTime(0.0005, time + fade);
      oscillator.connect(partial).connect(envelope);
      oscillator.start(time);
      oscillator.stop(time + 2);
    }
  }

  /**
   * Plays a soft low note under the melody.
   * @param {AudioNode} destination Where the note goes.
   * @param {number} time Start time on the audio clock.
   * @param {number} frequency Frequency in hertz.
   * @returns {void}
   */
  function bassNote(destination, time, frequency) {
    const oscillator = context.createOscillator();
    oscillator.type = 'triangle';
    oscillator.frequency.value = frequency;
    const envelope = context.createGain();
    envelope.gain.setValueAtTime(0, time);
    envelope.gain.linearRampToValueAtTime(0.16, time + 0.02);
    envelope.gain.exponentialRampToValueAtTime(0.0005, time + 1.6);
    oscillator.connect(envelope).connect(destination);
    oscillator.start(time);
    oscillator.stop(time + 1.7);
  }

  /**
   * Plays a burst of filtered noise, the base of the pop, whoosh and firework sounds.
   * @param {object} options Sound shape.
   * @param {number} options.time Start time on the audio clock.
   * @param {number} options.duration Length in seconds.
   * @param {number} options.level Peak level.
   * @param {BiquadFilterType} options.type Filter type.
   * @param {number} options.from Filter frequency at the start.
   * @param {number} [options.to] Filter frequency at the end.
   * @param {number} [options.q] Filter resonance.
   * @param {number} [options.attack] Seconds to reach the peak.
   * @returns {void}
   */
  function noiseBurst({ time, duration, level, type, from, to = from, q = 1, attack = 0.005 }) {
    const source = context.createBufferSource();
    source.buffer = noiseBuffer;
    const filter = context.createBiquadFilter();
    filter.type = type;
    filter.Q.value = q;
    filter.frequency.setValueAtTime(from, time);
    filter.frequency.exponentialRampToValueAtTime(to, time + duration);
    const envelope = context.createGain();
    envelope.gain.setValueAtTime(0, time);
    envelope.gain.linearRampToValueAtTime(level, time + attack);
    envelope.gain.exponentialRampToValueAtTime(0.0005, time + duration);
    source.connect(filter).connect(envelope).connect(effectsBus);
    source.start(time, Math.random() * 2);
    source.stop(time + duration + 0.05);
  }

  /**
   * Plays a sine whose pitch falls, for thumps and the cork pop.
   * @param {number} time Start time on the audio clock.
   * @param {number} from Start frequency.
   * @param {number} to End frequency.
   * @param {number} duration Length in seconds.
   * @param {number} level Peak level.
   * @returns {void}
   */
  function drop(time, from, to, duration, level) {
    const oscillator = context.createOscillator();
    oscillator.frequency.setValueAtTime(from, time);
    oscillator.frequency.exponentialRampToValueAtTime(to, time + duration);
    const envelope = context.createGain();
    envelope.gain.setValueAtTime(level, time);
    envelope.gain.exponentialRampToValueAtTime(0.0005, time + duration);
    oscillator.connect(envelope).connect(effectsBus);
    oscillator.start(time);
    oscillator.stop(time + duration + 0.02);
  }

  /**
   * Returns the audio clock time a number of seconds from now, or null when sound is off.
   * @param {number} [delay] Seconds from now.
   * @returns {number|null} Audio clock time.
   */
  function at(delay = 0) {
    return context && context.state === 'running' ? context.currentTime + delay : null;
  }

  return {
    get muted() {
      return muted;
    },
    get state() {
      return context?.state ?? 'off';
    },
    get activeTunes() {
      return performances.length;
    },
    /**
     * Creates or resumes the audio context; call it from a click or key press.
     * @returns {void}
     */
    unlock() {
      try {
        if (!context) {
          context = new AudioContext();
          master = context.createGain();
          master.gain.value = muted ? 0 : 0.85;
          master.connect(context.destination);
          const reverb = context.createConvolver();
          reverb.buffer = createImpulse(2.4);
          const reverbReturn = context.createGain();
          reverbReturn.gain.value = 0.32;
          reverb.connect(reverbReturn).connect(master);
          musicBus = context.createGain();
          musicBus.gain.value = 0.5;
          musicBus.connect(master);
          musicBus.connect(reverb);
          effectsBus = context.createGain();
          effectsBus.gain.value = 0.6;
          effectsBus.connect(master);
          effectsBus.connect(reverb);
          noiseBuffer = createNoiseBuffer(4);
          crackleBuffer = createCrackleBuffer();
          startSurf();
          document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
              context.suspend();
            } else {
              context.resume();
            }
          });
        }
        context.resume();
      } catch {
        context = null;
      }
    },
    /**
     * Mutes or unmutes everything and remembers the choice.
     * @param {boolean} value True to mute.
     * @returns {void}
     */
    setMuted(value) {
      muted = value;
      saveMute(value);
      if (master) {
        master.gain.setTargetAtTime(value ? 0 : 0.85, context.currentTime, 0.08);
      }
    },
    /**
     * Fades the surf to a level.
     * @param {number} level Level 0..1.
     * @param {number} seconds Fade time.
     * @returns {void}
     */
    setSurf(level, seconds) {
      if (surfGain) {
        surfGain.gain.setTargetAtTime(level, context.currentTime, Math.max(0.01, seconds / 3));
      }
    },
    /**
     * Plays «Happy Birthday» on the music box with a soft bass, replacing any tune still playing.
     * @param {{delay?: number, beat?: number, level?: number}} [options] Start delay, seconds per beat and volume.
     * @returns {void}
     */
    playMelody({ delay = 0, beat = 0.46, level = 1 } = {}) {
      const start = at(delay);
      if (start === null) {
        return;
      }
      this.stopMusic(0.4);
      const performance = context.createGain();
      performance.gain.value = level;
      performance.connect(musicBus);
      performances.push(performance);
      let time = start;
      MELODY.forEach(([note, length], index) => {
        const accent = index === 0 || MELODY[index - 1][1] === 0.75 ? 0.85 : 1;
        tine(performance, time, noteFrequency(note, 12), 0.32 * accent);
        time += length * beat;
      });
      for (const [note, onBeat] of MELODY_BASS) {
        bassNote(performance, start + onBeat * beat, noteFrequency(note));
      }
    },
    /**
     * Fades out every tune that is playing or scheduled.
     * @param {number} [seconds] Fade time.
     * @returns {void}
     */
    stopMusic(seconds = 0.6) {
      if (!context) {
        return;
      }
      for (const performance of performances) {
        performance.gain.setTargetAtTime(0, context.currentTime, seconds / 3);
        setTimeout(() => performance.disconnect(), (seconds + 2) * 1000);
      }
      performances = [];
    },
    /**
     * The cork popping out of the bottle.
     * @returns {void}
     */
    pop() {
      const time = at();
      if (time === null) {
        return;
      }
      drop(time, 700, 160, 0.09, 0.7);
      noiseBurst({ time, duration: 0.07, level: 0.5, type: 'bandpass', from: 1800, q: 1.4, attack: 0.002 });
    },
    /**
     * A soft rush of air, for the scroll sliding out.
     * @returns {void}
     */
    whoosh() {
      const time = at();
      if (time === null) {
        return;
      }
      noiseBurst({ time, duration: 0.9, level: 0.22, type: 'bandpass', from: 300, to: 1600, q: 0.9, attack: 0.35 });
    },
    /**
     * A distant rocket climbing.
     * @param {number} flight Seconds the rocket climbs.
     * @returns {void}
     */
    launch(flight) {
      const time = at(0.12);
      if (time === null) {
        return;
      }
      noiseBurst({ time, duration: flight, level: 0.06, type: 'bandpass', from: 700, to: 2600, q: 3, attack: flight * 0.6 });
    },
    /**
     * A distant firework burst with its crackle, arriving a moment after the flash like real sound over water.
     * @param {number} size 1 for a normal burst, more for bigger ones.
     * @returns {void}
     */
    burst(size) {
      const time = at(0.16);
      if (time === null) {
        return;
      }
      drop(time, 120, 38, 0.5, 0.55 * size);
      noiseBurst({ time, duration: 0.9 + size * 0.3, level: 0.32 * size, type: 'lowpass', from: 1800, to: 300, attack: 0.004 });
      const crackle = context.createBufferSource();
      crackle.buffer = crackleBuffer;
      crackle.playbackRate.value = 0.8 + Math.random() * 0.4;
      const filter = context.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1400;
      const level = context.createGain();
      level.gain.value = 0.22 * size;
      crackle.connect(filter).connect(level).connect(effectsBus);
      crackle.start(time + 0.25);
    },
    /**
     * A rising music-box arpeggio for the name settling in the sky.
     * @param {number} delay Seconds from now.
     * @returns {void}
     */
    chime(delay) {
      const time = at(delay);
      if (time === null) {
        return;
      }
      ['C6', 'E6', 'G6', 'C7', 'E7'].forEach((note, index) => {
        tine(effectsBus, time + index * 0.11, noteFrequency(note), 0.22);
      });
    },
    /**
     * A camera shutter, for the polaroid landing.
     * @returns {void}
     */
    shutter() {
      const time = at();
      if (time === null) {
        return;
      }
      noiseBurst({ time, duration: 0.03, level: 0.4, type: 'highpass', from: 2500, attack: 0.001 });
      noiseBurst({ time: time + 0.08, duration: 0.05, level: 0.3, type: 'bandpass', from: 1600, q: 2, attack: 0.001 });
    },
  };
}

const PHOTO_URL = 'assets/andrii.webp';
const POLAROID_CAPTION = 'З днем народження!';
const POLAROID_WIDTH = 0.32;
const POLAROID_HEIGHT = 0.39;
const POLAROID_FALL_SECONDS = 5;
const POLAROID_START = new THREE.Vector3(0.2, 7, 1);
const POLAROID_LANDING = new THREE.Vector3(0.3, sandHeightAt(0.3, 5.6) - 0.02, 5.6);
const PORTRAIT_POSITION = new THREE.Vector3(0.6, 1.5, 8.4);
const PORTRAIT_FOCUS = new THREE.Vector3(0.85, 1.02, 4.6);

/**
 * Paints the polaroid face: off-white frame, the photo cropped square from its centre, and the caption.
 * @param {CanvasRenderingContext2D} context Target context.
 * @param {HTMLImageElement|null} image The photo, or null while it loads.
 * @returns {void}
 */
function drawPolaroidFace(context, image) {
  const { width, height } = context.canvas;
  const border = Math.round(width * 0.06);
  const photoSize = width - border * 2;
  context.fillStyle = '#F7F4EC';
  context.fillRect(0, 0, width, height);
  if (image) {
    const side = Math.min(image.naturalWidth, image.naturalHeight);
    const sourceX = (image.naturalWidth - side) / 2;
    const sourceY = (image.naturalHeight - side) / 2;
    context.drawImage(image, sourceX, sourceY, side, side, border, border, photoSize, photoSize);
  } else {
    context.fillStyle = '#8A8F94';
    context.fillRect(border, border, photoSize, photoSize);
  }
  context.strokeStyle = 'rgba(0, 0, 0, 0.12)';
  context.lineWidth = 3;
  context.strokeRect(border, border, photoSize, photoSize);
  context.fillStyle = '#2B3B63';
  context.font = '600 64px Caveat, cursive';
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.fillText(POLAROID_CAPTION, width / 2, border + photoSize + (height - border - photoSize) / 2);
}

/**
 * Creates the polaroid of the real photo. It flutters down from the sky like a leaf, plants itself
 * upright in the sand beside Andrii facing the camera, and develops from milky white into the photo.
 * @returns {object} Polaroid controller.
 */
function createPolaroid() {
  const canvas = document.createElement('canvas');
  canvas.width = 768;
  canvas.height = Math.round(768 * (POLAROID_HEIGHT / POLAROID_WIDTH));
  const context = canvas.getContext('2d');
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 8;
  let photo = null;

  /**
   * Repaints the face, e.g. once the photo or the caption font arrives.
   * @returns {void}
   */
  function redraw() {
    drawPolaroidFace(context, photo);
    texture.needsUpdate = true;
  }
  redraw();
  loadImage(PHOTO_URL, (image) => {
    photo = image;
    redraw();
  });
  if (document.fonts) {
    trackAsset(document.fonts.load('600 64px Caveat', POLAROID_CAPTION)).then(redraw).catch(() => {});
  }

  const develop = { value: 0 };
  const milk = { value: new THREE.Color('#C9CED2') };
  const faceMaterial = new THREE.MeshStandardMaterial({
    map: texture,
    emissiveMap: texture,
    emissive: '#ffffff',
    emissiveIntensity: 0.25,
    roughness: 0.6,
  });
  faceMaterial.onBeforeCompile = (shader) => {
    shader.uniforms.uDevelop = develop;
    shader.uniforms.uMilk = milk;
    shader.fragmentShader = `uniform float uDevelop;\nuniform vec3 uMilk;\n${shader.fragmentShader}`
      .replace('#include <map_fragment>', '#include <map_fragment>\ndiffuseColor.rgb = mix(uMilk, diffuseColor.rgb, uDevelop);')
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance = mix(uMilk * emissive, totalEmissiveRadiance, uDevelop);');
  };

  const group = new THREE.Group();
  const card = new THREE.Mesh(
    new THREE.BoxGeometry(POLAROID_WIDTH, POLAROID_HEIGHT, 0.003).translate(0, POLAROID_HEIGHT / 2, 0),
    new THREE.MeshStandardMaterial({ color: '#F2EFE6', roughness: 0.7, emissive: '#F2EFE6', emissiveIntensity: 0.3 }),
  );
  const face = new THREE.Mesh(
    new THREE.PlaneGeometry(POLAROID_WIDTH, POLAROID_HEIGHT).translate(0, POLAROID_HEIGHT / 2, 0.0016),
    faceMaterial,
  );
  card.castShadow = true;
  group.add(card, face);
  group.visible = false;

  const plantedQuaternion = new THREE.Quaternion().setFromEuler(new THREE.Euler(
    -0.3,
    Math.atan2(PORTRAIT_POSITION.x - POLAROID_LANDING.x, PORTRAIT_POSITION.z - POLAROID_LANDING.z),
    0.06,
    'YXZ',
  ));
  const fallEuler = new THREE.Euler();
  const fallQuaternion = new THREE.Quaternion();
  let state = 'hidden';
  let stateTime = 0;

  /**
   * Switches state and restarts the state clock.
   * @param {string} name New state.
   * @returns {void}
   */
  function setState(name) {
    state = name;
    stateTime = 0;
    group.visible = name !== 'hidden';
  }

  /**
   * Places the card upright in the sand and sets how far the photo has developed.
   * @param {number} amount Development 0 (milky) .. 1 (full photo).
   * @returns {void}
   */
  function plant(amount) {
    group.position.copy(POLAROID_LANDING);
    group.quaternion.copy(plantedQuaternion);
    develop.value = amount;
    faceMaterial.emissiveIntensity = lerp(0.25, 0.55, amount);
  }

  return {
    object3d: group,
    position: group.position,
    get state() {
      return state;
    },
    get stateTime() {
      return stateTime;
    },
    /**
     * Hides the polaroid.
     * @returns {void}
     */
    hide() {
      setState('hidden');
      develop.value = 0;
    },
    /**
     * Starts the fall from the sky.
     * @returns {void}
     */
    drop() {
      develop.value = 0;
      faceMaterial.emissiveIntensity = 0.25;
      setState('falling');
    },
    /**
     * Snaps to the landed, fully developed state.
     * @returns {void}
     */
    setLanded() {
      setState('landed');
      stateTime = 10;
      plant(1);
    },
    /**
     * Flutters the card down, then develops the photo once it has landed.
     * @param {number} dt Seconds since the last frame.
     * @returns {void}
     */
    update(dt) {
      if (state === 'hidden') {
        return;
      }
      stateTime += dt;
      if (state === 'landed') {
        plant(smoothstep(0.3, 3.8, stateTime));
        return;
      }
      const progress = clamp01(stateTime / POLAROID_FALL_SECONDS);
      const swing = Math.sin(stateTime * 2.3);
      const sway = 1 - smoothstep(0.7, 1, progress);
      group.position.set(
        lerp(POLAROID_START.x, POLAROID_LANDING.x, progress) + swing * 0.8 * sway,
        lerp(POLAROID_START.y, POLAROID_LANDING.y, progress) + Math.abs(Math.cos(stateTime * 2.3)) * 0.12 * sway,
        lerp(POLAROID_START.z, POLAROID_LANDING.z, progress) + Math.cos(stateTime * 1.15) * 0.35 * sway,
      );
      fallEuler.set(-Math.PI / 2 + 0.55 * Math.cos(stateTime * 2.3), stateTime * 0.6, 0.5 * swing);
      fallQuaternion.setFromEuler(fallEuler);
      group.quaternion.slerpQuaternions(fallQuaternion, plantedQuaternion, smoothstep(0.75, 1, progress));
      if (progress >= 1) {
        setState('landed');
        plant(0);
      }
    },
  };
}

/**
 * Creates the scripted camera moves for each beat.
 * With reduced motion the moves become cuts between the fixed shots at either end, with no handheld sway.
 * @param {THREE.PerspectiveCamera} camera Camera to drive.
 * @param {boolean} reducedMotion Whether the visitor asked for reduced motion.
 * @returns {object} Camera rig.
 */
function createCameraRig(camera, reducedMotion) {
  const arrivalPath = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-10, 1.5, -42),
    new THREE.Vector3(-8, 1.55, -22),
    new THREE.Vector3(-5.5, 1.6, -6),
    new THREE.Vector3(-3.4, 1.75, 3.6),
    new THREE.Vector3(-0.7, 2.1, 8.8),
  ], false, 'catmullrom', 0.5);
  const avatarFocus = AVATAR_SPOT.clone().add(new THREE.Vector3(0, 1.2, 0));
  const seaFocus = new THREE.Vector3(1.2, 0.9, -12);
  const holdPosition = arrivalPath.getPoint(1);
  const closePosition = new THREE.Vector3();
  const closeFocus = new THREE.Vector3();
  const hugWidePosition = new THREE.Vector3();
  const hugWideFocus = new THREE.Vector3();
  const hugClosePosition = new THREE.Vector3(0.55, 1.75, 7.4);
  const hugCloseFocus = new THREE.Vector3(0.58, 1.25, 4.4);
  const skyPosition = new THREE.Vector3();
  const skyFocus = new THREE.Vector3();
  const portraitPosition = new THREE.Vector3();
  const portraitFocus = new THREE.Vector3();
  const framings = [
    { position: closePosition, focus: closeFocus, landscape: [[-0.75, 1.5, 7], [-0.3, 0.55, 2.6]], portrait: [[0.05, 1.55, 7.5], [0.15, 0.75, 3.4]] },
    { position: hugWidePosition, focus: hugWideFocus, landscape: [[0.7, 1.65, 9.2], [0.75, 1, 4.6]], portrait: [[0.85, 1.7, 9.9], [0.9, 1, 4.6]] },
    { position: skyPosition, focus: skyFocus, landscape: [[-1.2, 1.4, 10], [0, 14, -50]], portrait: [[0.9, 1.3, 11.2], [0.9, 14, -50]] },
    { position: portraitPosition, focus: portraitFocus, landscape: [PORTRAIT_POSITION.toArray(), PORTRAIT_FOCUS.toArray()], portrait: [[0.85, 1.55, 9.6], [0.9, 1, 4.6]] },
  ];
  const landscapePoint = new THREE.Vector3();
  const portraitPoint = new THREE.Vector3();
  const idlePosition = new THREE.Vector3(0.7, 1.4, 10.6);
  const idleFocus = new THREE.Vector3(0.85, 3.4, 0);
  const idlePivot = new THREE.Vector3(0.85, 1.2, 4.5);
  const idleLookPosition = new THREE.Vector3();
  const idleLookFocus = new THREE.Vector3();
  const upAxis = new THREE.Vector3(0, 1, 0);
  const look = new THREE.Vector3();
  const desiredLook = new THREE.Vector3();
  const smoothedLook = seaFocus.clone();
  let enabled = true;

  /**
   * Turns a move's progress into a cut under reduced motion: the first shot until halfway, then the second.
   * @param {number} progress Move progress 0..1.
   * @returns {number} Progress to use.
   */
  function shot(progress) {
    return reducedMotion ? Math.round(clamp01(progress)) : progress;
  }

  /**
   * Adds a slight handheld sway to the camera position.
   * @param {number} time World time in seconds.
   * @returns {void}
   */
  function addHandheld(time) {
    if (reducedMotion) {
      return;
    }
    camera.position.x += Math.sin(time * 0.5) * 0.04;
    camera.position.y += Math.sin(time * 0.7) * 0.03;
  }

  return {
    /**
     * Picks the shots for the screen shape: tall phone screens use framings pulled back and centred on the group.
     * @param {number} aspect Screen width divided by height.
     * @returns {void}
     */
    setAspect(aspect) {
      const tall = clamp01((1 - aspect) / 0.5);
      for (const framing of framings) {
        framing.position.lerpVectors(landscapePoint.fromArray(framing.landscape[0]), portraitPoint.fromArray(framing.portrait[0]), tall);
        framing.focus.lerpVectors(landscapePoint.fromArray(framing.landscape[1]), portraitPoint.fromArray(framing.portrait[1]), tall);
      }
    },
    /**
     * Turns scripted camera moves on or off, for free orbit in debug mode.
     * @param {boolean} value Whether the rig drives the camera.
     * @returns {void}
     */
    setEnabled(value) {
      enabled = value;
    },
    /**
     * Places the camera along the arrival flight.
     * @param {number} progress Flight progress 0..1.
     * @returns {void}
     */
    arrival(progress) {
      if (!enabled) {
        return;
      }
      const t = reducedMotion ? 1 : clamp01(progress);
      camera.position.copy(arrivalPath.getPoint(easeInOutCubic(t)));
      look.copy(avatarFocus).lerp(seaFocus, smoothstep(0.55, 1, t));
      camera.lookAt(look);
    },
    /**
     * Resets the smoothed gaze to the sea, for the start of the bottle beat.
     * @returns {void}
     */
    resetLook() {
      smoothedLook.copy(seaFocus);
    },
    /**
     * Watches the bottle come in and pushes in closer as it lands.
     * @param {number} progress Bottle drift progress 0..1.
     * @param {THREE.Vector3} bottlePosition Current bottle position.
     * @param {number} time World time in seconds.
     * @param {number} dt Seconds since the last frame.
     * @returns {void}
     */
    bottle(progress, bottlePosition, time, dt) {
      if (!enabled) {
        return;
      }
      const move = shot(easeInOutCubic(smoothstep(0.5, 1, progress)));
      camera.position.lerpVectors(holdPosition, closePosition, move);
      addHandheld(time);
      desiredLook.copy(reducedMotion ? closeFocus : bottlePosition).lerp(closeFocus, move);
      look.copy(seaFocus).lerp(desiredLook, reducedMotion ? move : smoothstep(0.1, 0.45, progress));
      smoothedLook.lerp(look, reducedMotion ? 1 : 1 - Math.exp(-3 * dt));
      camera.lookAt(smoothedLook);
    },
    /**
     * Holds the close shot of the avatar and the bottle on the sand.
     * @param {number} time World time in seconds.
     * @returns {void}
     */
    close(time) {
      if (!enabled) {
        return;
      }
      camera.position.copy(closePosition);
      addHandheld(time);
      camera.lookAt(closeFocus);
    },
    /**
     * Pulls back from the scroll to watch the friends arrive, pushes in on the hug, then eases back out.
     * @param {number} beatTime Seconds into the hug beat.
     * @param {number} time World time in seconds.
     * @returns {void}
     */
    hug(beatTime, time) {
      if (!enabled) {
        return;
      }
      const settle = shot(easeInOutCubic(smoothstep(0.3, 3.5, beatTime)));
      const push = shot(easeInOutCubic(smoothstep(5.5, 9, beatTime))) * (1 - shot(easeInOutCubic(smoothstep(10.6, 13.5, beatTime))));
      camera.position.lerpVectors(closePosition, hugWidePosition, settle).lerp(hugClosePosition, push);
      addHandheld(time);
      look.lerpVectors(closeFocus, hugWideFocus, settle).lerp(hugCloseFocus, push);
      camera.lookAt(look);
    },
    /**
     * Pulls back and tilts up from the group on the shore to the sky over the sea, with the friends in the foreground.
     * @param {number} beatTime Seconds into the fireworks beat.
     * @param {number} time World time in seconds.
     * @returns {void}
     */
    sky(beatTime, time) {
      if (!enabled) {
        return;
      }
      const blend = shot(easeInOutCubic(smoothstep(0.4, 3.2, beatTime)));
      camera.position.lerpVectors(hugWidePosition, skyPosition, blend);
      addHandheld(time);
      look.lerpVectors(hugWideFocus, skyFocus, blend);
      camera.lookAt(look);
    },
    /**
     * Brings the camera down from the sky, following the falling polaroid, into the portrait shot.
     * @param {number} beatTime Seconds into the polaroid beat.
     * @param {THREE.Vector3} polaroidPosition Current polaroid position.
     * @param {number} time World time in seconds.
     * @param {number} dt Seconds since the last frame.
     * @returns {void}
     */
    polaroid(beatTime, polaroidPosition, time, dt) {
      if (!enabled) {
        return;
      }
      const move = shot(easeInOutCubic(smoothstep(0.3, 6.5, beatTime)));
      camera.position.lerpVectors(skyPosition, portraitPosition, move);
      addHandheld(time);
      if (reducedMotion) {
        look.lerpVectors(skyFocus, portraitFocus, move);
      } else {
        look.copy(skyFocus)
          .lerp(polaroidPosition, smoothstep(0, 2.2, beatTime))
          .lerp(portraitFocus, smoothstep(4.5, 7, beatTime));
      }
      if (reducedMotion || beatTime <= dt + 1e-6) {
        smoothedLook.copy(look);
      }
      smoothedLook.lerp(look, 1 - Math.exp(-4 * dt));
      camera.lookAt(smoothedLook);
    },
    /**
     * Eases from the portrait into the night shot, the group below and the glowing name above the sea,
     * then lets the visitor look around: the view turns about the group and tilts between them and the sky.
     * @param {number} beatTime Seconds into the idle beat.
     * @param {number} time World time in seconds.
     * @param {number} yaw Look-around turn in radians.
     * @param {number} pitch Look-around tilt, -1..1 roughly, positive looks higher.
     * @returns {void}
     */
    idle(beatTime, time, yaw, pitch) {
      if (!enabled) {
        return;
      }
      const settle = shot(easeInOutCubic(smoothstep(2, 7, beatTime)));
      idleLookPosition.lerpVectors(portraitPosition, idlePosition, settle).sub(idlePivot).applyAxisAngle(upAxis, yaw).add(idlePivot);
      idleLookFocus.lerpVectors(portraitFocus, idleFocus, settle);
      idleLookFocus.y += pitch * 8;
      idleLookFocus.sub(idlePivot).applyAxisAngle(upAxis, yaw).add(idlePivot);
      camera.position.copy(idleLookPosition);
      addHandheld(time);
      camera.lookAt(idleLookFocus);
    },
    /**
     * Holds the portrait shot: Andrii facing the camera with the polaroid in the sand in front of him.
     * @param {number} time World time in seconds.
     * @returns {void}
     */
    portrait(time) {
      if (!enabled) {
        return;
      }
      camera.position.copy(portraitPosition);
      addHandheld(time);
      camera.lookAt(portraitFocus);
    },
  };
}

/**
 * Wires the beat list to scene behaviour.
 * @param {object} cast Scene parts and controllers the beats use.
 * @returns {Array<object>} Beats for the timeline.
 */
function createBeats({ ui, audio, rig, clock, avatar, friends, bottle, scroll, fireworks, polaroid, timeline, reducedMotion }) {
  const lookAround = { yaw: 0, pitch: 0, targetYaw: 0, targetPitch: 0, idleFor: 0 };
  const neckPosition = new THREE.Vector3();
  const neckQuaternion = new THREE.Quaternion();
  let bottleHintShown = false;
  let continueHintShown = false;
  let writtenFor = 0;
  let hugMelodyPlayed = false;
  let shutterPlayed = false;
  let replayShown = false;
  let nextIdleMelody = 0;

  /**
   * Starts the story again from the arrival, without reloading.
   * @returns {void}
   */
  function replay() {
    audio.unlock();
    timeline.goTo(1);
  }

  /**
   * Opens the bottle when it is waiting on the sand.
   * @returns {void}
   */
  function openBottle() {
    if (bottle.isClickable()) {
      timeline.next();
    }
  }

  /**
   * Finishes the writing, or moves on once the greeting is written.
   * @returns {void}
   */
  function continueFromScroll() {
    if (scroll.state === 'written') {
      timeline.next();
    } else {
      scroll.finishWriting();
    }
  }

  /**
   * Puts Andrii back facing the sea with his arms down.
   * @returns {void}
   */
  function resetAndrii() {
    avatar.setPose('turn', 0);
    avatar.setPose('wave', 0);
    avatar.setPose('hug', 0);
    avatar.snapPose();
  }

  /**
   * Hides the polaroid and the friends and resets Andrii, for beats before the friends arrive.
   * @returns {void}
   */
  function resetReveal() {
    polaroid.hide();
    friends.hide();
    resetAndrii();
  }

  /**
   * Puts the bottle and scroll into the state a later beat expects.
   * @returns {void}
   */
  function settleProps() {
    bottle.setOpened();
    if (scroll.state === 'hidden') {
      return;
    }
    scroll.rollUp();
  }

  return [
    {
      ...BEATS[0],
      /**
       * Shows the start screen over the opening frame.
       * @returns {void}
       */
      enter() {
        ui.showStart();
        bottle.reset();
        scroll.hide();
        fireworks.clear();
        resetReveal();
      },
      /**
       * Keeps the camera at the start of the flight.
       * @returns {void}
       */
      update() {
        rig.arrival(0);
      },
    },
    {
      ...BEATS[1],
      /**
       * Hides the start screen as the flight begins.
       * @returns {void}
       */
      enter() {
        ui.hideStart();
        ui.showMute();
        audio.stopMusic();
        audio.setSurf(1, 4);
        bottle.reset();
        scroll.hide();
        fireworks.clear();
        resetReveal();
      },
      /**
       * Flies the camera in toward the shore.
       * @param {number} beatTime Seconds into the beat.
       * @returns {void}
       */
      update(beatTime) {
        rig.arrival(beatTime / BEATS[1].duration);
      },
    },
    {
      ...BEATS[2],
      /**
       * Sends the bottle in from the sea.
       * @returns {void}
       */
      enter() {
        bottleHintShown = false;
        scroll.hide();
        fireworks.clear();
        resetReveal();
        bottle.startDrift();
        rig.resetLook();
      },
      /**
       * Follows the bottle and offers the tap hint once it has waited a moment.
       * @param {number} beatTime Seconds into the beat.
       * @param {number} dt Seconds since the last frame.
       * @returns {void}
       */
      update(beatTime, dt) {
        rig.bottle(bottle.driftProgress, bottle.position, clock.time, dt);
        if (!bottleHintShown && bottle.state === 'landed' && bottle.stateTime > 3) {
          bottleHintShown = true;
          ui.showHint('Торкнись пляшки', openBottle);
          ui.announce('Хвиля винесла на берег пляшку з посланням. Натисни, щоб відкрити.');
        }
      },
      /**
       * Opens the bottle when the tap lands on it.
       * @param {THREE.Raycaster} raycaster Ray from the tap.
       * @returns {void}
       */
      tap(raycaster) {
        if (bottle.hitTest(raycaster)) {
          openBottle();
        }
      },
      /**
       * Tells the pointer whether the bottle is under it and tappable.
       * @param {THREE.Raycaster} raycaster Ray from the pointer.
       * @returns {boolean} True when the cursor should show a hand.
       */
      hover(raycaster) {
        return bottle.isClickable() && bottle.hitTest(raycaster);
      },
      /**
       * Removes the tap hint.
       * @returns {void}
       */
      exit() {
        ui.hideHint();
      },
    },
    {
      ...BEATS[3],
      /**
       * Pops the cork; the scroll follows a moment later.
       * @returns {void}
       */
      enter() {
        continueHintShown = false;
        writtenFor = 0;
        scroll.hide();
        fireworks.clear();
        resetReveal();
        bottle.land();
        bottle.open();
        audio.pop();
      },
      /**
       * Releases the scroll, then waits for a tap or moves on by itself.
       * @param {number} beatTime Seconds into the beat.
       * @param {number} dt Seconds since the last frame.
       * @returns {void}
       */
      update(beatTime, dt) {
        rig.close(clock.time);
        if (beatTime >= 0.95 && scroll.state === 'hidden' && writtenFor === 0) {
          bottle.getNeckPose(neckPosition, neckQuaternion);
          bottle.releaseScroll();
          scroll.emerge(neckPosition, neckQuaternion);
          audio.whoosh();
          audio.playMelody({ delay: 1.4 });
          ui.announce(scroll.text);
        }
        if (scroll.state !== 'written') {
          return;
        }
        writtenFor += dt;
        if (!continueHintShown && writtenFor > 0.6) {
          continueHintShown = true;
          ui.showHint('Торкнись, щоб продовжити', continueFromScroll);
        }
        if (writtenFor >= SCROLL_AUTO_CONTINUE_SECONDS) {
          timeline.next();
        }
      },
      /**
       * Any tap finishes the writing or continues.
       * @returns {void}
       */
      tap() {
        if (scroll.state !== 'hidden' && scroll.state !== 'flying') {
          continueFromScroll();
        }
      },
      /**
       * Removes the continue hint.
       * @returns {void}
       */
      exit() {
        ui.hideHint();
      },
    },
    {
      ...BEATS[4],
      /**
       * Rolls the scroll away and sends the friends in along the beach.
       * @returns {void}
       */
      enter() {
        settleProps();
        fireworks.clear();
        polaroid.hide();
        resetAndrii();
        friends.enter();
        hugMelodyPlayed = false;
        ui.announce('На берег приходять друзі й міцно обіймають Андрія.');
      },
      /**
       * Turns Andrii to his friends, opens his arms for the hug, then everyone lines up facing the sea.
       * @param {number} beatTime Seconds into the beat.
       * @returns {void}
       */
      update(beatTime) {
        rig.hug(beatTime, clock.time);
        avatar.setPose('turn', beatTime >= 1.6 && beatTime < HUG_RELEASE_SECONDS + 0.6 ? 1 : 0);
        avatar.setPose('hug', beatTime >= 5 && beatTime < HUG_RELEASE_SECONDS ? 1 : 0);
        friends.hug(beatTime);
        if (!hugMelodyPlayed && beatTime >= 5) {
          hugMelodyPlayed = true;
          audio.playMelody({ level: 0.9 });
        }
      },
    },
    {
      ...BEATS[5],
      /**
       * Lines everyone up facing the sea and arms the fireworks.
       * @returns {void}
       */
      enter() {
        settleProps();
        polaroid.hide();
        resetAndrii();
        friends.standInLine(Math.PI);
        fireworks.start();
        audio.setSurf(0.7, 3);
        ui.announce('Над морем спалахує феєрверк, і вогні складаються в напис Happy Birthday!!! та ім’я АНДРІЙ.');
      },
      /**
       * Tilts the camera to the sky and launches rockets on schedule.
       * @param {number} beatTime Seconds into the beat.
       * @returns {void}
       */
      update(beatTime) {
        rig.sky(beatTime, clock.time);
        fireworks.play(beatTime);
      },
    },
    {
      ...BEATS[6],
      /**
       * Drops the polaroid and lets the last sparks fall.
       * @returns {void}
       */
      enter() {
        settleProps();
        fireworks.stopLaunching();
        fireworks.showName();
        polaroid.drop();
        shutterPlayed = false;
        if (!friends.visible) {
          friends.standInLine(Math.PI);
        }
        ui.announce('З неба плавно падає полароїд зі світлиною Андрія. Андрій і друзі обертаються і махають рукою.');
      },
      /**
       * Follows the polaroid down, then turns Andrii and his friends round to wave.
       * @param {number} beatTime Seconds into the beat.
       * @param {number} dt Seconds since the last frame.
       * @returns {void}
       */
      update(beatTime, dt) {
        rig.polaroid(beatTime, polaroid.position, clock.time, dt);
        avatar.setPose('turn', beatTime >= 5.8 ? 1 : 0);
        avatar.setPose('wave', beatTime >= 7.8 && beatTime < 12.5 ? 1 : 0);
        friends.reveal(beatTime);
        if (!shutterPlayed && polaroid.state === 'landed') {
          shutterPlayed = true;
          audio.shutter();
        }
      },
    },
    {
      ...BEATS[7],
      /**
       * Keeps the reveal in place (after a jump, snaps straight to it) with the name still glowing over the sea.
       * @returns {void}
       */
      enter() {
        settleProps();
        fireworks.stopLaunching();
        avatar.setPose('turn', 1);
        avatar.setPose('wave', 0);
        avatar.setPose('hug', 0);
        if (friends.visible) {
          friends.faceCamera();
        } else {
          friends.standInLine(0);
        }
        if (polaroid.state === 'hidden') {
          polaroid.setLanded();
          avatar.snapPose();
        }
        Object.assign(lookAround, { yaw: 0, pitch: 0, targetYaw: 0, targetPitch: 0, idleFor: 0 });
        fireworks.showName();
        replayShown = false;
        nextIdleMelody = 3;
        audio.setSurf(0.75, 3);
        ui.announce('Над морем світиться напис Happy Birthday!!! АНДРІЙ. Можна роззирнутися, потягнувши екран.');
      },
      /**
       * Settles into the night shot and follows the visitor's look-around, drifting gently when left alone.
       * @param {number} beatTime Seconds into the beat.
       * @param {number} dt Seconds since the last frame.
       * @returns {void}
       */
      update(beatTime, dt) {
        lookAround.idleFor += dt;
        if (!reducedMotion && lookAround.idleFor > 8) {
          const room = clamp01((innerWidth / innerHeight - 0.5) / 0.5);
          lookAround.targetYaw = damp(lookAround.targetYaw, Math.sin(clock.time * 0.07) * 0.12 * room, 0.4, dt);
          lookAround.targetPitch = damp(lookAround.targetPitch, 0, 0.4, dt);
        }
        lookAround.yaw = damp(lookAround.yaw, lookAround.targetYaw, 4, dt);
        lookAround.pitch = damp(lookAround.pitch, lookAround.targetPitch, 4, dt);
        rig.idle(beatTime, clock.time, lookAround.yaw, lookAround.pitch);
        if (beatTime >= nextIdleMelody) {
          nextIdleMelody += 48;
          audio.playMelody({ beat: 0.56, level: 0.75 });
        }
        if (!replayShown && beatTime >= 6) {
          replayShown = true;
          ui.showReplay(replay);
        }
      },
      /**
       * Turns and tilts the view a little, within limits that keep the group in sight.
       * @param {number} dx Horizontal pointer movement in pixels.
       * @param {number} dy Vertical pointer movement in pixels.
       * @returns {void}
       */
      drag(dx, dy) {
        lookAround.idleFor = 0;
        lookAround.targetYaw = THREE.MathUtils.clamp(lookAround.targetYaw - dx * 0.004, -0.6, 0.6);
        lookAround.targetPitch = THREE.MathUtils.clamp(lookAround.targetPitch + dy * 0.003, -0.15, 0.35);
      },
      /**
       * Hides the replay button and stops the tune when leaving the idle loop.
       * @returns {void}
       */
      exit() {
        ui.hideReplay();
        audio.stopMusic();
      },
    },
  ];
}

/**
 * Builds the scene and runs the render loop.
 * @returns {Promise<void>} Resolves once the first frame is scheduled.
 */
async function main() {
  const params = readParams();
  const quality = detectQuality();
  quality.reducedMotion ||= params.reduced;
  const ui = createUI(params);
  const audio = createAudio();
  ui.setupMute(audio.muted, (muted) => audio.setMuted(muted));
  const renderer = createRenderer(quality);
  const camera = createCamera();
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog('#E9B994', 70, 420);

  const sky = createSky(renderer);
  const lighting = createLighting(quality);
  const ocean = createOcean(sky.texture, quality);
  const beach = createBeach();
  const shore = createShoreProps();
  const avatar = createAvatar(AVATAR_LOOKS.andrii);
  const friends = createFriends();
  avatar.object3d.position.copy(AVATAR_SPOT);
  const bottle = createBottle(quality);
  const scroll = createScroll();
  const fireworks = createFireworks(quality.reducedMotion ? { ...quality, tier: 'low' } : quality);
  const polaroid = createPolaroid();
  const stars = createStars(quality);
  scene.add(sky.object3d, lighting.object3d, beach.object3d, shore.object3d, ocean.object3d, avatar.object3d, friends.object3d, bottle.object3d, scroll.object3d, fireworks.object3d, polaroid.object3d, stars.object3d);
  scene.environment = sky.texture;

  const sampleAtmosphere = createAtmosphereSampler();
  const rig = createCameraRig(camera, quality.reducedMotion);
  rig.setAspect(camera.aspect);
  fireworks.setAspect(camera.aspect);
  const guard = createPerformanceGuard(renderer, quality, () => stars.setPixelRatio(quality.pixelRatio));
  const clock = { time: 0 };
  const beats = [];
  const timeline = createTimeline(beats);
  beats.push(...createBeats({ ui, audio, rig, clock, avatar, friends, bottle, scroll, fireworks, polaroid, timeline, reducedMotion: quality.reducedMotion }));

  fireworks.setSoundHandler((type, value) => {
    if (type === 'launch') {
      audio.launch(value);
    } else if (type === 'burst') {
      audio.burst(value);
    } else {
      audio.chime(1.3);
    }
  });
  addEventListener('pointerdown', () => audio.unlock(), { once: true });
  addEventListener('keydown', () => audio.unlock(), { once: true });

  const pointer = createPointer(renderer.domElement, camera);
  pointer.onTap = (raycaster) => timeline.beat?.tap?.(raycaster);
  pointer.hoverTest = (raycaster) => timeline.beat?.hover?.(raycaster) ?? false;
  pointer.onDrag = (dx, dy) => timeline.beat?.drag?.(dx, dy);

  let controls = null;
  if (params.orbit) {
    rig.setEnabled(false);
    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(AVATAR_SPOT).add(new THREE.Vector3(0, 1.55, 0));
    camera.position.copy(AVATAR_SPOT).add(new THREE.Vector3(0.9, 1.7, -1.6));
    controls.enableDamping = true;
    controls.update();
  }

  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    fitCamera(camera);
    rig.setAspect(camera.aspect);
    fireworks.setAspect(camera.aspect);
  });

  const frameClock = new THREE.Clock();
  let fpsFrames = 0;
  let fpsElapsed = 0;
  let fps = 0;
  const lastCameraPosition = new THREE.Vector3();
  const lastCameraDirection = new THREE.Vector3();
  const cameraDirection = new THREE.Vector3();

  /**
   * Under reduced motion, dips to dark whenever the camera jumps to a new shot.
   * @returns {void}
   */
  function softenCuts() {
    camera.getWorldDirection(cameraDirection);
    const jumped = camera.position.distanceTo(lastCameraPosition) > 0.3 || cameraDirection.angleTo(lastCameraDirection) > 0.12;
    if (jumped && lastCameraDirection.lengthSq() > 0) {
      ui.dip();
    }
    lastCameraPosition.copy(camera.position);
    lastCameraDirection.copy(cameraDirection);
  }

  /**
   * Advances the story and world by one frame and renders it.
   * @param {number} [fixedDt] Simulated seconds for this frame; real elapsed time when omitted.
   * @param {boolean} [shouldRender] Whether to draw the frame.
   * @returns {void}
   */
  function frame(fixedDt, shouldRender = true) {
    const realDt = fixedDt ?? Math.min(frameClock.getDelta(), 0.1);
    const dt = realDt * params.speed;
    clock.time += dt;
    timeline.update(dt);
    const atmosphere = sampleAtmosphere(params.dusk ?? duskAt(timeline.storyTime));
    sky.update(atmosphere);
    lighting.update(atmosphere, sky.sunDirection);
    ocean.update(clock.time, atmosphere, sky.sunDirection);
    scene.fog.color.copy(atmosphere.fog);
    stars.update(atmosphere.dusk, clock.time);
    scene.environmentIntensity = atmosphere.environment;
    renderer.toneMappingExposure = atmosphere.exposure;
    avatar.update(dt, clock.time);
    friends.update(dt, clock.time);
    bottle.update(dt, clock.time);
    polaroid.update(dt);
    controls?.update();
    scroll.update(dt, camera);
    fireworks.update(dt, camera, renderer);
    if (quality.reducedMotion && !controls) {
      softenCuts();
    }
    if (fixedDt === undefined) {
      guard.sample(realDt);
    }
    if (shouldRender) {
      renderer.render(scene, camera);
    }

    fpsFrames += 1;
    fpsElapsed += realDt;
    if (fpsElapsed >= 0.5) {
      fps = Math.round(fpsFrames / fpsElapsed);
      fpsFrames = 0;
      fpsElapsed = 0;
    }
    ui.setDebug(`${fps} fps · ${quality.tier} · ${quality.pixelRatio.toFixed(2)}x${quality.shadows ? '' : ' no shadows'}${quality.reducedMotion ? ' · reduced' : ''}\nbeat ${timeline.index} ${timeline.beat.name}\nstory ${timeline.storyTime.toFixed(1)} s · dusk ${atmosphere.dusk.toFixed(2)}\nbottle ${bottle.state} · scroll ${scroll.state}\nparticles ${fireworks.activeCount} · polaroid ${polaroid.state}\ncalls ${renderer.info.render.calls} · sound ${audio.state}${audio.muted ? ' muted' : ''}`);
  }

  if (params.beat === null) {
    timeline.goTo(0);
    waitForAssets(8000).then(() => ui.enableStart(() => {
      audio.unlock();
      timeline.goTo(1);
    }));
  } else {
    document.getElementById('start').style.transition = 'none';
    ui.hideStart();
    ui.showMute();
    timeline.goTo(params.beat);
  }
  renderer.setAnimationLoop(() => frame());

  /**
   * Debug helper: runs the story forward by simulated time at 30 steps a second, drawing only the last frame.
   * @param {number} seconds Simulated seconds to advance.
   * @returns {string} Current beat and prop states.
   */
  function advance(seconds) {
    const steps = Math.max(1, Math.round(seconds * 30));
    for (let i = 0; i < steps; i += 1) {
      frame(1 / 30 / params.speed, i === steps - 1);
    }
    return `${timeline.beat.name} · bottle ${bottle.state} · scroll ${scroll.state}`;
  }

  if (params.debug) {
    window.birthday = { THREE, scene, camera, renderer, audio, avatar, friends, bottle, scroll, fireworks, polaroid, stars, timeline, rig, controls, sky, frame, advance, waveHeightAt, sandHeightAt, AVATAR_SPOT };
  }
}

main();
</script>
</body>
</html>
