<!doctype html>
<html lang="uk">
<head>

<title>Для Андрія</title>
<meta name="description" content="З днем народження, Андрію! Від Ігоря й Дарини.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Для Андрія">
<meta property="og:description" content="З днем народження, Андрію! Від Ігоря й Дарини.">
<meta name="theme-color" content="#1F2A44">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F2A44;
    --red: #D62B3A;
    --sand: #E8D3A8;
    --gold: #FFC86B;
    --ink: #F6EFE3;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0d1424;
    color: var(--ink);
    font-family: Rubik, system-ui, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    background: radial-gradient(ellipse at 50% 60%, rgba(31, 42, 68, 0.35), rgba(13, 20, 36, 0.82));
    transition: opacity 0.9s ease;
  }
  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .start-card {
    text-align: center;
    max-width: 420px;
  }
  .start-card h1 {
    margin: 0 0 28px;
    font-size: clamp(40px, 9vw, 72px);
    font-weight: 700;
    letter-spacing: 0.01em;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.45);
  }
  .start-card button {
    font: 700 20px Rubik, system-ui, sans-serif;
    color: #fff;
    background: var(--red);
    border: 0;
    border-radius: 999px;
    padding: 16px 44px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(214, 43, 58, 0.45);
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.3s ease;
  }
  .start-card button:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 34px rgba(214, 43, 58, 0.55);
  }
  .start-card button:disabled {
    opacity: 0.5;
    cursor: progress;
  }
  .start-card p {
    margin: 20px 0 0;
    font-size: 15px;
    opacity: 0.75;
  }
  #debug {
    position: fixed;
    top: 8px;
    left: 8px;
    padding: 4px 8px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.55);
    font: 12px/1.4 ui-monospace, Menlo, monospace;
    white-space: pre;
    pointer-events: none;
  }
  .hint {
    position: fixed;
    left: 50%;
    bottom: max(28px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font: 600 17px Rubik, system-ui, sans-serif;
    color: var(--ink);
    background: rgba(31, 42, 68, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    padding: 12px 26px;
    white-space: nowrap;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    cursor: pointer;
    transition: opacity 0.6s ease, transform 0.6s ease;
    animation: hint-pulse 2.4s ease-in-out infinite;
  }
  .hint.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 10px);
    animation: none;
  }
  @keyframes hint-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 200, 107, 0); }
    50% { box-shadow: 0 0 0 8px rgba(255, 200, 107, 0.2); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint { animation: none; }
  }
  .round-button {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(31, 42, 68, 0.55);
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: opacity 0.6s ease;
  }
  .round-button svg {
    width: 22px;
    height: 22px;
  }
  .round-button.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .round-button .icon-muted,
  .round-button[aria-pressed="true"] .icon-sound {
    display: none;
  }
  .round-button[aria-pressed="true"] .icon-muted {
    display: block;
  }
  .replay {
    background: var(--red);
    border-color: transparent;
    box-shadow: 0 10px 30px rgba(214, 43, 58, 0.45);
    animation: none;
  }
  .fade {
    position: fixed;
    inset: 0;
    background: #0B1020;
    opacity: 0;
    pointer-events: none;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<body>
<div id="fade" class="fade"></div>
<div id="start" class="overlay">
  <div class="start-card">
    <h1>Для Андрія</h1>
    <button id="startButton" type="button" disabled aria-busy="true">Завантаження…</button>
    <p>Увімкни звук — буде музика</p>
  </div>
</div>
<button id="hint" class="hint hidden" type="button"></button>
<button id="replayButton" class="hint replay hidden" type="button">Ще раз</button>
<button id="muteButton" class="round-button hidden" type="button" aria-pressed="false" aria-label="Вимкнути звук">
  <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
</button>
<div id="announcer" class="sr-only" aria-live="polite"></div>
<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const PALETTE = {
  navy: '#1F2A44',
  red: '#D62B3A',
  seaLight: '#4F8A7B',
  seaDeep: '#2E5E66',
  sand: '#E8D3A8',
  wetSand: '#A88E68',
  seabed: '#6E6650',
  gold: '#FFC86B',
};

const WAVES = [
  { direction: new THREE.Vector2(0.15, 1).normalize(), wavelength: 21, steepness: 0.13 },
  { direction: new THREE.Vector2(-0.32, 1).normalize(), wavelength: 12, steepness: 0.11 },
  { direction: new THREE.Vector2(0.55, 1).normalize(), wavelength: 6.5, steepness: 0.09 },
  { direction: new THREE.Vector2(-0.12, 1).normalize(), wavelength: 3.6, steepness: 0.07 },
];
const WAVE_DAMP_SHALLOW = 0.2;
const WAVE_DAMP_DEPTH = 4;
const GRAVITY = 9.8;
const SUN_AZIMUTH = 168;
const OCEAN_CENTER_Z = -10;

const BEATS = [
  { name: 'Старт', start: 0 },
  { name: 'Прибуття', start: 0, duration: 10 },
  { name: 'Пляшка', start: 10 },
  { name: 'Сувій', start: 25 },
  { name: 'Обійми', start: 45, duration: 14 },
  { name: 'Феєрверк', start: 59, duration: 25 },
  { name: 'Полароїд', start: 84, duration: 15 },
  { name: 'Фінал', start: 99 },
];

const ATMOSPHERE_KEYS = [
  { at: 0, sunElevation: 3, turbidity: 6, rayleigh: 3, mie: 0.007, sun: '#FFB676', sunIntensity: 2.4, hemiSky: '#F6C59A', hemiGround: '#8A6446', hemiIntensity: 1.1, fog: '#E9B48E', exposure: 0.4, environment: 0.9, moonIntensity: 0 },
  { at: 0.45, sunElevation: 0.8, turbidity: 10, rayleigh: 3.2, mie: 0.008, sun: '#FF8550', sunIntensity: 1.5, hemiSky: '#DE9A86', hemiGround: '#5E4036', hemiIntensity: 0.8, fog: '#D38C76', exposure: 0.55, environment: 0.75, moonIntensity: 0 },
  { at: 0.75, sunElevation: -2.5, turbidity: 10, rayleigh: 3.5, mie: 0.006, sun: '#FF6B4F', sunIntensity: 0.25, hemiSky: '#6370A0', hemiGround: '#2B2A38', hemiIntensity: 0.6, fog: '#45507A', exposure: 0.85, environment: 0.6, moonIntensity: 0.35 },
  { at: 1, sunElevation: -7, turbidity: 10, rayleigh: 3.5, mie: 0.005, sun: '#6F86C8', sunIntensity: 0, hemiSky: '#2C3A68', hemiGround: '#141621', hemiIntensity: 0.5, fog: '#18203A', exposure: 1.1, environment: 0.5, moonIntensity: 0.8 },
].map(toAtmosphereKey);

const SAND_HEIGHT_GLSL = `
float sandHeight(vec2 p) {
  float shoreZ = 2.2 * sin(p.x * 0.045) + 0.9 * sin(p.x * 0.13 + 1.7);
  float along = p.y - shoreZ;
  float slope = along * 0.07;
  float ripples = 0.05 * sin(p.x * 0.31 + p.y * 0.17) + 0.03 * sin(p.x * 0.83 - p.y * 0.52);
  float dunes = smoothstep(14.0, 45.0, along) * 2.4;
  float seabed = min(along, 0.0) * 0.03;
  return slope + ripples + dunes + seabed;
}
`;

/**
 * Clamps a number to the 0..1 range.
 * @param {number} value Any number.
 * @returns {number} The clamped value.
 */
function clamp01(value) {
  return Math.min(1, Math.max(0, value));
}

/**
 * Linear interpolation between two numbers.
 * @param {number} from Start value.
 * @param {number} to End value.
 * @param {number} amount Blend factor, 0 gives `from` and 1 gives `to`.
 * @returns {number} The interpolated value.
 */
function lerp(from, to, amount) {
  return from + (to - from) * amount;
}

/**
 * Hermite smoothstep, identical to the GLSL built-in.
 * @param {number} edge0 Lower edge.
 * @param {number} edge1 Upper edge.
 * @param {number} value Input value.
 * @returns {number} 0..1 with smooth ends.
 */
function smoothstep(edge0, edge1, value) {
  const t = clamp01((value - edge0) / (edge1 - edge0));
  return t * t * (3 - 2 * t);
}

/**
 * Cubic ease-in-out curve.
 * @param {number} t Progress 0..1.
 * @returns {number} Eased progress.
 */
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/**
 * Frame-rate independent exponential approach toward a target.
 * @param {number} current Current value.
 * @param {number} target Target value.
 * @param {number} lambda Speed; higher reaches the target faster.
 * @param {number} dt Seconds since the last frame.
 * @returns {number} The new value.
 */
function damp(current, target, lambda, dt) {
  return lerp(current, target, 1 - Math.exp(-lambda * dt));
}

/**
 * Creates a small seeded pseudo-random generator (mulberry32).
 * @param {number} seed Integer seed.
 * @returns {() => number} Function returning floats in 0..1.
 */
function createRandom(seed) {
  let state = seed >>> 0;
  return function random() {
    state = (state + 0x6d2b79f5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * Height of the sand surface at a world position. Mirrors `sandHeight` in the ocean shader.
 * @param {number} x World x.
 * @param {number} z World z (the sea is toward negative z).
 * @returns {number} Sand height in metres, 0 is the resting water level.
 */
function sandHeightAt(x, z) {
  const shoreZ = 2.2 * Math.sin(x * 0.045) + 0.9 * Math.sin(x * 0.13 + 1.7);
  const along = z - shoreZ;
  const slope = along * 0.07;
  const ripples = 0.05 * Math.sin(x * 0.31 + z * 0.17) + 0.03 * Math.sin(x * 0.83 - z * 0.52);
  const dunes = smoothstep(14, 45, along) * 2.4;
  const seabed = Math.min(along, 0) * 0.03;
  return slope + ripples + dunes + seabed;
}

/**
 * Wave strength at a rest position: waves calm down as the water gets shallow.
 * @param {number} x World x.
 * @param {number} z World z.
 * @returns {number} Multiplier 0..1 for wave steepness.
 */
function waveDampAt(x, z) {
  return lerp(WAVE_DAMP_SHALLOW, 1, smoothstep(0, WAVE_DAMP_DEPTH, -sandHeightAt(x, z)));
}

/**
 * Gerstner displacement of a water rest point. Mirrors the ocean vertex shader.
 * @param {number} x Rest x.
 * @param {number} z Rest z.
 * @param {number} time World time in seconds.
 * @param {{x: number, y: number, z: number}} out Receives the displaced position.
 * @returns {{x: number, y: number, z: number}} The `out` object.
 */
function waveDisplacement(x, z, time, out) {
  const strength = waveDampAt(x, z);
  out.x = x;
  out.y = 0;
  out.z = z;
  for (const wave of WAVES) {
    const k = (Math.PI * 2) / wave.wavelength;
    const speed = Math.sqrt(GRAVITY / k);
    const steepness = wave.steepness * strength;
    const amplitude = steepness / k;
    const phase = k * (wave.direction.x * x + wave.direction.y * z - speed * time);
    const cosPhase = Math.cos(phase);
    out.x += wave.direction.x * amplitude * cosPhase;
    out.y += amplitude * Math.sin(phase);
    out.z += wave.direction.y * amplitude * cosPhase;
  }
  return out;
}

/**
 * Water surface height at a world position, inverting the horizontal Gerstner shift with a few fixed-point steps.
 * @param {number} x World x.
 * @param {number} z World z.
 * @param {number} time World time in seconds.
 * @returns {number} Water height in metres.
 */
function waveHeightAt(x, z, time) {
  const displaced = { x: 0, y: 0, z: 0 };
  let restX = x;
  let restZ = z;
  for (let step = 0; step < 3; step += 1) {
    waveDisplacement(restX, restZ, time, displaced);
    restX += x - displaced.x;
    restZ += z - displaced.z;
  }
  return waveDisplacement(restX, restZ, time, displaced).y;
}

const AVATAR_SPOT = new THREE.Vector3(0.6, sandHeightAt(0.6, 4.4), 4.4);

/**
 * Converts a raw atmosphere keyframe so colours are THREE.Color instances.
 * @param {object} key Keyframe with hex colour strings.
 * @returns {object} Keyframe with THREE.Color values.
 */
function toAtmosphereKey(key) {
  return {
    ...key,
    sun: new THREE.Color(key.sun),
    hemiSky: new THREE.Color(key.hemiSky),
    hemiGround: new THREE.Color(key.hemiGround),
    fog: new THREE.Color(key.fog),
  };
}

/**
 * Creates a reusable sampler that blends atmosphere keyframes for a dusk value.
 * @returns {(dusk: number) => object} Sampler returning the same mutable object each call.
 */
function createAtmosphereSampler() {
  const state = toAtmosphereKey({ ...ATMOSPHERE_KEYS[0], sun: '#fff', hemiSky: '#fff', hemiGround: '#fff', fog: '#fff' });
  const numericKeys = ['sunElevation', 'turbidity', 'rayleigh', 'mie', 'sunIntensity', 'hemiIntensity', 'exposure', 'environment', 'moonIntensity'];
  const colorKeys = ['sun', 'hemiSky', 'hemiGround', 'fog'];
  return function sampleAtmosphere(dusk) {
    const clamped = clamp01(dusk);
    let upper = ATMOSPHERE_KEYS.findIndex((key) => key.at >= clamped);
    upper = Math.max(1, upper);
    const from = ATMOSPHERE_KEYS[upper - 1];
    const to = ATMOSPHERE_KEYS[upper];
    const amount = smoothstep(0, 1, (clamped - from.at) / (to.at - from.at));
    for (const name of numericKeys) {
      state[name] = lerp(from[name], to[name], amount);
    }
    for (const name of colorKeys) {
      state[name].copy(from[name]).lerp(to[name], amount);
    }
    state.dusk = clamped;
    return state;
  };
}

/**
 * Maps story time to the dusk value that drives sky and light.
 * @param {number} storyTime Seconds since the arrival beat began.
 * @returns {number} Dusk 0 (golden hour) .. 1 (night).
 */
function duskAt(storyTime) {
  return smoothstep(5, 102, storyTime);
}

/**
 * Reads development switches from the page URL.
 * @returns {{beat: number|null, speed: number, debug: boolean, orbit: boolean, reduced: boolean, dusk: number|null}} Parsed switches.
 */
function readParams() {
  const search = new URLSearchParams(location.search);
  const beat = search.has('beat') ? Number(search.get('beat')) : NaN;
  const dusk = search.has('dusk') ? Number(search.get('dusk')) : NaN;
  return {
    beat: Number.isFinite(beat) ? Math.min(BEATS.length - 1, Math.max(0, Math.round(beat))) : null,
    speed: Math.max(0.1, Number(search.get('speed')) || 1),
    debug: search.get('debug') === '1',
    orbit: search.get('orbit') === '1',
    reduced: search.get('reduced') === '1',
    dusk: Number.isFinite(dusk) ? clamp01(dusk) : null,
  };
}

const assetLoads = [];

/**
 * Registers a loading asset, so the start screen can wait for photos and fonts before it lets the story begin.
 * @param {Promise<unknown>} promise Settles when the asset is ready or has failed.
 * @returns {Promise<unknown>} The same promise.
 */
function trackAsset(promise) {
  assetLoads.push(promise.catch(() => {}));
  return promise;
}

/**
 * Loads an image and registers it as a start-screen asset.
 * @param {string} src Image URL.
 * @param {(image: HTMLImageElement) => void} onLoad Called with the decoded image.
 * @returns {void}
 */
function loadImage(src, onLoad) {
  const image = new Image();
  trackAsset(new Promise((resolve, reject) => {
    image.addEventListener('load', () => {
      onLoad(image);
      resolve();
    });
    image.addEventListener('error', reject);
  }));
  image.src = src;
}

/**
 * Waits for every registered asset, or for the timeout, whichever comes first.
 * @param {number} timeoutMs Longest wait in milliseconds.
 * @returns {Promise<void>} Resolves when loading is done or the wait is over.
 */
function waitForAssets(timeoutMs) {
  return Promise.race([
    Promise.all(assetLoads),
    new Promise((resolve) => setTimeout(resolve, timeoutMs)),
  ]).then(() => {});
}

/**
 * Picks a rendering quality tier from the device.
 * @returns {{tier: string, reducedMotion: boolean, pixelRatio: number, shadows: boolean, oceanSegments: number}} Quality settings.
 */
function detectQuality() {
  const coarsePointer = matchMedia('(pointer: coarse)').matches;
  const smallScreen = Math.min(screen.width, screen.height) < 700;
  const fewCores = (navigator.hardwareConcurrency || 4) <= 4;
  const tier = coarsePointer || smallScreen || fewCores ? 'low' : 'high';
  return {
    tier,
    reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
    pixelRatio: Math.min(devicePixelRatio, tier === 'high' ? 2 : 1.5),
    shadows: tier === 'high',
    oceanSegments: tier === 'high' ? 320 : 200,
  };
}

/**
 * Watches the real frame rate and steps quality down when the device can't keep up:
 * first the pixel ratio, in steps down to 1, then the sun's shadows.
 * @param {THREE.WebGLRenderer} renderer Renderer to adjust.
 * @param {{tier: string, pixelRatio: number, shadows: boolean}} quality Quality settings, updated in place.
 * @param {(quality: object) => void} onChange Called after each step down.
 * @returns {{sample: (dt: number) => void}} Guard fed with the real seconds of each frame.
 */
function createPerformanceGuard(renderer, quality, onChange) {
  const targetFps = quality.tier === 'high' ? 50 : 30;
  let warmup = 1.5;
  let frames = 0;
  let elapsed = 0;
  return {
    /**
     * Adds one frame to the running measurement and steps quality down after a slow two-second window.
     * @param {number} dt Real seconds the frame took.
     * @returns {void}
     */
    sample(dt) {
      if (document.hidden || dt >= 0.1) {
        return;
      }
      if (warmup > 0) {
        warmup -= dt;
        return;
      }
      frames += 1;
      elapsed += dt;
      if (elapsed < 2) {
        return;
      }
      const fps = frames / elapsed;
      frames = 0;
      elapsed = 0;
      if (fps >= targetFps) {
        return;
      }
      if (quality.pixelRatio > 1) {
        quality.pixelRatio = Math.max(1, quality.pixelRatio * 0.8);
        renderer.setPixelRatio(quality.pixelRatio);
      } else if (quality.shadows) {
        quality.shadows = false;
      } else {
        return;
      }
      onChange(quality);
    },
  };
}

/**
 * Frees GPU resources held by an object tree.
 * @param {THREE.Object3D} root Object to dispose, including descendants.
 * @returns {void}
 */
function disposeObject(root) {
  root.traverse((child) => {
    child.geometry?.dispose();
    const materials = Array.isArray(child.material) ? child.material : [child.material];
    for (const material of materials) {
      material?.dispose();
    }
  });
}

/**
 * Creates the WebGL renderer and attaches its canvas.
 * @param {{pixelRatio: number, shadows: boolean}} quality Quality settings.
 * @returns {THREE.WebGLRenderer} The renderer.
 */
function createRenderer(quality) {
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(quality.pixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = quality.shadows;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);
  return renderer;
}

/**
 * Creates the main perspective camera.
 * @returns {THREE.PerspectiveCamera} The camera.
 */
function createCamera() {
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 12000);
  fitCamera(camera);
  return camera;
}

/**
 * Updates aspect and field of view so portrait screens keep enough horizontal view.
 * @param {THREE.PerspectiveCamera} camera Camera to adjust.
 * @returns {void}
 */
function fitCamera(camera) {
  const aspect = innerWidth / innerHeight;
  const minHorizontalFov = THREE.MathUtils.degToRad(62);
  const fovForWidth = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(minHorizontalFov / 2) / aspect));
  camera.aspect = aspect;
  camera.fov = Math.min(75, Math.max(45, fovForWidth));
  camera.updateProjectionMatrix();
}

/**
 * Creates the beat state machine that drives the story.
 * @param {Array<object>} beats Beat definitions with optional enter, update and exit hooks.
 * @returns {object} Timeline controller.
 */
function createTimeline(beats) {
  let index = -1;
  let beatTime = 0;
  let storyTime = 0;

  /**
   * Leaves the current beat and enters another.
   * @param {number} nextIndex Beat index.
   * @returns {void}
   */
  function goTo(nextIndex) {
    beats[index]?.exit?.();
    index = nextIndex;
    beatTime = 0;
    storyTime = beats[index].start;
    beats[index].enter?.();
  }

  /**
   * Moves to the following beat, if any.
   * @returns {void}
   */
  function next() {
    if (index < beats.length - 1) {
      goTo(index + 1);
    }
  }

  /**
   * Advances time inside the current beat.
   * @param {number} dt Seconds since the last frame, already scaled by speed.
   * @returns {void}
   */
  function update(dt) {
    const beat = beats[index];
    if (!beat) {
      return;
    }
    beatTime += dt;
    const beatEnd = beats[index + 1]?.start ?? Infinity;
    storyTime = index === 0 ? 0 : Math.min(beat.start + beatTime, beatEnd);
    beat.update?.(beatTime, dt);
    if (beat.duration && beatTime >= beat.duration) {
      next();
    }
  }

  return {
    goTo,
    next,
    update,
    get index() {
      return index;
    },
    get beat() {
      return beats[index];
    },
    get beatTime() {
      return beatTime;
    },
    get storyTime() {
      return storyTime;
    },
  };
}

/**
 * Creates the DOM interface: start screen, hints, replay and mute buttons, screen-reader announcer and debug readout.
 * @param {{debug: boolean}} params Development switches.
 * @returns {object} UI controller.
 */
function createUI(params) {
  const start = document.getElementById('start');
  const startButton = document.getElementById('startButton');
  const announcer = document.getElementById('announcer');
  const hint = document.getElementById('hint');
  const replayButton = document.getElementById('replayButton');
  const muteButton = document.getElementById('muteButton');
  const fade = document.getElementById('fade');
  let hintAction = null;
  let replayAction = null;

  /**
   * Shows the mute state on the button.
   * @param {boolean} muted True when sound is off.
   * @returns {void}
   */
  function renderMute(muted) {
    muteButton.setAttribute('aria-pressed', String(muted));
    muteButton.setAttribute('aria-label', muted ? 'Увімкнути звук' : 'Вимкнути звук');
  }
  let debugPanel = null;
  if (params.debug) {
    debugPanel = document.createElement('div');
    debugPanel.id = 'debug';
    document.body.append(debugPanel);
  }

  return {
    /**
     * Enables the start button once the scene is ready.
     * @param {() => void} onStart Called when the visitor presses «Почати».
     * @returns {void}
     */
    enableStart(onStart) {
      startButton.disabled = false;
      startButton.removeAttribute('aria-busy');
      startButton.textContent = 'Почати';
      startButton.addEventListener('click', onStart, { once: true });
      startButton.focus();
    },
    /**
     * Dips the screen to dark and back, to soften a camera cut under reduced motion.
     * @returns {void}
     */
    dip() {
      fade.style.transition = 'none';
      fade.style.opacity = '0.85';
      void fade.offsetWidth;
      fade.style.transition = 'opacity 0.7s ease';
      fade.style.opacity = '0';
    },
    /**
     * Shows the start screen.
     * @returns {void}
     */
    showStart() {
      start.classList.remove('hidden');
    },
    /**
     * Fades the start screen out.
     * @returns {void}
     */
    hideStart() {
      start.classList.add('hidden');
    },
    /**
     * Reads text to screen-reader users.
     * @param {string} text Text to announce.
     * @returns {void}
     */
    announce(text) {
      announcer.textContent = text;
    },
    /**
     * Writes the debug readout, when debug mode is on.
     * @param {string} text Readout text.
     * @returns {void}
     */
    setDebug(text) {
      if (debugPanel) {
        debugPanel.textContent = text;
      }
    },
    /**
     * Shows the hint pill; it is a real button, so keyboard users can act on it too.
     * @param {string} text Hint text.
     * @param {() => void} onClick Called when the hint is pressed.
     * @returns {void}
     */
    showHint(text, onClick) {
      if (hintAction) {
        hint.removeEventListener('click', hintAction);
      }
      hintAction = onClick;
      hint.textContent = text;
      hint.addEventListener('click', hintAction);
      hint.classList.remove('hidden');
    },
    /**
     * Wires the mute toggle.
     * @param {boolean} muted Initial state.
     * @param {(muted: boolean) => void} onToggle Called with the new state.
     * @returns {void}
     */
    setupMute(muted, onToggle) {
      renderMute(muted);
      muteButton.addEventListener('click', () => {
        const next = muteButton.getAttribute('aria-pressed') !== 'true';
        renderMute(next);
        onToggle(next);
      });
    },
    /**
     * Shows the mute toggle once the story has started.
     * @returns {void}
     */
    showMute() {
      muteButton.classList.remove('hidden');
    },
    /**
     * Shows the «Ще раз» button.
     * @param {() => void} onReplay Called when it is pressed.
     * @returns {void}
     */
    showReplay(onReplay) {
      if (replayAction) {
        replayButton.removeEventListener('click', replayAction);
      }
      replayAction = onReplay;
      replayButton.addEventListener('click', replayAction);
      replayButton.classList.remove('hidden');
    },
    /**
     * Hides the «Ще раз» button.
     * @returns {void}
     */
    hideReplay() {
      if (replayAction) {
        replayButton.removeEventListener('click', replayAction);
        replayAction = null;
      }
      replayButton.classList.add('hidden');
      if (document.activeElement === replayButton) {
        replayButton.blur();
      }
    },
    /**
     * Hides the hint pill.
     * @returns {void}
     */
    hideHint() {
      if (hintAction) {
        hint.removeEventListener('click', hintAction);
        hintAction = null;
      }
      hint.classList.add('hidden');
    },
  };
}

/**
 * Creates a gradient dome that fades in over the physical sky for blue hour and night,
 * where the Sky addon turns muddy.
 * @returns {{object3d: THREE.Mesh, update: (dusk: number, sunDirection: THREE.Vector3) => void}} Night dome.
 */
function createNightDome() {
  const uniforms = {
    uOpacity: { value: 0 },
    uGlowAmount: { value: 1 },
    uZenith: { value: new THREE.Color('#081028') },
    uHorizon: { value: new THREE.Color('#34416E') },
    uGlow: { value: new THREE.Color('#C0685E') },
    uSunDir: { value: new THREE.Vector3(0, 0, -1) },
  };
  const material = new THREE.ShaderMaterial({
    uniforms,
    side: THREE.BackSide,
    transparent: true,
    depthWrite: false,
    vertexShader: `
      varying vec3 vDirection;
      void main() {
        vDirection = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uOpacity;
      uniform float uGlowAmount;
      uniform vec3 uZenith;
      uniform vec3 uHorizon;
      uniform vec3 uGlow;
      uniform vec3 uSunDir;
      varying vec3 vDirection;
      void main() {
        vec3 direction = normalize(vDirection);
        float height = max(direction.y, 0.0);
        vec3 color = mix(uHorizon, uZenith, pow(height, 0.45));
        vec2 flatDirection = normalize(direction.xz + 1e-5);
        vec2 flatSun = normalize(uSunDir.xz + 1e-5);
        float glow = pow(max(dot(flatDirection, flatSun), 0.0), 5.0) * (1.0 - smoothstep(0.0, 0.3, height));
        color += uGlow * glow * uGlowAmount;
        gl_FragColor = vec4(color, uOpacity);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(2000, 32, 16), material);
  mesh.renderOrder = -1;

  return {
    object3d: mesh,
    /**
     * Fades the dome in with dusk and points its afterglow at the set sun.
     * @param {number} dusk Dusk 0..1.
     * @param {THREE.Vector3} sunDirection Unit vector toward the sun.
     * @returns {void}
     */
    update(dusk, sunDirection) {
      uniforms.uOpacity.value = smoothstep(0.42, 0.82, dusk);
      uniforms.uGlowAmount.value = 1 - smoothstep(0.75, 1, dusk) * 0.85;
      uniforms.uSunDir.value.copy(sunDirection);
    },
  };
}

/**
 * Creates the sky dome plus a cube map of it used for water reflections and image-based light.
 * @param {THREE.WebGLRenderer} renderer Renderer used to refresh the cube map.
 * @returns {object} Sky controller with `object3d`, `texture`, `sunDirection` and `update`.
 */
function createSky(renderer) {
  const group = new THREE.Group();
  const sky = new Sky();
  sky.scale.setScalar(5000);
  const nightDome = createNightDome();
  group.add(sky, nightDome.object3d);
  const reflectionScene = new THREE.Scene();
  const reflectionSky = new THREE.Mesh(sky.geometry, sky.material);
  reflectionSky.scale.setScalar(5000);
  reflectionScene.add(reflectionSky, new THREE.Mesh(nightDome.object3d.geometry, nightDome.object3d.material));
  const cubeTarget = new THREE.WebGLCubeRenderTarget(128, { type: THREE.HalfFloatType });
  const cubeCamera = new THREE.CubeCamera(1, 20000, cubeTarget);
  const sunDirection = new THREE.Vector3();
  const uniforms = sky.material.uniforms;
  let lastDusk = -1;

  /**
   * Applies an atmosphere state and refreshes the reflection cube when it changed.
   * @param {object} atmosphere Sampled atmosphere.
   * @returns {void}
   */
  function update(atmosphere) {
    if (Math.abs(atmosphere.dusk - lastDusk) < 0.002) {
      return;
    }
    lastDusk = atmosphere.dusk;
    sunDirection.setFromSphericalCoords(
      1,
      THREE.MathUtils.degToRad(90 - atmosphere.sunElevation),
      THREE.MathUtils.degToRad(SUN_AZIMUTH),
    );
    uniforms.sunPosition.value.copy(sunDirection);
    uniforms.turbidity.value = atmosphere.turbidity;
    uniforms.rayleigh.value = atmosphere.rayleigh;
    uniforms.mieCoefficient.value = atmosphere.mie;
    uniforms.mieDirectionalG.value = 0.86;
    nightDome.update(atmosphere.dusk, sunDirection);
    cubeCamera.update(renderer, reflectionScene);
  }

  return {
    object3d: group,
    texture: cubeTarget.texture,
    sunDirection,
    update,
    /**
     * Frees the sky resources.
     * @returns {void}
     */
    dispose() {
      cubeTarget.dispose();
      disposeObject(group);
    },
  };
}

/**
 * Creates the sun and ambient lights.
 * @param {{shadows: boolean}} quality Quality settings.
 * @returns {object} Lighting controller.
 */
function createLighting(quality) {
  const group = new THREE.Group();
  const sun = new THREE.DirectionalLight('#ffffff', 2);
  sun.target.position.copy(AVATAR_SPOT);
  sun.castShadow = quality.shadows;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -7;
  sun.shadow.camera.right = 7;
  sun.shadow.camera.top = 7;
  sun.shadow.camera.bottom = -7;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 90;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.02;
  const hemisphere = new THREE.HemisphereLight('#ffffff', '#000000', 0.5);
  const moon = new THREE.DirectionalLight('#A8B8FF', 0);
  moon.target.position.copy(AVATAR_SPOT);
  moon.position.copy(AVATAR_SPOT).add(new THREE.Vector3(-3, 8, 6).normalize().multiplyScalar(30));
  group.add(sun, sun.target, hemisphere, moon, moon.target);

  return {
    object3d: group,
    /**
     * Matches the lights to the atmosphere and sun direction.
     * @param {object} atmosphere Sampled atmosphere.
     * @param {THREE.Vector3} sunDirection Unit vector toward the sun.
     * @returns {void}
     */
    update(atmosphere, sunDirection) {
      const lightDirection = sunDirection.clone();
      lightDirection.y = Math.max(lightDirection.y, 0.035);
      sun.position.copy(AVATAR_SPOT).addScaledVector(lightDirection.normalize(), 40);
      sun.color.copy(atmosphere.sun);
      sun.intensity = atmosphere.sunIntensity * smoothstep(-4, 1, atmosphere.sunElevation);
      sun.castShadow = quality.shadows && sun.intensity > 0.05;
      hemisphere.color.copy(atmosphere.hemiSky);
      hemisphere.groundColor.copy(atmosphere.hemiGround);
      hemisphere.intensity = atmosphere.hemiIntensity;
      moon.intensity = atmosphere.moonIntensity;
    },
  };
}

/**
 * Spreads a -1..1 grid coordinate so vertices are dense near the shore and sparse toward the horizon.
 * @param {number} value Grid coordinate in -1..1.
 * @returns {number} World distance in metres.
 */
function stretchOceanAxis(value) {
  const magnitude = Math.abs(value);
  return Math.sign(value) * (120 * magnitude + 2900 * Math.pow(magnitude, 4));
}

/**
 * Creates the ocean: a Gerstner-wave shader plane reflecting the sky cube.
 * @param {THREE.Texture} skyTexture Cube map of the sky.
 * @param {{oceanSegments: number}} quality Quality settings.
 * @returns {object} Ocean controller.
 */
function createOcean(skyTexture, quality) {
  const geometry = new THREE.PlaneGeometry(2, 2, quality.oceanSegments, quality.oceanSegments);
  geometry.rotateX(-Math.PI / 2);
  const position = geometry.attributes.position;
  for (let i = 0; i < position.count; i += 1) {
    position.setX(i, stretchOceanAxis(position.getX(i)));
    position.setZ(i, stretchOceanAxis(position.getZ(i)) + OCEAN_CENTER_Z);
  }

  const uniforms = {
    uTime: { value: 0 },
    uWaves: { value: WAVES.map((wave) => new THREE.Vector4(wave.direction.x, wave.direction.y, wave.wavelength, wave.steepness)) },
    uDampShallow: { value: WAVE_DAMP_SHALLOW },
    uDampDepth: { value: WAVE_DAMP_DEPTH },
    uSunDir: { value: new THREE.Vector3(0, 0.1, -1) },
    uSunColor: { value: new THREE.Color() },
    uSkyCube: { value: skyTexture },
    uShallow: { value: new THREE.Color(PALETTE.seaLight) },
    uDeep: { value: new THREE.Color(PALETTE.seaDeep) },
    uWaterLight: { value: new THREE.Color() },
    uFoamColor: { value: new THREE.Color() },
  };

  const material = new THREE.ShaderMaterial({
    uniforms,
    transparent: true,
    vertexShader: `
      uniform float uTime;
      uniform vec4 uWaves[4];
      uniform float uDampShallow;
      uniform float uDampDepth;
      varying vec3 vWorld;
      varying vec3 vNormal;
      varying float vDepth;
      ${SAND_HEIGHT_GLSL}
      void main() {
        vec2 rest = (modelMatrix * vec4(position, 1.0)).xz;
        float strength = mix(uDampShallow, 1.0, smoothstep(0.0, uDampDepth, -sandHeight(rest)));
        vec3 displaced = vec3(rest.x, 0.0, rest.y);
        vec3 tangent = vec3(1.0, 0.0, 0.0);
        vec3 binormal = vec3(0.0, 0.0, 1.0);
        for (int i = 0; i < 4; i++) {
          vec2 direction = normalize(uWaves[i].xy);
          float k = 6.2831853 / uWaves[i].z;
          float speed = sqrt(9.8 / k);
          float steepness = uWaves[i].w * strength;
          float amplitude = steepness / k;
          float phase = k * (dot(direction, rest) - speed * uTime);
          float sinPhase = sin(phase);
          float cosPhase = cos(phase);
          displaced.x += direction.x * amplitude * cosPhase;
          displaced.y += amplitude * sinPhase;
          displaced.z += direction.y * amplitude * cosPhase;
          tangent += vec3(-direction.x * direction.x * steepness * sinPhase, direction.x * steepness * cosPhase, -direction.x * direction.y * steepness * sinPhase);
          binormal += vec3(-direction.x * direction.y * steepness * sinPhase, direction.y * steepness * cosPhase, -direction.y * direction.y * steepness * sinPhase);
        }
        vNormal = normalize(cross(binormal, tangent));
        vWorld = displaced;
        vDepth = displaced.y - sandHeight(displaced.xz);
        gl_Position = projectionMatrix * viewMatrix * vec4(displaced, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform vec3 uSunDir;
      uniform vec3 uSunColor;
      uniform samplerCube uSkyCube;
      uniform vec3 uShallow;
      uniform vec3 uDeep;
      uniform vec3 uWaterLight;
      uniform vec3 uFoamColor;
      varying vec3 vWorld;
      varying vec3 vNormal;
      varying float vDepth;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      float valueNoise(vec2 p) {
        vec2 cell = floor(p);
        vec2 local = fract(p);
        vec2 blend = local * local * (3.0 - 2.0 * local);
        float bottom = mix(hash(cell), hash(cell + vec2(1.0, 0.0)), blend.x);
        float top = mix(hash(cell + vec2(0.0, 1.0)), hash(cell + vec2(1.0, 1.0)), blend.x);
        return mix(bottom, top, blend.y);
      }

      void main() {
        vec3 toCamera = cameraPosition - vWorld;
        float distanceToCamera = length(toCamera);
        vec3 viewDir = toCamera / distanceToCamera;
        vec2 detail = vec2(
          valueNoise(vWorld.xz * 0.9 + vec2(uTime * 0.21, uTime * 0.17)),
          valueNoise(vWorld.xz * 1.7 - vec2(uTime * 0.13, uTime * 0.29))
        ) - 0.5;
        vec3 normal = normalize(normalize(vNormal) + vec3(detail.x, 0.0, detail.y) * 0.22);
        normal = normalize(mix(normal, vec3(0.0, 1.0, 0.0), smoothstep(80.0, 900.0, distanceToCamera)));
        float facing = max(dot(normal, viewDir), 0.0);
        float fresnel = 0.02 + 0.98 * pow(1.0 - facing, 5.0);
        vec3 reflected = reflect(-viewDir, normal);
        reflected.y = abs(reflected.y);
        vec3 skyColor = textureCube(uSkyCube, reflected).rgb;
        vec3 body = mix(uShallow, uDeep, smoothstep(0.0, 3.0, vDepth)) * uWaterLight;
        vec3 color = mix(body, skyColor, fresnel);
        float sunAlign = max(dot(reflected, uSunDir), 0.0);
        color += uSunColor * (pow(sunAlign, 600.0) * 8.0 + pow(sunAlign, 60.0) * 0.35);
        float shoreFoam = 1.0 - smoothstep(0.0, 0.5, vDepth);
        float foamPattern = valueNoise(vWorld.xz * 2.4 + vec2(0.0, uTime * 0.5)) * 0.6 + valueNoise(vWorld.xz * 6.0 - vec2(uTime * 0.3, 0.0)) * 0.4;
        float foam = smoothstep(0.35, 0.7, shoreFoam * (0.55 + foamPattern));
        float edge = smoothstep(0.0, 0.04, vDepth) * (1.0 - smoothstep(0.04, 0.16, vDepth));
        foam = max(foam, edge * 0.9);
        color = mix(color, uFoamColor, foam * 0.85);
        float alpha = max(smoothstep(-0.01, 0.35, vDepth), foam * smoothstep(-0.01, 0.02, vDepth));
        gl_FragColor = vec4(color, alpha);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.frustumCulled = false;

  return {
    object3d: mesh,
    /**
     * Advances the waves and matches water colours to the atmosphere.
     * @param {number} time World time in seconds.
     * @param {object} atmosphere Sampled atmosphere.
     * @param {THREE.Vector3} sunDirection Unit vector toward the sun.
     * @returns {void}
     */
    update(time, atmosphere, sunDirection) {
      uniforms.uTime.value = time;
      uniforms.uSunDir.value.copy(sunDirection);
      uniforms.uSunColor.value.copy(atmosphere.sun).multiplyScalar(atmosphere.sunIntensity * smoothstep(-2, 2, atmosphere.sunElevation));
      uniforms.uWaterLight.value.copy(atmosphere.hemiSky).multiplyScalar(atmosphere.hemiIntensity * 1.2);
      uniforms.uFoamColor.value.copy(atmosphere.hemiSky).multiplyScalar(atmosphere.hemiIntensity * lerp(1.3, 0.35, smoothstep(0.5, 1, atmosphere.dusk))).add(
        atmosphere.sun.clone().multiplyScalar(atmosphere.sunIntensity * 0.25 * smoothstep(-3, 2, atmosphere.sunElevation)),
      );
    },
    /**
     * Frees the ocean resources.
     * @returns {void}
     */
    dispose() {
      disposeObject(mesh);
    },
  };
}

/**
 * Builds a tileable grain texture that gives the sand fine detail up close.
 * @returns {THREE.CanvasTexture} Repeating greyscale grain.
 */
function createSandGrainTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const context = canvas.getContext('2d');
  const image = context.createImageData(size, size);
  const random = createRandom(7);
  for (let i = 0; i < size * size; i += 1) {
    const shade = 214 + random() * 41;
    image.data[i * 4] = shade;
    image.data[i * 4 + 1] = shade;
    image.data[i * 4 + 2] = shade;
    image.data[i * 4 + 3] = 255;
  }
  context.putImageData(image, 0, 0);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(220, 62);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 8;
  return texture;
}

/**
 * Creates a lumpy rock geometry from a jittered icosphere.
 * @param {() => number} random Seeded random source.
 * @returns {THREE.BufferGeometry} Rock geometry with radius about 1.
 */
function createRockGeometry(random) {
  const geometry = mergeVertices(new THREE.IcosahedronGeometry(1, 2));
  const position = geometry.attributes.position;
  const vertex = new THREE.Vector3();
  for (let i = 0; i < position.count; i += 1) {
    vertex.fromBufferAttribute(position, i);
    vertex.multiplyScalar(0.82 + random() * 0.3);
    position.setXYZ(i, vertex.x, vertex.y, vertex.z);
  }
  geometry.computeVertexNormals();
  return geometry;
}

/**
 * Creates the beach: displaced sand with a wet band, plus scattered rocks and shells.
 * @returns {object} Beach controller.
 */
function createBeach() {
  const group = new THREE.Group();
  const geometry = new THREE.PlaneGeometry(600, 170, 300, 170);
  geometry.rotateX(-Math.PI / 2);
  geometry.translate(0, 0, 45);
  const position = geometry.attributes.position;
  const colors = new Float32Array(position.count * 3);
  const dry = new THREE.Color(PALETTE.sand);
  const wet = new THREE.Color(PALETTE.wetSand);
  const seabed = new THREE.Color(PALETTE.seabed);
  const color = new THREE.Color();
  for (let i = 0; i < position.count; i += 1) {
    const x = position.getX(i);
    const z = position.getZ(i);
    const height = sandHeightAt(x, z);
    position.setY(i, height);
    const variation = 0.94 + 0.06 * Math.sin(x * 0.7 + Math.sin(z * 0.9) * 2.0);
    color.copy(dry)
      .lerp(wet, 1 - smoothstep(0.05, 0.42, height))
      .lerp(seabed, 1 - smoothstep(-0.9, 0, height))
      .multiplyScalar(variation);
    color.toArray(colors, i * 3);
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.computeVertexNormals();
  const sand = new THREE.Mesh(
    geometry,
    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96, map: createSandGrainTexture() }),
  );
  sand.receiveShadow = true;
  group.add(sand);

  const random = createRandom(42);
  const rockCount = 24;
  const rocks = new THREE.InstancedMesh(
    createRockGeometry(random),
    new THREE.MeshStandardMaterial({ color: '#6B625A', roughness: 0.92 }),
    rockCount,
  );
  const shellCount = 40;
  const shells = new THREE.InstancedMesh(
    new THREE.SphereGeometry(1, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: '#F1DDD0', roughness: 0.55 }),
    shellCount,
  );
  const matrix = new THREE.Matrix4();
  const rotation = new THREE.Quaternion();
  const euler = new THREE.Euler();
  const scale = new THREE.Vector3();
  const place = new THREE.Vector3();

  /**
   * Picks a scattered spot that keeps clear of the avatar and the bottle's path.
   * @param {number} minZ Nearest z to the sea.
   * @param {number} maxZ Furthest z inland.
   * @returns {THREE.Vector3} Position on the sand.
   */
  function scatter(minZ, maxZ) {
    for (;;) {
      const x = lerp(-45, 45, random());
      const z = lerp(minZ, maxZ, random());
      const nearStage = Math.abs(x - AVATAR_SPOT.x) < 4 && z < AVATAR_SPOT.z + 9;
      if (!nearStage) {
        return place.set(x, sandHeightAt(x, z), z);
      }
    }
  }

  for (let i = 0; i < rockCount; i += 1) {
    const spot = scatter(-4, 26);
    const size = 0.15 + Math.pow(random(), 2) * 0.9;
    euler.set(random() * Math.PI, random() * Math.PI, random() * Math.PI);
    rotation.setFromEuler(euler);
    scale.set(size * (1 + random() * 0.5), size * (0.55 + random() * 0.3), size);
    spot.y -= size * 0.3;
    matrix.compose(spot, rotation, scale);
    rocks.setMatrixAt(i, matrix);
  }
  for (let i = 0; i < shellCount; i += 1) {
    const spot = scatter(3, 18);
    const size = 0.03 + random() * 0.03;
    euler.set(0, random() * Math.PI * 2, 0);
    rotation.setFromEuler(euler);
    scale.set(size * 0.8, size * 0.35, size);
    matrix.compose(spot, rotation, scale);
    shells.setMatrixAt(i, matrix);
    shells.setColorAt(i, new THREE.Color().setHSL(0.03 + random() * 0.05, 0.45, 0.78 + random() * 0.12));
  }
  rocks.castShadow = true;
  rocks.receiveShadow = true;
  group.add(rocks, shells);

  return {
    object3d: group,
    /**
     * Frees the beach resources.
     * @returns {void}
     */
    dispose() {
      sand.material.map.dispose();
      disposeObject(group);
    },
  };
}

/**
 * Colours every vertex of a geometry along a vertical gradient.
 * @param {THREE.BufferGeometry} geometry Geometry to paint, already in its final place.
 * @param {THREE.ColorRepresentation} bottom Colour at the lowest vertex.
 * @param {THREE.ColorRepresentation} [top] Colour at the highest vertex; defaults to `bottom`.
 * @returns {THREE.BufferGeometry} The same geometry.
 */
function paintGradient(geometry, bottom, top = bottom) {
  const position = geometry.attributes.position;
  geometry.computeBoundingBox();
  const { min, max } = geometry.boundingBox;
  const low = new THREE.Color(bottom);
  const high = new THREE.Color(top);
  const color = new THREE.Color();
  const colors = new Float32Array(position.count * 3);
  for (let i = 0; i < position.count; i += 1) {
    color.copy(low).lerp(high, (position.getY(i) - min.y) / Math.max(1e-6, max.y - min.y));
    color.toArray(colors, i * 3);
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return geometry;
}

/**
 * Builds a smooth tube through a list of points.
 * @param {Array<Array<number>>} points Control points [x, y, z].
 * @param {number} radius Tube radius.
 * @param {number} segments Segments along the tube.
 * @returns {THREE.TubeGeometry} Tube.
 */
function tubeThrough(points, radius, segments) {
  const curve = new THREE.CatmullRomCurve3(points.map((point) => new THREE.Vector3().fromArray(point)));
  return new THREE.TubeGeometry(curve, segments, radius, 7);
}

/**
 * Builds a stone pine: a leaning trunk with two limbs under a flat, wide umbrella canopy, about 6.5 m tall.
 * @returns {THREE.BufferGeometry} Vertex-coloured pine with its base at the origin.
 */
function createPineGeometry() {
  const wood = mergeGeometries([
    tubeThrough([[0, -0.4, 0], [0.15, 1.8, 0], [0.55, 3.6, 0.1], [1.1, 5.5, 0.05]], 0.17, 16),
    tubeThrough([[0.6, 3.8, 0.1], [0.1, 4.7, 0.3], [-0.5, 5.4, 0.4]], 0.09, 8),
    tubeThrough([[1, 5.1, 0.05], [1.8, 5.5, -0.3], [2.4, 5.75, -0.5]], 0.08, 8),
  ]);
  paintGradient(wood, '#3F2C20', '#6E523C');
  const canopy = mergeGeometries([
    [1.1, 5.95, 0, 1.7, 1.45],
    [-0.45, 5.6, 0.35, 1.2, 1.05],
    [2.35, 5.8, -0.45, 1.15, 1],
    [0.5, 6.2, -0.75, 1.25, 1.1],
    [0.65, 6.05, 0.95, 1.15, 1],
  ].map(([x, y, z, sx, sz]) => new THREE.SphereGeometry(1, 16, 10).scale(sx, 0.48, sz).translate(x, y, z)));
  paintGradient(canopy, '#1B3325', '#4E7C4A');
  return mergeGeometries([wood, canopy]);
}

/**
 * Builds a round shrub from overlapping blobs, about 1.6 m across.
 * @returns {THREE.BufferGeometry} Vertex-coloured bush with its base at the origin.
 */
function createBushGeometry() {
  const blobs = [
    [0, 0.35, 0, 0.55], [0.5, 0.28, 0.15, 0.42], [-0.45, 0.26, 0.1, 0.4],
    [0.1, 0.25, 0.45, 0.38], [-0.1, 0.3, -0.4, 0.42], [0.15, 0.62, 0.05, 0.34],
  ].map(([x, y, z, radius]) => new THREE.SphereGeometry(radius, 12, 8).translate(x, y, z));
  return paintGradient(mergeGeometries(blobs), '#26391F', '#6E9150');
}

/**
 * Builds a tuft of dune grass: thin blades leaning outward.
 * @returns {THREE.BufferGeometry} Vertex-coloured tuft with its base at the origin.
 */
function createGrassGeometry() {
  const random = createRandom(31);
  const blades = [];
  for (let i = 0; i < 11; i += 1) {
    const height = 0.45 + random() * 0.45;
    const blade = new THREE.ConeGeometry(0.022, height, 3);
    blade.translate(0, height / 2, 0);
    blade.rotateZ((random() - 0.5) * 0.8);
    blade.rotateY(random() * Math.PI * 2);
    blade.translate((random() - 0.5) * 0.16, -0.03, (random() - 0.5) * 0.16);
    blades.push(blade);
  }
  return paintGradient(mergeGeometries(blades), '#5F5E35', '#D8C98E');
}

/**
 * Builds a sun-bleached driftwood log with a broken-off limb, about 3.4 m long.
 * @returns {THREE.BufferGeometry} Vertex-coloured log lying along x.
 */
function createDriftwoodGeometry() {
  const ends = [[-1.65, 0.08, 0.1], [1.72, 0.1, -0.1]].map((end) => new THREE.SphereGeometry(0.125, 8, 6).scale(0.5, 1, 1).translate(...end));
  return paintGradient(mergeGeometries([
    tubeThrough([[-1.65, 0.08, 0.1], [-0.4, 0.14, -0.05], [0.8, 0.12, 0.08], [1.72, 0.1, -0.1]], 0.13, 16),
    tubeThrough([[0.5, 0.14, 0.05], [0.9, 0.35, 0.35], [1.1, 0.55, 0.6]], 0.05, 6),
    ...ends,
  ]), '#7F705E', '#C9BCA6');
}

/**
 * Builds a 2 m run of dune fence: uneven wooden slats held by two wires.
 * @returns {THREE.BufferGeometry} Vertex-coloured fence section along x.
 */
function createFenceGeometry() {
  const random = createRandom(8);
  const parts = [];
  for (let i = 0; i < 12; i += 1) {
    const height = 0.75 + random() * 0.3;
    const slat = new THREE.BoxGeometry(0.06, height, 0.025);
    slat.rotateZ((random() - 0.5) * 0.12);
    slat.translate(-0.92 + i * 0.167, height / 2 - 0.12, 0);
    parts.push(slat);
  }
  for (const height of [0.18, 0.58]) {
    parts.push(new THREE.CylinderGeometry(0.008, 0.008, 2, 4).rotateZ(Math.PI / 2).translate(0, height, 0.02));
  }
  return paintGradient(mergeGeometries(parts), '#5E5040', '#A69380');
}

/**
 * Places copies of one prop as an instanced mesh, each tinted slightly differently.
 * @param {THREE.BufferGeometry} geometry Prop geometry.
 * @param {THREE.Material} material Shared material.
 * @param {Array<{x: number, y: number, z: number, scale: number, yaw: number, tilt?: number}>} placements Where each copy goes.
 * @param {() => number} random Seeded random source for the tint.
 * @returns {THREE.InstancedMesh} Instanced props.
 */
function createPropInstances(geometry, material, placements, random) {
  const mesh = new THREE.InstancedMesh(geometry, material, placements.length);
  const matrix = new THREE.Matrix4();
  const rotation = new THREE.Quaternion();
  const euler = new THREE.Euler();
  const position = new THREE.Vector3();
  const scale = new THREE.Vector3();
  const tint = new THREE.Color();
  placements.forEach((placement, index) => {
    euler.set(placement.tilt ?? 0, placement.yaw, (placement.tilt ?? 0) * 0.5);
    matrix.compose(position.set(placement.x, placement.y, placement.z), rotation.setFromEuler(euler), scale.setScalar(placement.scale));
    mesh.setMatrixAt(index, matrix);
    mesh.setColorAt(index, tint.setHSL(0, 0, 0.88 + random() * 0.24));
  });
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/**
 * Creates the shore dressing: a rocky point with stone pines on the left of the cove, a smaller outcrop on the right,
 * pines, shrubs, dune grass and a slatted fence on the dunes behind the beach, driftwood at the waterline,
 * and a few grass tufts near the group.
 * @returns {{object3d: THREE.Group}} Shore props.
 */
function createShoreProps() {
  const random = createRandom(61);
  const group = new THREE.Group();
  const material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 });
  const pines = [];
  const bushes = [];
  const grass = [];
  const rocks = [];

  /**
   * Adds a placement on the sand surface.
   * @param {Array<object>} list Placement list to add to.
   * @param {number} x World x.
   * @param {number} z World z.
   * @param {number} scale Uniform scale.
   * @param {number} [lift] Height above the sand surface.
   * @returns {void}
   */
  function onSand(list, x, z, scale, lift = 0) {
    list.push({ x, y: sandHeightAt(x, z) + lift, z, scale, yaw: random() * Math.PI * 2, tilt: (random() - 0.5) * 0.08 });
  }

  /**
   * Picks a random spot inland that keeps clear of the stage and the camera's foreground.
   * @param {number} minZ Nearest z to the sea.
   * @param {number} maxZ Furthest z inland.
   * @param {number} spread Half-width of the x range.
   * @returns {{x: number, z: number}} Spot.
   */
  function inland(minZ, maxZ, spread) {
    for (;;) {
      const x = (random() - 0.5) * 2 * spread;
      const z = lerp(minZ, maxZ, random());
      if (Math.abs(x - AVATAR_SPOT.x) > 5.5 || z > 14) {
        return { x, z };
      }
    }
  }

  /**
   * Builds a rocky point from a chain of boulders running out to sea, with plants on its crest.
   * @param {Array<number>} from Landward end [x, z].
   * @param {Array<number>} to Seaward end [x, z].
   * @param {number} count Boulders along the chain.
   * @param {Array<number>} pineSpots Positions 0..1 along the chain that get a pine.
   * @returns {void}
   */
  function rockyPoint(from, to, count, pineSpots) {
    const crestAt = (t) => lerp(0.8, 1.7, t);
    for (let i = 0; i < count; i += 1) {
      const t = i / (count - 1);
      for (const side of [-1, 1]) {
        const x = lerp(from[0], to[0], t) + side * (0.6 + random() * 0.9);
        const z = lerp(from[1], to[1], t) + (random() - 0.5) * 1.6;
        const size = lerp(1, 2.4, t) * (0.8 + random() * 0.4);
        const top = crestAt(t) + (random() - 0.5) * 0.4 - (side > 0 ? 0.15 : 0);
        rocks.push({ x, y: top - size * 0.85, z, size });
      }
      if (i % 2 === 0) {
        bushes.push({ x: lerp(from[0], to[0], t) + (random() - 0.5), y: crestAt(t) - 0.2, z: lerp(from[1], to[1], t), scale: 0.7 + random() * 0.4, yaw: random() * 6 });
      }
      grass.push({ x: lerp(from[0], to[0], t) + (random() - 0.5) * 1.2, y: crestAt(t) - 0.08, z: lerp(from[1], to[1], t) + (random() - 0.5), scale: 1, yaw: random() * 6 });
    }
    for (const t of pineSpots) {
      pines.push({ x: lerp(from[0], to[0], t), y: crestAt(t) - 0.3, z: lerp(from[1], to[1], t), scale: 0.85 + random() * 0.3, yaw: random() * 6, tilt: 0.04 });
    }
  }

  rockyPoint([-8.8, 1.2], [-16.5, -12], 9, [0.2, 0.55]);
  rockyPoint([9.6, 0.6], [14.5, -7], 6, [0.35]);

  for (let i = 0; i < 12; i += 1) {
    const spot = inland(17, 42, 55);
    onSand(pines, spot.x, spot.z, 0.8 + random() * 0.5, -0.1);
  }
  for (let i = 0; i < 30; i += 1) {
    const spot = inland(11, 34, 50);
    onSand(bushes, spot.x, spot.z, 0.7 + random() * 0.7, -0.05);
  }
  for (let i = 0; i < 140; i += 1) {
    const spot = inland(7, 30, 45);
    onSand(grass, spot.x, spot.z, 0.8 + random() * 0.6);
  }
  for (const [x, z, scale] of [[-2.7, 6.6, 1], [-3.2, 7.1, 0.8], [4, 6.4, 1.1], [4.6, 6.9, 0.85], [-5.2, 3.6, 0.9], [6.8, 3.4, 1]]) {
    onSand(grass, x, z, scale);
  }

  const fences = [];
  for (let x = -40; x <= 40; x += 2) {
    if (random() < 0.2) {
      continue;
    }
    const z = 12.4 + Math.sin(x * 0.15) * 0.6;
    fences.push({ x, y: sandHeightAt(x, z), z, scale: 1, yaw: -Math.cos(x * 0.15) * 0.09 + (random() - 0.5) * 0.06, tilt: (random() - 0.5) * 0.08 });
  }
  const driftwood = [[-4.4, 1.9, 0.35, 1], [5.6, 2.4, -0.45, 0.85], [-9.5, 8.2, 1.2, 1.1]].map(([x, z, yaw, scale]) => ({ x, y: sandHeightAt(x, z) - 0.03, z, scale, yaw }));

  const rockMesh = new THREE.InstancedMesh(createRockGeometry(random), new THREE.MeshStandardMaterial({ color: '#615850', roughness: 0.92 }), rocks.length);
  const matrix = new THREE.Matrix4();
  const rotation = new THREE.Quaternion();
  const euler = new THREE.Euler();
  rocks.forEach((rock, index) => {
    euler.set(random() * 0.6, random() * Math.PI * 2, random() * 0.6);
    matrix.compose(new THREE.Vector3(rock.x, rock.y, rock.z), rotation.setFromEuler(euler), new THREE.Vector3(rock.size * 1.2, rock.size * 0.85, rock.size));
    rockMesh.setMatrixAt(index, matrix);
  });
  rockMesh.castShadow = true;
  rockMesh.receiveShadow = true;

  group.add(
    rockMesh,
    createPropInstances(createPineGeometry(), material, pines, random),
    createPropInstances(createBushGeometry(), material, bushes, random),
    createPropInstances(createGrassGeometry(), material, grass, random),
    createPropInstances(createFenceGeometry(), material, fences, random),
    createPropInstances(createDriftwoodGeometry(), material, driftwood, random),
  );
  return { object3d: group };
}

/**
 * Creates a capsule geometry whose top sits at y = 0 and hangs downward.
 * @param {number} radius Capsule radius.
 * @param {number} length Length of the straight middle part.
 * @returns {THREE.CapsuleGeometry} Hanging capsule.
 */
function hangingCapsule(radius, length) {
  const geometry = new THREE.CapsuleGeometry(radius, length, 8, 18);
  geometry.translate(0, -(length / 2 + radius), 0);
  return geometry;
}

/**
 * Builds a smooth limb or trunk by spinning a radius profile round the y axis, with rounded ends.
 * @param {Array<Array<number>>} rings [y, radius] pairs, in any order.
 * @param {number} [segments] Radial segments.
 * @param {number} [capHeight] Height of each rounded end as a fraction of its radius.
 * @returns {THREE.LatheGeometry} Closed lathe geometry.
 */
function profileGeometry(rings, segments = 18, capHeight = 0.6) {
  const sorted = [...rings].sort((a, b) => a[0] - b[0]);
  const [bottomY, bottomRadius] = sorted[0];
  const [topY, topRadius] = sorted[sorted.length - 1];
  const capSteps = 4;
  const points = [];
  for (let step = 0; step < capSteps; step += 1) {
    const angle = (step / capSteps) * (Math.PI / 2);
    points.push(new THREE.Vector2(bottomRadius * Math.sin(angle), bottomY - bottomRadius * capHeight * Math.cos(angle)));
  }
  for (const [y, radius] of sorted) {
    points.push(new THREE.Vector2(radius, y));
  }
  for (let step = capSteps - 1; step >= 0; step -= 1) {
    const angle = (step / capSteps) * (Math.PI / 2);
    points.push(new THREE.Vector2(topRadius * Math.sin(angle), topY + topRadius * capHeight * Math.cos(angle)));
  }
  return new THREE.LatheGeometry(points, segments);
}

/**
 * Builds the D-shaped flat brim of the snapback.
 * @returns {THREE.ExtrudeGeometry} Brim lying in the x/z plane, forward is +z.
 */
function createBrimGeometry() {
  const shape = new THREE.Shape();
  const steps = 28;
  const outerX = 0.128;
  const outerZ = 0.235;
  const innerRadius = 0.121;
  for (let i = 0; i <= steps; i += 1) {
    const angle = (i / steps) * Math.PI;
    const x = Math.cos(angle) * outerX;
    const y = 0.015 + Math.sin(angle) * (outerZ - 0.015);
    if (i === 0) {
      shape.moveTo(x, y);
    } else {
      shape.lineTo(x, y);
    }
  }
  for (let i = steps; i >= 0; i -= 1) {
    const angle = (i / steps) * Math.PI;
    shape.lineTo(Math.cos(angle) * innerRadius * 1.02, Math.sin(angle) * innerRadius);
  }
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.008,
    bevelEnabled: true,
    bevelThickness: 0.003,
    bevelSize: 0.003,
    bevelSegments: 2,
    curveSegments: 4,
  });
  geometry.rotateX(Math.PI / 2);
  return geometry;
}

/**
 * Builds a flat photo face mask for a head: an oval card held in front of the face, the photo cut out
 * crisply inside a thin paper border, with a thin card edge behind it so it reads as a mask from the side.
 * The photos are aligned so the eyes sit 84 px apart, 100 px from the top of a 256 px square.
 * @param {{src: string, oval: Array<number>}} face Photo path, and the visible oval
 *   [centreX, centreY, radiusX, radiusY] as fractions of the photo, measured from its top left.
 * @param {THREE.ColorRepresentation} backColor Colour of the card's back and edge, the wearer's skin so it blends in from behind.
 * @returns {THREE.Group} Mask in head-bone space.
 */
function createFaceMask(face, backColor) {
  const size = 512;
  const width = 0.262;
  const top = 0.258;
  const front = 0.128;
  const thickness = 0.004;
  const border = 0.022;
  const cardColor = '#F6F1E7';
  const [centerX, centerY, radiusX, radiusY] = face.oval;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 4;
  loadImage(face.src, (photo) => {
    const context = canvas.getContext('2d');
    context.fillStyle = cardColor;
    context.beginPath();
    context.ellipse(centerX * size, centerY * size, (radiusX + border) * size, (radiusY + border) * size, 0, 0, Math.PI * 2);
    context.fill();
    context.save();
    context.beginPath();
    context.ellipse(centerX * size, centerY * size, radiusX * size, radiusY * size, 0, 0, Math.PI * 2);
    context.clip();
    context.drawImage(photo, 0, 0, size, size);
    context.restore();
    texture.needsUpdate = true;
  });

  const mask = new THREE.Group();
  mask.position.set(0, top - width / 2, front);
  const photoMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(width, width),
    new THREE.MeshStandardMaterial({
      map: texture,
      emissive: '#ffffff',
      emissiveMap: texture,
      emissiveIntensity: 0.18,
      roughness: 0.8,
      alphaTest: 0.5,
    }),
  );
  photoMesh.receiveShadow = true;
  const outline = new THREE.Shape();
  outline.absellipse((centerX - 0.5) * width, (0.5 - centerY) * width, (radiusX + border) * width, (radiusY + border) * width, 0, Math.PI * 2);
  const cardGeometry = new THREE.ExtrudeGeometry(outline, { depth: thickness, bevelEnabled: false, curveSegments: 48 });
  cardGeometry.translate(0, 0, -thickness - 0.0005);
  const card = new THREE.Mesh(cardGeometry, new THREE.MeshStandardMaterial({ color: backColor, roughness: 0.75 }));
  card.castShadow = true;
  card.receiveShadow = true;
  mask.add(photoMesh, card);
  return mask;
}
