const avatarMaterialCache = new Map();

/**
 * Draws one botanical sprig of the toile print: a curved stem with leaves and a small flower at the tip.
 * @param {CanvasRenderingContext2D} context Target context.
 * @param {object} sprig Sprig layout: position, angle, length and leaf list.
 * @param {number} offsetX Horizontal tile offset in pixels.
 * @param {number} offsetY Vertical tile offset in pixels.
 * @returns {void}
 */
function drawToileSprig(context, sprig, offsetX, offsetY) {
  const startX = sprig.x + offsetX;
  const startY = sprig.y + offsetY;
  const endX = startX + Math.cos(sprig.angle) * sprig.length;
  const endY = startY + Math.sin(sprig.angle) * sprig.length;
  const bendX = (startX + endX) / 2 + Math.cos(sprig.angle + Math.PI / 2) * sprig.bend;
  const bendY = (startY + endY) / 2 + Math.sin(sprig.angle + Math.PI / 2) * sprig.bend;
  context.beginPath();
  context.moveTo(startX, startY);
  context.quadraticCurveTo(bendX, bendY, endX, endY);
  context.stroke();
  for (const leaf of sprig.leaves) {
    const t = leaf.t;
    const x = (1 - t) * (1 - t) * startX + 2 * (1 - t) * t * bendX + t * t * endX;
    const y = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * bendY + t * t * endY;
    const angle = sprig.angle + leaf.side * 0.9;
    context.beginPath();
    context.ellipse(x + Math.cos(angle) * leaf.size, y + Math.sin(angle) * leaf.size, leaf.size, leaf.size * 0.38, angle, 0, Math.PI * 2);
    context.fill();
  }
  for (let petal = 0; petal < 5; petal += 1) {
    const angle = (petal / 5) * Math.PI * 2;
    context.beginPath();
    context.arc(endX + Math.cos(angle) * 4.5, endY + Math.sin(angle) * 4.5, 3.4, 0, Math.PI * 2);
    context.fill();
  }
}

/**
 * Paints the tileable navy-on-cream botanical print of the pyjama shirt and trousers.
 * @returns {THREE.CanvasTexture} Repeating sRGB texture.
 */
function createToileTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const context = canvas.getContext('2d');
  const random = createRandom(11);
  context.fillStyle = '#F4F1EA';
  context.fillRect(0, 0, size, size);
  context.strokeStyle = '#3F5088';
  context.fillStyle = '#3F5088';
  context.lineWidth = 2.2;
  context.lineCap = 'round';
  const sprigs = Array.from({ length: 10 }, () => ({
    x: random() * size,
    y: random() * size,
    angle: random() * Math.PI * 2,
    length: 34 + random() * 34,
    bend: (random() - 0.5) * 30,
    leaves: Array.from({ length: 4 }, (unused, index) => ({ t: 0.2 + index * 0.18, side: index % 2 ? 1 : -1, size: 6 + random() * 4 })),
  }));
  for (const sprig of sprigs) {
    for (const offsetX of [-size, 0, size]) {
      for (const offsetY of [-size, 0, size]) {
        drawToileSprig(context, sprig, offsetX, offsetY);
      }
    }
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(3, 2);
  texture.anisotropy = 4;
  return texture;
}

/**
 * Returns the shared figure material for a paint kind, creating it on first use.
 * @param {'soft'|'matte'|'toile'} kind Paint kind: soft for skin and eyes, matte for hair and cloth, toile for the printed pyjamas.
 * @returns {THREE.MeshStandardMaterial} Shared vertex-coloured material.
 */
function getAvatarMaterial(kind) {
  if (!avatarMaterialCache.has(kind)) {
    avatarMaterialCache.set(kind, new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: kind === 'soft' ? 0.6 : 0.88,
      side: THREE.DoubleSide,
      map: kind === 'toile' ? createToileTexture() : null,
    }));
  }
  return avatarMaterialCache.get(kind);
}

/**
 * Merges a figure's part meshes into one skinned mesh with one draw call per paint kind.
 * Each part is bound rigidly to its nearest bone, so the joints animate exactly as the separate parts did.
 * @param {THREE.Bone} rootBone Root of the bone tree, with the part meshes attached under it.
 * @returns {THREE.SkinnedMesh} Skinned figure.
 */
function bakeSkinnedFigure(rootBone) {
  rootBone.updateMatrixWorld(true);
  const bones = [];
  const parts = [];
  rootBone.traverse((object) => {
    if (object.isBone) {
      bones.push(object);
    } else if (object.isMesh) {
      parts.push(object);
    }
  });
  const geometriesByKind = new Map();
  const sources = new Set();
  for (const part of parts) {
    let bone = part.parent;
    while (!bone.isBone) {
      bone = bone.parent;
    }
    const boneIndex = bones.indexOf(bone);
    sources.add(part.geometry);
    const geometry = part.geometry.index ? part.geometry.clone() : mergeVertices(part.geometry);
    for (const name of Object.keys(geometry.attributes)) {
      if (!['position', 'normal', 'uv'].includes(name)) {
        geometry.deleteAttribute(name);
      }
    }
    geometry.applyMatrix4(part.matrixWorld);
    const count = geometry.attributes.position.count;
    const colors = new Float32Array(count * 3);
    const skinIndices = new Uint16Array(count * 4);
    const skinWeights = new Float32Array(count * 4);
    const { color, kind } = part.userData.paint;
    for (let i = 0; i < count; i += 1) {
      colors[i * 3] = color.r;
      colors[i * 3 + 1] = color.g;
      colors[i * 3 + 2] = color.b;
      skinIndices[i * 4] = boneIndex;
      skinWeights[i * 4] = 1;
    }
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
    geometry.setAttribute('skinWeight', new THREE.BufferAttribute(skinWeights, 4));
    if (!geometriesByKind.has(kind)) {
      geometriesByKind.set(kind, []);
    }
    geometriesByKind.get(kind).push(geometry);
    part.removeFromParent();
  }
  const kinds = [...geometriesByKind.keys()];
  const perKind = kinds.map((kind) => mergeGeometries(geometriesByKind.get(kind)));
  const merged = mergeGeometries(perKind, true);
  for (const geometry of [...sources, ...perKind, ...[...geometriesByKind.values()].flat()]) {
    geometry.dispose();
  }
  const mesh = new THREE.SkinnedMesh(merged, kinds.map(getAvatarMaterial));
  mesh.add(rootBone);
  mesh.updateMatrixWorld(true);
  mesh.bind(new THREE.Skeleton(bones));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  return mesh;
}

/**
 * Creates a stylised figure from a look: Andrii (navy snapback with a red brim, full dark beard, tee and shorts)
 * or one of the friends who come to hug him. Built facing +z with its origin between the feet,
 * then merged into one skinned mesh.
 * @param {object} look Entry from `AVATAR_LOOKS`.
 * @returns {object} Avatar controller with `object3d`, `setPose`, `setWalkPhase` and `update`.
 */
function createAvatar(look) {
  const build = AVATAR_BUILDS[look.build];
  const arm = build.arm;
  const female = !look.beard && look.hair !== 'short';
  const masked = Boolean(look.face);

  /**
   * Describes how a part is coloured and which shared material draws it.
   * @param {THREE.ColorRepresentation} color Part colour.
   * @param {'soft'|'matte'|'toile'} [kind] Paint kind.
   * @returns {{color: THREE.Color, kind: string}} Paint.
   */
  function paint(color, kind = 'matte') {
    return { color: new THREE.Color(color), kind };
  }

  const skin = paint(look.skin, 'soft');
  const printed = paint('#FFFFFF', 'toile');
  const paints = {
    skin,
    hair: paint(look.hairColor),
    eye: paint('#1E1410', 'soft'),
    lips: paint(look.lips, 'soft'),
    crown: paint('#2A3A62'),
    brim: paint(PALETTE.red),
    gold: paint('#D9AE55', 'soft'),
    watch: paint('#F1F0EC', 'soft'),
    top: { none: skin, shirt: printed }[look.top.kind] ?? paint(look.top.color),
    bottom: look.bottom.pattern ? printed : paint(look.bottom.color),
  };
  const placeholder = new THREE.MeshBasicMaterial();
  const unitSphere = new THREE.SphereGeometry(1, 28, 20);
  const root = new THREE.Group();
  const body = new THREE.Bone();

  /**
   * Adds a part to a joint; parts are merged into the skinned mesh once the figure is built.
   * @param {THREE.Object3D} parent Joint or group the part hangs from.
   * @param {THREE.BufferGeometry} geometry Geometry.
   * @param {{color: THREE.Color, kind: string}} partPaint Paint.
   * @param {Array<number>} position Local position [x, y, z].
   * @param {Array<number>} [scale] Optional local scale [x, y, z].
   * @param {Array<number>} [rotation] Optional local rotation [x, y, z] in radians.
   * @returns {THREE.Mesh} The new part.
   */
  function addPart(parent, geometry, partPaint, position, scale, rotation) {
    const mesh = new THREE.Mesh(geometry, placeholder);
    mesh.userData.paint = partPaint;
    mesh.position.fromArray(position);
    if (scale) {
      mesh.scale.fromArray(scale);
    }
    if (rotation) {
      mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
    }
    parent.add(mesh);
    return mesh;
  }

  const chest = build.torsoTop * (female ? 0.86 : 0.95);
  const hips = Math.max(build.torsoBottom, build.legX + 0.085 * build.thigh) * (female ? 1.04 : 1);
  const waist = Math.min(chest, hips) * (female ? 0.86 : 0.88);
  const covered = look.top.kind !== 'none';
  const neck = female ? 0.05 : 0.06;

  /**
   * Builds one arm hanging from the shoulder: deltoid, tapered upper arm and forearm, and a hand with its palm toward the thigh.
   * @param {number} side +1 for the figure's left (+x), -1 for its right.
   * @returns {{shoulder: THREE.Bone, elbow: THREE.Bone, side: number}} Arm joints.
   */
  function createArm(side) {
    const shoulder = new THREE.Bone();
    shoulder.position.set(side * build.shoulderX, 1.33, 0);
    addPart(shoulder, unitSphere, paints.top, [side * -0.016, -0.008, 0], [0.062 * arm, 0.058 * arm, 0.06 * arm]);
    addPart(shoulder, profileGeometry([[0, 0.052 * arm], [-0.1, 0.053 * arm], [-0.2, 0.044 * arm], [-0.29, 0.037 * arm]]), paints.skin, [0, 0, 0]);
    if (covered) {
      const sleeveLength = look.top.kind === 'shirt' ? 0.3 : 0.17;
      const sleeve = new THREE.CylinderGeometry(0.063 * arm, 0.058 * arm, sleeveLength, 18);
      sleeve.translate(0, -sleeveLength / 2, 0);
      addPart(shoulder, sleeve, paints.top, [0, 0, 0]);
    }
    const elbow = new THREE.Bone();
    elbow.position.set(0, -0.29, 0);
    shoulder.add(elbow);
    addPart(elbow, unitSphere, paints.skin, [0, 0, 0], [0.037 * arm, 0.037 * arm, 0.037 * arm]);
    addPart(elbow, profileGeometry([[0, 0.038 * arm], [-0.06, 0.042 * arm], [-0.17, 0.032 * arm], [-0.245, 0.026 * arm]]), paints.skin, [0, 0, 0.004]);
    if (look.top.kind === 'shirt') {
      addPart(elbow, hangingCapsule(0.047 * arm, 0.13), paints.top, [0, 0.03, 0]);
    }
    addPart(elbow, unitSphere, paints.skin, [0, -0.3, 0.004], [0.019, 0.048, 0.041]);
    addPart(elbow, hangingCapsule(0.016, 0.045), paints.skin, [0, -0.33, 0.006], [1.05, 1, 2.2]);
    addPart(elbow, hangingCapsule(0.01, 0.03), paints.skin, [side * -0.006, -0.285, 0.036], null, [-0.5, 0, 0]);
    if (look.watch && side > 0) {
      addPart(elbow, new THREE.CylinderGeometry(0.031 * arm, 0.031 * arm, 0.026, 18), paints.watch, [0, -0.225, 0.004]);
    }
    body.add(shoulder);
    return { shoulder, elbow, side };
  }

  const legs = [];
  for (const side of [-1, 1]) {
    const leg = new THREE.Bone();
    leg.position.set(side * build.legX, 0.8, 0);
    body.add(leg);
    const thigh = build.thigh;
    addPart(leg, profileGeometry([[0.02, 0.08 * thigh], [-0.1, 0.076 * thigh], [-0.3, 0.06 * thigh], [-0.4, 0.047 * thigh]], 20), paints.skin, [0, 0, 0]);
    const knee = new THREE.Bone();
    knee.position.set(0, -0.4, 0);
    leg.add(knee);
    addPart(knee, unitSphere, paints.skin, [0, 0, 0.002], [0.046 * thigh, 0.046 * thigh, 0.046 * thigh]);
    addPart(knee, profileGeometry([[0, 0.046 * thigh], [-0.1, 0.052 * thigh], [-0.26, 0.035 * thigh], [-0.34, 0.03 * thigh]], 20), paints.skin, [0, 0, -0.006]);
    addPart(knee, unitSphere, paints.skin, [0, -0.345, -0.008], [0.032, 0.03, 0.036]);
    addPart(knee, unitSphere, paints.skin, [0, -0.37, 0.045], [0.045, 0.028, 0.105]);
    addPart(knee, unitSphere, paints.skin, [0, -0.374, 0.11], [0.04, 0.022, 0.04]);
    if (look.bottom.kind === 'pants') {
      addPart(leg, new THREE.CylinderGeometry(0.096 * thigh, 0.07, 0.47, 20), paints.bottom, [side * 0.005, -0.185, 0]);
      addPart(knee, unitSphere, paints.bottom, [0, 0, 0], [0.07, 0.07, 0.07]);
      addPart(knee, new THREE.CylinderGeometry(0.069, 0.062, 0.33, 20), paints.bottom, [0, -0.165, 0]);
    } else {
      addPart(leg, new THREE.CylinderGeometry(0.092 * thigh, 0.087 * thigh, 0.35, 20), paints.bottom, [side * 0.005, -0.125, 0]);
    }
    legs.push({ leg, knee, side });
  }
  addPart(body, unitSphere, paints.bottom, [0, 0.8, -0.005], [hips, 0.115, hips * build.depth]);

  const torso = new THREE.Bone();
  torso.position.y = 0.79;
  body.add(torso);
  const chestDepth = chest * build.depth;
  const belly = build.belly;
  const torsoGeometry = profileGeometry([
    [-0.28, covered ? hips * 1.08 : hips * 0.96],
    [-0.18, lerp(hips, waist, 0.4) + belly * 0.7],
    [-0.07, waist + belly],
    [0.05, lerp(waist, chest, female ? 0.75 : 0.6) + belly * 0.6],
    [0.15, chest * (female ? 1.04 : 1) + belly * 0.15],
    [0.22, chest * 0.99],
    [0.26, chest * 0.97],
    [0.29, chest * 0.86],
    [0.315, chest * 0.6],
    [0.34, neck * 1.25],
  ], 32, 0.2);
  addPart(torso, torsoGeometry, paints.top, [0, 0.29, 0], [1, 1, build.depth]);
  if (covered) {
    addPart(torso, new THREE.TorusGeometry(hips * 1.08, 0.009, 6, 40), paints.top, [0, 0.015, 0], [1, build.depth, 1], [Math.PI / 2, 0, 0]);
  }
  if (look.top.kind === 'shirt') {
    addPart(torso, new THREE.ConeGeometry(0.048, 0.13, 3), paints.skin, [0, 0.5, chestDepth * 0.93], [1, 1, 0.22], [-0.25, 0, Math.PI]);
  }
  addPart(body, new THREE.CylinderGeometry(neck, neck * 1.12, 0.14, 18), paints.skin, [0, 1.44, 0.004]);
  if (look.chain || look.necklace) {
    const radius = look.chain ? 0.118 : 0.1;
    addPart(body, new THREE.TorusGeometry(radius, look.chain ? 0.0045 : 0.0022, 6, 48), paints.gold, [0, 1.405, 0.035], null, [look.chain ? -1.18 : -1.25, 0, 0]);
  }

  const arms = [createArm(-1), createArm(1)];

  const head = new THREE.Bone();
  head.position.y = 1.49;
  body.add(head);
  addPart(head, unitSphere, paints.skin, [0, 0.13, 0], [0.107, 0.1265, 0.112]);
  for (const side of [-1, 1]) {
    addPart(head, unitSphere, paints.skin, [side * 0.105, 0.13, -0.005], [0.013, 0.028, 0.021]);
    if (!masked) {
      addPart(head, unitSphere, paints.eye, [side * 0.04, 0.155, 0.094], female ? [0.0175, 0.011, 0.008] : [0.016, 0.0095, 0.008]);
      addPart(
        head,
        new THREE.CapsuleGeometry(female ? 0.0062 : 0.0085, 0.036, 4, 8),
        paints.hair,
        [side * 0.042, female ? 0.188 : 0.183, 0.092],
        null,
        [0, 0, Math.PI / 2 - side * (female ? 0.22 : 0.15)],
      );
    }
    if (look.beard) {
      if (!masked) {
        addPart(head, new THREE.CapsuleGeometry(0.011, 0.035, 4, 8), paints.hair, [side * 0.023, 0.1, 0.118], null, [0, 0, Math.PI / 2 + side * 0.32]);
      }
      addPart(head, new THREE.CapsuleGeometry(0.018, 0.05, 4, 8), paints.hair, [side * 0.1, 0.125, 0.015]);
    }
    if (look.earrings) {
      addPart(head, new THREE.TorusGeometry(0.014, 0.0028, 6, 16), paints.gold, [side * 0.109, 0.088, -0.004], null, [0, Math.PI / 2, 0]);
    }
  }
  if (!masked) {
    addPart(head, unitSphere, paints.skin, [0, 0.125, 0.113], female ? [0.013, 0.022, 0.018] : [0.0145, 0.026, 0.02]);
  }
  if (look.beard === 'full') {
    addPart(
      head,
      new THREE.SphereGeometry(0.112, 40, 20, Math.PI / 2 - 1.62, 3.24, 1.68, Math.PI - 1.68),
      paints.hair,
      [0, 0.13, 0.004],
      [1, 1.16, 1.07],
    );
    if (!masked) {
      addPart(head, unitSphere, paints.hair, [0, 0.045, 0.075], [0.068, 0.055, 0.055]);
    }
  } else if (look.beard === 'short') {
    addPart(
      head,
      new THREE.SphereGeometry(0.112, 40, 20, Math.PI / 2 - 1.5, 3, 1.85, Math.PI - 1.85),
      paints.hair,
      [0, 0.13, 0.002],
      [0.99, 1.07, 1.03],
    );
    if (!masked) {
      addPart(head, unitSphere, paints.hair, [0, 0.06, 0.074], [0.05, 0.036, 0.044]);
    }
  }
  if (!masked) {
    if (look.smile) {
      addPart(head, new THREE.TorusGeometry(0.03, 0.0062, 8, 20, Math.PI * 0.64), paints.lips, [0, 0.112, 0.113], null, [0, 0, -Math.PI / 2 - Math.PI * 0.32]);
    } else if (female) {
      addPart(head, new THREE.TorusGeometry(0.026, 0.006, 8, 20, Math.PI * 0.5), paints.lips, [0, 0.112, 0.112], null, [0, 0, -Math.PI / 2 - Math.PI * 0.25]);
    } else {
      addPart(head, new THREE.TorusGeometry(0.034, 0.0055, 8, 20, Math.PI * 0.55), paints.lips, [0, 0.114, 0.115], null, [0, 0, -Math.PI / 2 - Math.PI * 0.275]);
    }
  }
  addPart(
    head,
    new THREE.SphereGeometry(0.114, 36, 16, -Math.PI / 2 - 1.75, 3.5, 0.95, 1.25),
    paints.hair,
    [0, 0.13, 0],
    [0.99, 1.15, 1.04],
  );
  if (look.hair !== 'cap') {
    addPart(head, new THREE.SphereGeometry(0.114, 36, 12, 0, Math.PI * 2, 0, 0.95), paints.hair, [0, 0.133, -0.004], [1, 1.12, 1.05]);
  }
  if (look.hair === 'short') {
    addPart(head, unitSphere, paints.hair, [0, 0.238, 0.055], [0.08, 0.034, 0.058], [-0.35, 0, 0]);
  } else if (look.hair === 'bun') {
    addPart(head, unitSphere, paints.hair, [0, 0.205, -0.112], [0.056, 0.052, 0.05]);
  } else if (look.hair === 'long') {
    const drapeStart = Math.PI / 2 - 0.2;
    const drapeLength = Math.PI + 0.4;
    addPart(head, new THREE.CylinderGeometry(0.118, 0.17, 0.4, 28, 1, true, drapeStart, drapeLength), paints.hair, [0, -0.04, -0.015]);
    for (let i = 0; i < 7; i += 1) {
      const angle = Math.PI + ((i - 3) / 3) * 1.2;
      addPart(head, unitSphere, paints.hair, [Math.sin(angle) * 0.165, -0.225 + (i % 2) * 0.03, -0.015 + Math.cos(angle) * 0.165], [0.04, 0.045, 0.04]);
    }
    for (const side of [-1, 1]) {
      addPart(head, hangingCapsule(0.034, 0.2), paints.hair, [side * 0.112, 0.11, 0.03], null, [-0.35, 0, side * 0.16]);
    }
  }

  if (look.partyHat) {
    const hat = new THREE.Group();
    hat.position.set(look.partyHat.tilt * -0.06, 0.23, 0.004);
    hat.rotation.set(-0.12, 0, look.partyHat.tilt);
    head.add(hat);
    const stripes = look.partyHat.stripes.map((color) => paint(color));
    const bands = 5;
    const hatHeight = 0.21;
    const hatRadius = 0.07;
    for (let band = 0; band < bands; band += 1) {
      const bottom = hatRadius * (1 - band / bands);
      const top = hatRadius * (1 - (band + 1) / bands);
      addPart(hat, new THREE.CylinderGeometry(top, bottom, hatHeight / bands, 20), stripes[band % 2], [0, (band + 0.5) * (hatHeight / bands), 0]);
    }
    addPart(hat, unitSphere, paint('#FFF6E8'), [0, hatHeight, 0], [0.024, 0.024, 0.024]);
  }

  if (look.hair === 'cap') {
    const cap = new THREE.Group();
    cap.position.set(0, 0.18, -0.008);
    cap.rotation.x = -0.22;
    head.add(cap);
    addPart(cap, new THREE.SphereGeometry(0.123, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), paints.crown, [0, 0, 0], [1, 0.92, 1.07]);
    addPart(cap, unitSphere, paints.crown, [0, 0.112, 0], [0.012, 0.007, 0.012]);
    addPart(cap, createBrimGeometry(), paints.brim, [0, 0.002, 0], null, [0.04, 0, 0]);
    if (look.crown) {
      const crown = new THREE.Group();
      crown.position.set(0.006, 0.082, -0.004);
      crown.rotation.set(0.08, 0.3, -0.14);
      cap.add(crown);
      const crownRadius = 0.08;
      const bandHeight = 0.04;
      const spikes = 5;
      const crownGold = paint('#F5C542', 'soft');
      const gems = [paint('#E0283A', 'soft'), paint('#3F63D6', 'soft')];
      addPart(crown, new THREE.CylinderGeometry(crownRadius, crownRadius * 0.94, bandHeight, 30, 1, true), crownGold, [0, bandHeight / 2, 0]);
      for (let spike = 0; spike < spikes; spike += 1) {
        const angle = (spike / spikes) * Math.PI * 2;
        const x = Math.sin(angle) * crownRadius * 0.97;
        const z = Math.cos(angle) * crownRadius * 0.97;
        addPart(crown, new THREE.ConeGeometry(0.024, 0.066, 4), crownGold, [x, bandHeight + 0.03, z], null, [0, angle + Math.PI / 4, 0]);
        addPart(crown, unitSphere, crownGold, [x, bandHeight + 0.066, z], [0.011, 0.011, 0.011]);
        addPart(crown, unitSphere, gems[spike % 2], [Math.sin(angle) * crownRadius * 1.01, bandHeight * 0.5, Math.cos(angle) * crownRadius * 1.01], [0.012, 0.014, 0.007], [0, angle, 0]);
      }
    }
  }

  root.add(bakeSkinnedFigure(body));
  placeholder.dispose();
  if (masked) {
    head.add(createFaceMask(look.face, look.skin));
  }
  root.scale.setScalar(look.scale);

  const weights = { turn: 0, wave: 0, hug: 0, walk: 0 };
  const targets = { turn: 0, wave: 0, hug: 0, walk: 0 };
  let walkPhase = 0;
  root.rotation.y = Math.PI;

  return {
    object3d: root,
    head,
    /**
     * Sets a pose target; the figure blends toward it smoothly.
     * @param {'turn'|'wave'|'hug'|'walk'} name Pose name: `turn` faces the camera behind, `wave` raises the right hand,
     *   `hug` opens or wraps the arms, `walk` swings arms and legs at the current walk phase.
     * @param {number} value Target weight 0..1.
     * @returns {void}
     */
    setPose(name, value) {
      targets[name] = clamp01(value);
    },
    /**
     * Snaps all pose weights to their targets, for jumps between beats.
     * @returns {void}
     */
    snapPose() {
      Object.assign(weights, targets);
    },
    /**
     * Sets the stride phase, advanced by whoever moves the figure so feet keep pace with the ground.
     * @param {number} phase Phase in radians; one full cycle is two steps.
     * @returns {void}
     */
    setWalkPhase(phase) {
      walkPhase = phase;
    },
    /**
     * Animates breathing, idle head sway and the blended poses.
     * @param {number} dt Seconds since the last frame.
     * @param {number} time World time in seconds.
     * @returns {void}
     */
    update(dt, time) {
      weights.turn = damp(weights.turn, targets.turn, 2.2, dt);
      weights.wave = damp(weights.wave, targets.wave, 4, dt);
      weights.hug = damp(weights.hug, targets.hug, 3.2, dt);
      weights.walk = damp(weights.walk, targets.walk, 7, dt);
      const hug = look.hug;
      const breath = Math.sin(time * 1.7 + look.phase);
      torso.scale.set(1 + breath * 0.008, 1 + breath * 0.012, 1 + breath * 0.014);
      body.rotation.set(weights.hug * hug.lean, easeInOutCubic(clamp01(weights.turn)) * Math.PI, Math.sin(time * 2.1) * 0.03 * weights.hug);
      body.position.y = Math.abs(Math.sin(walkPhase)) * 0.022 * weights.walk;
      head.rotation.y = Math.sin(time * 0.4 + look.phase) * 0.14 * (1 - weights.wave * 0.6) * (1 - weights.hug * 0.6);
      head.rotation.x = Math.sin(time * 0.53 + look.phase) * 0.035 - 0.04;
      for (const { leg, knee, side } of legs) {
        const stride = walkPhase + (side > 0 ? 0 : Math.PI);
        leg.rotation.x = Math.sin(stride) * 0.42 * weights.walk;
        knee.rotation.x = (0.06 + 0.75 * Math.max(0, -Math.cos(stride))) * weights.walk;
      }
      for (const { shoulder, elbow, side } of arms) {
        const swing = -Math.sin(walkPhase + (side > 0 ? 0 : Math.PI)) * 0.36 * weights.walk;
        const sway = Math.sin(time * 0.8 + side + look.phase) * 0.03 + swing;
        const waving = side < 0 ? weights.wave : 0;
        const wiggle = Math.sin(time * 8.5) * 0.32 * waving;
        shoulder.rotation.set(
          lerp(lerp(sway, -0.25, waving), hug.shoulderX, weights.hug),
          0,
          side * lerp(lerp(0.09, 1.95, waving), hug.shoulderZ, weights.hug),
        );
        elbow.rotation.set(
          lerp(lerp(-0.15, 0, waving), 0, weights.hug),
          0,
          side * lerp(1.2 * waving + wiggle, -hug.elbowZ, weights.hug),
        );
      }
    },
    /**
     * Frees the avatar resources.
     * @returns {void}
     */
    dispose() {
      disposeObject(root);
    },
  };
}

const FRIEND_WALK_SPEED = 1.25;
const FRIEND_STRIDE = 0.62;
const HUG_RELEASE_SECONDS = 10.6;
const FRIEND_CAST = [
  { look: 'chain', entry: [-5.6, 5.05], hug: [-0.43, 0.02], line: [-0.05, 4.5], delay: 0.3, lineDelay: 0.4 },
  { look: 'curls', entry: [6.6, 3.85], hug: [0.27, -0.3], line: [1.22, 4.42], delay: 0.5, lineDelay: 1 },
  { look: 'lavender', entry: [6.3, 5.45], hug: [0.41, 0.05], line: [1.85, 4.55], delay: 0.6, lineDelay: 0.4 },
];

/**
 * Wraps an angle into -π..π.
 * @param {number} angle Angle in radians.
 * @returns {number} Equivalent angle in -π..π.
 */
function wrapAngle(angle) {
  return Math.atan2(Math.sin(angle), Math.cos(angle));
}

/**
 * Moves a figure across the sand: walks to a target at a steady pace, keeps the feet on the ground,
 * drives the stride and turns smoothly toward where it is heading or told to face.
 * @param {object} avatar Avatar controller to move.
 * @returns {object} Walker controller.
 */
function createWalker(avatar) {
  const position = avatar.object3d.position;
  const target = new THREE.Vector3();
  let moving = false;
  let yaw = 0;
  let desiredYaw = 0;
  let phase = 0;

  return {
    get arrived() {
      return !moving;
    },
    /**
     * Puts the figure somewhere at once, standing still.
     * @param {number} x World x.
     * @param {number} z World z.
     * @param {number} facing Yaw in radians; 0 faces +z (the land), π faces the sea.
     * @returns {void}
     */
    place(x, z, facing) {
      position.set(x, sandHeightAt(x, z), z);
      target.copy(position);
      moving = false;
      yaw = facing;
      desiredYaw = facing;
      avatar.object3d.rotation.y = yaw;
      avatar.setPose('walk', 0);
    },
    /**
     * Starts walking to a spot; repeated calls with the same spot change nothing.
     * @param {number} x World x.
     * @param {number} z World z.
     * @returns {void}
     */
    moveTo(x, z) {
      if (target.x === x && target.z === z) {
        return;
      }
      target.set(x, 0, z);
      moving = true;
    },
    /**
     * Turns toward a fixed yaw once standing.
     * @param {number} angle Yaw in radians.
     * @returns {void}
     */
    face(angle) {
      desiredYaw = angle;
    },
    /**
     * Turns toward a point once standing.
     * @param {THREE.Vector3} point World point to face.
     * @returns {void}
     */
    faceToward(point) {
      desiredYaw = Math.atan2(point.x - position.x, point.z - position.z);
    },
    /**
     * Steps toward the target, slowing for the last half metre, and updates the stride and heading.
     * @param {number} dt Seconds since the last frame.
     * @returns {void}
     */
    update(dt) {
      if (moving) {
        const dx = target.x - position.x;
        const dz = target.z - position.z;
        const distance = Math.hypot(dx, dz);
        if (distance < 0.005) {
          moving = false;
        } else {
          const step = Math.min(distance, FRIEND_WALK_SPEED * dt * Math.min(1, 0.3 + distance / 0.5));
          position.x += (dx / distance) * step;
          position.z += (dz / distance) * step;
          desiredYaw = Math.atan2(dx, dz);
          phase += (step / FRIEND_STRIDE) * Math.PI;
        }
      }
      position.y = sandHeightAt(position.x, position.z);
      yaw += wrapAngle(desiredYaw - yaw) * (1 - Math.exp(-6 * dt));
      avatar.object3d.rotation.y = yaw;
      avatar.setPose('walk', moving ? 1 : 0);
      avatar.setWalkPhase(phase);
    },
  };
}

/**
 * Creates the three friends who walk in along the beach, hug Andrii and stay with him for the fireworks.
 * @returns {object} Friends controller.
 */
function createFriends() {
  const group = new THREE.Group();
  const actors = FRIEND_CAST.map((cast) => {
    const avatar = createAvatar(AVATAR_LOOKS[cast.look]);
    group.add(avatar.object3d);
    return {
      cast,
      avatar,
      walker: createWalker(avatar),
      hugSpot: new THREE.Vector3(AVATAR_SPOT.x + cast.hug[0], 0, AVATAR_SPOT.z + cast.hug[1]),
    };
  });
  group.visible = false;

  /**
   * Sets every friend's pose targets and snaps to them.
   * @param {number} hug Hug weight.
   * @param {number} wave Wave weight.
   * @returns {void}
   */
  function resetPoses(hug, wave) {
    for (const { avatar } of actors) {
      avatar.setPose('hug', hug);
      avatar.setPose('wave', wave);
      avatar.snapPose();
    }
  }

  return {
    object3d: group,
    get visible() {
      return group.visible;
    },
    /**
     * Removes the friends from the scene.
     * @returns {void}
     */
    hide() {
      group.visible = false;
    },
    /**
     * Puts the friends at their starting spots off-screen along the beach, ready to walk in.
     * @returns {void}
     */
    enter() {
      group.visible = true;
      for (const { cast, walker, hugSpot } of actors) {
        walker.place(cast.entry[0], cast.entry[1], Math.atan2(hugSpot.x - cast.entry[0], hugSpot.z - cast.entry[1]));
      }
      resetPoses(0, 0);
    },
    /**
     * Snaps the friends into the line beside Andrii.
     * @param {number} facing Yaw in radians; π faces the sea, 0 faces the camera.
     * @returns {void}
     */
    standInLine(facing) {
      group.visible = true;
      for (const { cast, walker } of actors) {
        walker.place(cast.line[0], cast.line[1], facing);
      }
      resetPoses(0, 0);
    },
    /**
     * Runs the hug: each friend walks up to Andrii and wraps their arms around him, then all step into a line facing the sea.
     * @param {number} beatTime Seconds into the hug beat.
     * @returns {void}
     */
    hug(beatTime) {
      for (const { cast, avatar, walker, hugSpot } of actors) {
        if (beatTime < cast.delay) {
          continue;
        }
        if (beatTime < HUG_RELEASE_SECONDS) {
          walker.moveTo(hugSpot.x, hugSpot.z);
          if (walker.arrived) {
            walker.faceToward(AVATAR_SPOT);
            avatar.setPose('hug', 1);
          }
          continue;
        }
        avatar.setPose('hug', 0);
        if (beatTime > HUG_RELEASE_SECONDS + cast.lineDelay) {
          walker.moveTo(cast.line[0], cast.line[1]);
          if (walker.arrived) {
            walker.face(Math.PI);
          }
        }
      }
    },
    /**
     * Turns the friends round to the camera one after another and has them wave with Andrii.
     * @param {number} beatTime Seconds into the polaroid beat.
     * @returns {void}
     */
    reveal(beatTime) {
      actors.forEach(({ avatar, walker }, index) => {
        walker.face(beatTime >= 5.4 + index * 0.3 ? 0 : Math.PI);
        const waveStart = 8.4 + index * 0.35;
        avatar.setPose('wave', beatTime >= waveStart && beatTime < waveStart + 2.6 ? 1 : 0);
      });
    },
    /**
     * Faces everyone to the camera with arms down, for the idle loop.
     * @returns {void}
     */
    faceCamera() {
      for (const { avatar, walker } of actors) {
        walker.face(0);
        avatar.setPose('wave', 0);
        avatar.setPose('hug', 0);
      }
    },
    /**
     * Moves and animates the friends.
     * @param {number} dt Seconds since the last frame.
     * @param {number} time World time in seconds.
     * @returns {void}
     */
    update(dt, time) {
      if (!group.visible) {
        return;
      }
      for (const { avatar, walker } of actors) {
        walker.update(dt);
        avatar.update(dt, time);
      }
    },
  };
}

const BOTTLE_SCALE = 1.25;
const BOTTLE_REST_HEIGHT = 0.045 * BOTTLE_SCALE;
const BOTTLE_DRIFT_SPEED = 2.2;
const BOTTLE_SWASH_PUSH = 9;
const BOTTLE_PATIENCE_SECONDS = 8;
const BOTTLE_LANDING = new THREE.Vector3(-0.6, sandHeightAt(-0.6, 2) + BOTTLE_REST_HEIGHT, 2);
const SCROLL_WIDTH = 0.42;
const SCROLL_HEIGHT = 0.56;
const SCROLL_ROLL_RADIUS = 0.08;
const SCROLL_IN_BOTTLE_SCALE = 0.28;
const SCROLL_WRITE_SECONDS = 6.5;
const SCROLL_AUTO_CONTINUE_SECONDS = 12;

/**
 * Builds a soft radial glow used for the bottle's glint.
 * @returns {THREE.CanvasTexture} White radial gradient on transparent.
 */
function createGlowTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const context = canvas.getContext('2d');
  const gradient = context.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
  gradient.addColorStop(0.18, 'rgba(255, 255, 255, 0.55)');
  gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.12)');
  gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
  context.fillStyle = gradient;
  context.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}

/**
 * Creates the message bottle: glass, cork and rolled scroll inside, plus its glow, tap target and cork-pop puff.
 * It rides the waves in, surging on each crest, until the swash strands it near the avatar, and opens on request.
 * @param {{tier: string}} quality Quality settings.
 * @returns {object} Bottle controller.
 */
function createBottle(quality) {
  const root = new THREE.Group();
  const carrier = new THREE.Group();
  const body = new THREE.Group();
  body.scale.setScalar(BOTTLE_SCALE);
  carrier.add(body);
  root.add(carrier);

  const profile = [
    [0, -0.16], [0.036, -0.16], [0.044, -0.152], [0.045, -0.14], [0.045, 0.03], [0.041, 0.058],
    [0.026, 0.088], [0.0165, 0.108], [0.0155, 0.148], [0.0185, 0.152], [0.0185, 0.162], [0.014, 0.164],
  ].map(([x, y]) => new THREE.Vector2(x, y));
  const glass = quality.tier === 'high'
    ? new THREE.MeshPhysicalMaterial({ color: '#BFE6D8', roughness: 0.06, transmission: 0.92, thickness: 0.015, ior: 1.5, envMapIntensity: 1.3 })
    : new THREE.MeshStandardMaterial({ color: '#9FD1C2', roughness: 0.1, transparent: true, opacity: 0.45, envMapIntensity: 1.5 });
  const glassMesh = new THREE.Mesh(new THREE.LatheGeometry(profile, 32), glass);
  glassMesh.castShadow = true;
  const innerScroll = new THREE.Group();
  innerScroll.add(
    new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.15, 18), new THREE.MeshStandardMaterial({ color: '#EADFC4', roughness: 0.9 })),
    new THREE.Mesh(new THREE.TorusGeometry(0.0235, 0.004, 6, 24), new THREE.MeshStandardMaterial({ color: PALETTE.red, roughness: 0.6 })),
  );
  innerScroll.children[1].rotation.x = Math.PI / 2;
  innerScroll.position.y = -0.03;
  const neckAnchor = new THREE.Object3D();
  neckAnchor.position.y = 0.158;
  body.add(glassMesh, innerScroll, neckAnchor);

  const cork = new THREE.Mesh(
    new THREE.CylinderGeometry(0.0145, 0.0125, 0.036, 16),
    new THREE.MeshStandardMaterial({ color: '#B8875A', roughness: 0.95 }),
  );
  cork.scale.setScalar(BOTTLE_SCALE);
  cork.castShadow = true;
  root.add(cork);

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: createGlowTexture(),
    color: PALETTE.gold,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false,
  }));
  glow.renderOrder = 2;
  carrier.add(glow);

  const hitTarget = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 8), new THREE.MeshBasicMaterial({ visible: false }));
  carrier.add(hitTarget);

  const puffCount = 28;
  const puffGeometry = new THREE.BufferGeometry();
  puffGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(puffCount * 3), 3));
  const puffMaterial = new THREE.PointsMaterial({ color: '#FFF6E8', size: 0.03, transparent: true, opacity: 0, depthWrite: false });
  const puff = new THREE.Points(puffGeometry, puffMaterial);
  puff.frustumCulled = false;
  puff.renderOrder = 2;
  root.add(puff);
  const puffRandom = createRandom(11);
  const puffVelocities = Array.from({ length: puffCount }, () => new THREE.Vector3(
    (puffRandom() - 0.5) * 0.7,
    0.25 + puffRandom() * 0.5,
    (puffRandom() - 0.5) * 0.7,
  ));
  const puffOrigin = new THREE.Vector3();
  let puffTime = Infinity;

  const driftPath = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-4.4, 0, -22),
    new THREE.Vector3(-3, 0, -12),
    new THREE.Vector3(-1.9, 0, -4.5),
    new THREE.Vector3(-1.1, 0, -0.2),
    new THREE.Vector3(BOTTLE_LANDING.x, 0, BOTTLE_LANDING.z),
  ], false, 'catmullrom', 0.5);
  const driftLength = driftPath.getLength();
  const surfWave = WAVES[0];
  const surfNumber = (Math.PI * 2) / surfWave.wavelength;
  const surfSpeed = Math.sqrt(GRAVITY / surfNumber);
  const orbit = { x: 0, y: 0, z: 0 };
  const landingYaw = 0.55;
  const up = new THREE.Vector3(0, 1, 0);
  const point = new THREE.Vector3();
  const surfaceNormal = new THREE.Vector3();
  const tilt = new THREE.Quaternion();
  const yawQuaternion = new THREE.Quaternion();
  const targetQuaternion = new THREE.Quaternion();
  const neckDirection = new THREE.Vector3();
  const corkVelocity = new THREE.Vector3();
  let corkState = 'attached';
  let corkSpin = 0;
  let state = 'hidden';
  let stateTime = 0;
  let driftProgress = 0;
  let driftDistance = 0;
  let driftSpeed = 0;
  let lastWater = null;
  let orbitBlend = 1;
  let raise = 0;
  let snapNextFloat = true;

  /**
   * Switches state and restarts the state clock.
   * @param {string} name New state.
   * @returns {void}
   */
  function setState(name) {
    state = name;
    stateTime = 0;
    root.visible = name !== 'hidden';
  }

  /**
   * Floats the bottle on the water at a spot, swinging round the wave orbit of the water there,
   * and resting on the sand where the water is too shallow.
   * @param {THREE.Vector3} spot Position on the drift path (y ignored).
   * @param {number} time World time in seconds.
   * @param {number} dt Seconds since the last frame.
   * @param {number} orbitWeight How much of the wave orbit to follow, 0 when grounded.
   * @returns {void}
   */
  function floatAt(spot, time, dt, orbitWeight) {
    orbitBlend = snapNextFloat ? orbitWeight : damp(orbitBlend, orbitWeight, 3, dt);
    waveDisplacement(spot.x, spot.z, time, orbit);
    const x = lerp(spot.x, orbit.x, orbitBlend);
    const z = lerp(spot.z, orbit.z, orbitBlend);
    const water = waveHeightAt(x, z, time) - 0.012;
    const ground = sandHeightAt(x, z) + BOTTLE_REST_HEIGHT;
    const floating = smoothstep(ground - 0.02, ground + 0.06, water);
    const height = Math.max(water, ground);
    carrier.position.x = x;
    carrier.position.z = z;
    carrier.position.y = snapNextFloat ? height : damp(carrier.position.y, height, 12, dt);
    const slopeX = (waveHeightAt(x + 0.3, z, time) - waveHeightAt(x - 0.3, z, time)) / 0.6;
    const slopeZ = (waveHeightAt(x, z + 0.3, time) - waveHeightAt(x, z - 0.3, time)) / 0.6;
    surfaceNormal.set(-slopeX * floating, 1, -slopeZ * floating).normalize();
    tilt.setFromUnitVectors(up, surfaceNormal);
    yawQuaternion.setFromAxisAngle(up, landingYaw + Math.sin(time * 0.35) * 0.4 * (1 - driftProgress));
    targetQuaternion.multiplyQuaternions(tilt, yawQuaternion);
    if (snapNextFloat) {
      carrier.quaternion.copy(targetQuaternion);
    } else {
      carrier.quaternion.slerp(targetQuaternion, 1 - Math.exp(-6 * dt));
    }
    snapNextFloat = false;
  }

  /**
   * Carries the bottle along its path the way the sea would: a push on every passing crest offshore,
   * then in the shallows only while visible swash covers it, running up with the rising water and sliding back a little
   * as it drains, until it is left at the high-water line. After a while thinner swashes are enough, so it always comes ashore.
   * @param {number} time World time in seconds.
   * @param {number} dt Seconds since the last frame.
   * @returns {void}
   */
  function drift(time, dt) {
    driftPath.getPointAt(driftDistance / driftLength, point);
    const water = waveHeightAt(point.x, point.z, time);
    const shallows = smoothstep(driftLength - 6, driftLength, driftDistance);
    const help = smoothstep(BOTTLE_PATIENCE_SECONDS, BOTTLE_PATIENCE_SECONDS + 5, stateTime);
    const depth = water - sandHeightAt(point.x, point.z) - lerp(0.03, lerp(0.03, 0, help), shallows);
    const afloat = smoothstep(0, 0.02, depth);
    const rising = lastWater === null || dt <= 0 ? 0 : (water - lastWater) / dt;
    lastWater = water;
    const crest = Math.sin(surfNumber * (surfWave.direction.x * point.x + surfWave.direction.y * point.z - surfSpeed * time));
    const push = BOTTLE_DRIFT_SPEED * (1 + 0.8 * crest) * (1 - shallows * 0.7) + BOTTLE_SWASH_PUSH * rising * shallows;
    driftSpeed = lerp(driftSpeed * Math.exp(-4 * dt), damp(driftSpeed, push, 2.5, dt), afloat);
    driftDistance = THREE.MathUtils.clamp(driftDistance + driftSpeed * dt, 0, driftLength);
    driftProgress = driftDistance / driftLength;
    floatAt(point, time, dt, afloat * (1 - smoothstep(driftLength - 1.5, driftLength, driftDistance)));
  }

  /**
   * Places the bottle at its landing spot with an optional settling rock.
   * @param {number} rock Rocking angle in radians.
   * @returns {void}
   */
  function restOnSand(rock) {
    carrier.position.copy(BOTTLE_LANDING);
    carrier.position.y += raise * 0.035;
    yawQuaternion.setFromAxisAngle(up, landingYaw);
    tilt.setFromAxisAngle(new THREE.Vector3(1, 0, 0), rock);
    carrier.quaternion.multiplyQuaternions(yawQuaternion, tilt);
  }

  /**
   * Keeps the cork in the neck while attached, or flies it under gravity once popped.
   * @param {number} dt Seconds since the last frame.
   * @returns {void}
   */
  function updateCork(dt) {
    if (corkState === 'attached') {
      root.updateMatrixWorld(true);
      neckAnchor.getWorldPosition(cork.position);
      body.getWorldQuaternion(cork.quaternion);
      return;
    }
    if (corkState !== 'flying') {
      return;
    }
    corkVelocity.y -= GRAVITY * dt;
    cork.position.addScaledVector(corkVelocity, dt);
    corkSpin += dt * 14;
    cork.rotation.set(corkSpin, corkSpin * 0.6, 0);
    const floor = sandHeightAt(cork.position.x, cork.position.z) + 0.016;
    if (cork.position.y <= floor && corkVelocity.y < 0) {
      cork.position.y = floor;
      if (corkVelocity.length() > 1) {
        corkVelocity.y *= -0.3;
        corkVelocity.x *= 0.5;
        corkVelocity.z *= 0.5;
      } else {
        corkState = 'resting';
        cork.rotation.set(Math.PI / 2, 0, 0.6);
      }
    }
  }

  /**
   * Pops the cork out along the neck and starts the puff.
   * @returns {void}
   */
  function popCork() {
    root.updateMatrixWorld(true);
    neckAnchor.getWorldPosition(cork.position);
    neckDirection.set(0, 1, 0).applyQuaternion(body.getWorldQuaternion(new THREE.Quaternion()));
    corkVelocity.copy(neckDirection).multiplyScalar(2.2).add(new THREE.Vector3(0.25, 1.6, 0.35));
    corkState = 'flying';
    puffOrigin.copy(cork.position);
    puffTime = 0;
  }

  /**
   * Expands and fades the cork-pop puff.
   * @param {number} dt Seconds since the last frame.
   * @returns {void}
   */
  function updatePuff(dt) {
    puffTime += dt;
    const life = 0.9;
    if (puffTime > life) {
      puffMaterial.opacity = 0;
      return;
    }
    const positions = puffGeometry.attributes.position;
    const spread = puffTime * (1 - puffTime * 0.4);
    for (let i = 0; i < puffCount; i += 1) {
      positions.setXYZ(
        i,
        puffOrigin.x + puffVelocities[i].x * spread,
        puffOrigin.y + puffVelocities[i].y * spread,
        puffOrigin.z + puffVelocities[i].z * spread,
      );
    }
    positions.needsUpdate = true;
    puffMaterial.opacity = 0.7 * (1 - puffTime / life);
    puffMaterial.size = 0.03 + puffTime * 0.05;
  }

  /**
   * Drives the glint: a twinkle while drifting, a gentle pulse while it waits to be tapped.
   * @param {number} time World time in seconds.
   * @returns {void}
   */
  function updateGlow(time) {
    let size = 0;
    let opacity = 0;
    if (state === 'drifting') {
      size = lerp(2.4, 0.9, driftProgress);
      opacity = 0.6 + 0.4 * Math.pow(Math.abs(Math.sin(time * 2.7)), 4);
    } else if (state === 'landed') {
      const pulse = 0.5 + 0.5 * Math.sin(time * 3);
      size = 0.5 + pulse * 0.12;
      opacity = 0.45 + pulse * 0.3;
    } else if (state === 'opening') {
      size = 0.5;
      opacity = 0.6 * (1 - smoothstep(0, 0.6, stateTime));
    }
    glow.scale.setScalar(size);
    glow.material.opacity = opacity;
    glow.visible = opacity > 0.01;
  }

  /**
   * Simulates the cork flight to rest at once, so jumps between beats look the same as a full play.
   * @returns {void}
   */
  function settleCorkInstantly() {
    popCork();
    for (let step = 0; step < 600 && corkState === 'flying'; step += 1) {
      updateCork(1 / 120);
    }
    puffTime = Infinity;
    puffMaterial.opacity = 0;
  }

  setState('hidden');

  return {
    object3d: root,
    position: carrier.position,
    /**
     * Hides the bottle and puts the cork back, ready for a new drift.
     * @returns {void}
     */
    reset() {
      setState('hidden');
      corkState = 'attached';
      raise = 0;
      body.rotation.z = -Math.PI / 2;
      innerScroll.visible = true;
      puffTime = Infinity;
      puffMaterial.opacity = 0;
    },
    /**
     * Starts the ride in from the sea.
     * @returns {void}
     */
    startDrift() {
      this.reset();
      driftProgress = 0;
      driftDistance = 0;
      driftSpeed = BOTTLE_DRIFT_SPEED;
      lastWater = null;
      snapNextFloat = true;
      setState('drifting');
    },
    /**
     * Snaps the bottle onto the sand, closed.
     * @returns {void}
     */
    land() {
      this.reset();
      driftProgress = 1;
      setState('landed');
      stateTime = 10;
    },
    /**
     * Starts tilting the neck up and popping the cork.
     * @returns {void}
     */
    open() {
      setState('opening');
    },
    /**
     * Snaps to the opened state: neck up, cork lying on the sand, scroll gone.
     * @returns {void}
     */
    setOpened() {
      this.reset();
      setState('opened');
      raise = 1;
      body.rotation.z = -Math.PI / 2 + 0.62;
      innerScroll.visible = false;
      restOnSand(0);
      settleCorkInstantly();
    },
    /**
     * Hides the rolled scroll inside the glass once it has flown out.
     * @returns {void}
     */
    releaseScroll() {
      innerScroll.visible = false;
    },
    /**
     * Writes the neck's world position and the inner scroll's world orientation.
     * @param {THREE.Vector3} position Receives the neck position.
     * @param {THREE.Quaternion} quaternion Receives the bottle body orientation.
     * @returns {void}
     */
    getNeckPose(position, quaternion) {
      root.updateMatrixWorld(true);
      neckAnchor.getWorldPosition(position);
      body.getWorldQuaternion(quaternion);
    },
    /**
     * Whether the bottle is waiting on the sand to be tapped.
     * @returns {boolean} True when tappable.
     */
    isClickable() {
      return state === 'landed' && stateTime > 0.8;
    },
    /**
     * Checks a ray against the enlarged tap target.
     * @param {THREE.Raycaster} raycaster Ray from the pointer.
     * @returns {boolean} True when the ray hits the bottle.
     */
    hitTest(raycaster) {
      return root.visible && raycaster.intersectObject(hitTarget, false).length > 0;
    },
    get state() {
      return state;
    },
    get stateTime() {
      return stateTime;
    },
    get driftProgress() {
      return driftProgress;
    },
    /**
     * Advances drifting, landing, opening and the cork.
     * @param {number} dt Seconds since the last frame.
     * @param {number} time World time in seconds.
     * @returns {void}
     */
    update(dt, time) {
      if (state === 'hidden') {
        return;
      }
      stateTime += dt;
      if (state === 'drifting') {
        drift(time, dt);
        if (driftDistance >= driftLength) {
          setState('landed');
        }
      } else if (state === 'landed') {
        restOnSand(0.14 * Math.exp(-3 * stateTime) * Math.sin(stateTime * 7));
      } else if (state === 'opening') {
        raise = easeInOutCubic(clamp01(stateTime / 0.6));
        body.rotation.z = -Math.PI / 2 + raise * 0.62;
        restOnSand(0);
        if (stateTime >= 0.62 && corkState === 'attached') {
          popCork();
        }
        if (stateTime >= 1.6) {
          setState('opened');
        }
      }
      updateCork(dt);
      updatePuff(dt);
      updateGlow(time);
    },
  };
}

/**
 * Splits text into lines that fit a width with the context's current font.
 * @param {CanvasRenderingContext2D} context Canvas context with the font set.
 * @param {string} text Text to wrap.
 * @param {number} maxWidth Maximum line width in pixels.
 * @returns {Array<string>} Wrapped lines.
 */
function wrapText(context, text, maxWidth) {
  const lines = [];
  let line = '';
  for (const word of text.split(' ')) {
    const candidate = line ? `${line} ${word}` : word;
    if (line && context.measureText(candidate).width > maxWidth) {
      lines.push(line);
      line = word;
    } else {
      line = candidate;
    }
  }
  if (line) {
    lines.push(line);
  }
  return lines;
}

/**
 * Paints aged paper: warm base, darker edges, fibres and speckles.
 * @returns {THREE.CanvasTexture} Paper texture.
 */
function createPaperTexture() {
  const width = 512;
  const height = 683;
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext('2d');
  const random = createRandom(5);
  context.fillStyle = '#F1E4C6';
  context.fillRect(0, 0, width, height);
  const vignette = context.createRadialGradient(width / 2, height / 2, width * 0.25, width / 2, height / 2, height * 0.75);
  vignette.addColorStop(0, 'rgba(160, 115, 60, 0)');
  vignette.addColorStop(1, 'rgba(150, 100, 45, 0.45)');
  context.fillStyle = vignette;
  context.fillRect(0, 0, width, height);
  for (let i = 0; i < 500; i += 1) {
    const x = random() * width;
    const y = random() * height;
    const angle = random() * Math.PI;
    const length = 4 + random() * 14;
    context.strokeStyle = `rgba(120, 85, 45, ${0.03 + random() * 0.05})`;
    context.lineWidth = 0.6;
    context.beginPath();
    context.moveTo(x, y);
    context.lineTo(x + Math.cos(angle) * length, y + Math.sin(angle) * length);
    context.stroke();
  }
  for (let i = 0; i < 160; i += 1) {
    context.fillStyle = `rgba(110, 70, 30, ${0.04 + random() * 0.08})`;
    context.beginPath();
    context.arc(random() * width, random() * height, 0.5 + random() * 2.2, 0, Math.PI * 2);
    context.fill();
  }
  context.strokeStyle = 'rgba(110, 65, 25, 0.35)';
  context.lineWidth = 6;
  context.strokeRect(3, 3, width - 6, height - 6);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 8;
  return texture;
}

/**
 * Creates the ink layer of the greeting. Each glyph's red channel stores its place in reading order,
 * so a single uniform can "write" the text in; blue marks the title ink.
 * @returns {{texture: THREE.CanvasTexture, draw: () => void}} Ink texture and a redraw function.
 */
function createInkLayer() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 1366;
  const context = canvas.getContext('2d');
  const texture = new THREE.CanvasTexture(canvas);
  texture.premultiplyAlpha = true;
  texture.anisotropy = 8;
  const margin = 84;
  const maxWidth = canvas.width - margin * 2;
  const titleFont = '600 100px Caveat, cursive';
  const bodyFont = '600 58px Caveat, cursive';

  /**
   * Lays out and paints the greeting with order-encoded colours.
   * @returns {void}
   */
  function draw() {
    const lines = [];
    context.font = titleFont;
    for (const text of wrapText(context, GREETING.title, maxWidth)) {
      lines.push({ text, font: titleFont, height: 108, title: true, align: 'center' });
    }
    lines.push({ height: 46 });
    context.font = bodyFont;
    for (const paragraph of GREETING.body) {
      for (const text of wrapText(context, paragraph, maxWidth)) {
        lines.push({ text, font: bodyFont, height: 82, title: false, align: 'center' });
      }
    }
    lines.push({ height: 40 });
    lines.push({ text: GREETING.closing, font: bodyFont, height: 82, title: false, align: 'center' });
    lines.push({ text: GREETING.signature, font: bodyFont, height: 82, title: false, align: 'right' });

    let totalWidth = 0;
    let totalHeight = 0;
    for (const line of lines) {
      totalHeight += line.height;
      if (line.text) {
        context.font = line.font;
        line.width = context.measureText(line.text).width;
        totalWidth += line.width;
      }
    }

    context.clearRect(0, 0, canvas.width, canvas.height);
    context.textBaseline = 'alphabetic';
    let y = (canvas.height - totalHeight) / 2;
    let written = 0;
    for (const line of lines) {
      if (line.text) {
        context.font = line.font;
        const x = line.align === 'right' ? canvas.width - margin - line.width : (canvas.width - line.width) / 2;
        const startOrder = Math.round((written / totalWidth) * 255);
        const endOrder = Math.round(((written + line.width) / totalWidth) * 255);
        const blue = line.title ? 255 : 0;
        const gradient = context.createLinearGradient(x, 0, x + line.width, 0);
        gradient.addColorStop(0, `rgb(${startOrder}, 0, ${blue})`);
        gradient.addColorStop(1, `rgb(${endOrder}, 0, ${blue})`);
        context.fillStyle = gradient;
        context.fillText(line.text, x, y + line.height * 0.78);
        written += line.width;
      }
      y += line.height;
    }
    texture.needsUpdate = true;
  }

  draw();
  return { texture, draw };
}

/**
 * Creates the greeting scroll: flies out of the bottle, unrolls in front of the camera and writes itself in.
 * @returns {object} Scroll controller.
 */
function createScroll() {
  const group = new THREE.Group();
  group.visible = false;
  const geometry = new THREE.PlaneGeometry(SCROLL_WIDTH, SCROLL_HEIGHT, 1, 200);
  geometry.translate(0, -SCROLL_HEIGHT / 2, 0);
  const ink = createInkLayer();
  const uniforms = {
    uUnroll: { value: 0 },
    uHeight: { value: SCROLL_HEIGHT },
    uRadius: { value: SCROLL_ROLL_RADIUS },
    uPaper: { value: createPaperTexture() },
    uInk: { value: ink.texture },
    uReveal: { value: 0 },
    uInkColor: { value: new THREE.Color('#3B2A1E') },
    uTitleColor: { value: new THREE.Color('#A3242F') },
    uLight: { value: new THREE.Color('#FFF6EA') },
  };
  const material = new THREE.ShaderMaterial({
    uniforms,
    side: THREE.DoubleSide,
    vertexShader: `
      uniform float uUnroll;
      uniform float uHeight;
      uniform float uRadius;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vec3 bent = position;
        float along = -position.y;
        float flatLength = uUnroll * uHeight;
        if (along > flatLength) {
          float angle = (along - flatLength) / uRadius;
          float radius = max(uRadius - angle * 0.004, uRadius * 0.4);
          bent.y = -flatLength - sin(angle) * radius;
          bent.z = radius - cos(angle) * radius;
        }
        gl_Position = projectionMatrix * modelViewMatrix * vec4(bent, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D uPaper;
      uniform sampler2D uInk;
      uniform float uReveal;
      uniform vec3 uInkColor;
      uniform vec3 uTitleColor;
      uniform vec3 uLight;
      varying vec2 vUv;
      void main() {
        vec3 paper = texture2D(uPaper, vUv).rgb;
        vec4 ink = texture2D(uInk, vUv);
        float coverage = gl_FrontFacing ? ink.a : 0.0;
        float order = ink.a > 0.001 ? ink.r / ink.a : 1.0;
        float title = ink.a > 0.001 ? ink.b / ink.a : 0.0;
        float written = clamp((uReveal * 1.02 - order) / 0.02, 0.0, 1.0);
        vec3 inkColor = mix(uInkColor, uTitleColor, step(0.5, title));
        vec3 color = mix(paper * (gl_FrontFacing ? 1.0 : 0.85), inkColor, coverage * written);
        gl_FragColor = vec4(color * uLight, 1.0);
        #include <colorspace_fragment>
      }
    `,
  });
  const sheet = new THREE.Mesh(geometry, material);
  sheet.frustumCulled = false;
  const rod = new THREE.Mesh(
    new THREE.CylinderGeometry(0.011, 0.011, SCROLL_WIDTH + 0.02, 16),
    new THREE.MeshBasicMaterial({ color: '#C9A877' }),
  );
  rod.rotation.z = Math.PI / 2;
  rod.position.z = 0.006;
  group.add(sheet, rod);

  const startPosition = new THREE.Vector3();
  const startQuaternion = new THREE.Quaternion();
  const controlPosition = new THREE.Vector3();
  const targetPosition = new THREE.Vector3();
  const forward = new THREE.Vector3();
  const cameraUp = new THREE.Vector3();
  const alongBottle = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2);
  let state = 'hidden';
  let stateTime = 0;

  if (document.fonts) {
    trackAsset(document.fonts.load('600 64px Caveat', GREETING_TEXT)).then(() => ink.draw()).catch(() => {});
  }
  document.fonts?.addEventListener('loadingdone', () => ink.draw());

  /**
   * Switches state and restarts the state clock.
   * @param {string} name New state.
   * @returns {void}
   */
  function setState(name) {
    state = name;
    stateTime = 0;
    group.visible = name !== 'hidden';
  }

  /**
   * Works out where the open scroll should hang so it fills most of the view, top edge first.
   * @param {THREE.PerspectiveCamera} camera Camera the scroll faces.
   * @returns {void}
   */
  function computeTarget(camera) {
    const halfTan = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
    const fitHeight = (SCROLL_HEIGHT / 0.74) / (2 * halfTan);
    const fitWidth = (SCROLL_WIDTH / 0.86) / (2 * halfTan * camera.aspect);
    const distance = Math.max(fitHeight, fitWidth);
    camera.getWorldDirection(forward);
    cameraUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
    targetPosition.copy(camera.position)
      .addScaledVector(forward, distance)
      .addScaledVector(cameraUp, SCROLL_HEIGHT / 2);
  }

  /**
   * Pins the scroll at its open spot facing the camera.
   * @param {THREE.PerspectiveCamera} camera Camera the scroll faces.
   * @returns {void}
   */
  function pinToCamera(camera) {
    group.position.copy(targetPosition);
    group.quaternion.copy(camera.quaternion);
    group.scale.setScalar(1);
  }

  return {
    object3d: group,
    text: GREETING_TEXT,
    /**
     * Hides the scroll.
     * @returns {void}
     */
    hide() {
      setState('hidden');
    },
    /**
     * Launches the rolled scroll out of the bottle neck.
     * @param {THREE.Vector3} position Neck position.
     * @param {THREE.Quaternion} bottleQuaternion Bottle body orientation; the roll starts along its axis.
     * @returns {void}
     */
    emerge(position, bottleQuaternion) {
      startPosition.copy(position);
      startQuaternion.multiplyQuaternions(bottleQuaternion, alongBottle);
      uniforms.uUnroll.value = 0;
      uniforms.uReveal.value = 0;
      setState('flying');
    },
    /**
     * Writes the rest of the text at once.
     * @returns {void}
     */
    finishWriting() {
      if (state === 'writing' || state === 'unrolling') {
        uniforms.uUnroll.value = 1;
        uniforms.uReveal.value = 1;
        setState('written');
      }
    },
    /**
     * Rolls the scroll back up and sends it off.
     * @returns {void}
     */
    rollUp() {
      if (state !== 'hidden') {
        setState('rollingUp');
      }
    },
    get state() {
      return state;
    },
    get stateTime() {
      return stateTime;
    },
    /**
     * Animates flight, unrolling, writing and rolling up.
     * @param {number} dt Seconds since the last frame.
     * @param {THREE.PerspectiveCamera} camera Camera the scroll faces.
     * @returns {void}
     */
    update(dt, camera) {
      if (state === 'hidden') {
        return;
      }
      stateTime += dt;
      computeTarget(camera);
      if (state === 'flying') {
        const t = easeInOutCubic(clamp01(stateTime / 1.6));
        controlPosition.copy(startPosition).lerp(targetPosition, 0.35);
        controlPosition.y += 0.9;
        const inverse = 1 - t;
        group.position.copy(startPosition).multiplyScalar(inverse * inverse)
          .addScaledVector(controlPosition, 2 * inverse * t)
          .addScaledVector(targetPosition, t * t);
        group.quaternion.slerpQuaternions(startQuaternion, camera.quaternion, t);
        group.scale.setScalar(lerp(SCROLL_IN_BOTTLE_SCALE, 1, t));
        if (stateTime >= 1.6) {
          setState('unrolling');
        }
        return;
      }
      pinToCamera(camera);
      if (state === 'unrolling') {
        uniforms.uUnroll.value = easeInOutCubic(clamp01(stateTime / 1.4));
        if (stateTime >= 1.4) {
          setState('writing');
        }
      } else if (state === 'writing') {
        uniforms.uReveal.value = clamp01(stateTime / SCROLL_WRITE_SECONDS);
        if (stateTime >= SCROLL_WRITE_SECONDS) {
          setState('written');
        }
      } else if (state === 'rollingUp') {
        uniforms.uUnroll.value = 1 - easeInOutCubic(clamp01(stateTime / 1));
        const away = smoothstep(1, 2, stateTime);
        group.position.addScaledVector(cameraUp, away * 1.5);
        group.scale.setScalar(1 - away * 0.7);
        if (stateTime >= 2) {
          setState('hidden');
        }
      }
    },
  };
}

/**
 * Turns pointer input on the canvas into taps and hover rays. Small drags (orbit) are not taps.
 * @param {HTMLCanvasElement} canvas Canvas receiving pointer events.
 * @param {THREE.PerspectiveCamera} camera Camera to cast rays from.
 * @returns {{onTap: Function|null, hoverTest: Function|null}} Handler slots.
 */
function createPointer(canvas, camera) {
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const handlers = { onTap: null, hoverTest: null, onDrag: null };
  let down = null;
  let dragging = false;

  /**
   * Aims the raycaster through a pointer position.
   * @param {PointerEvent} event Pointer event.
   * @returns {THREE.Raycaster} The aimed raycaster.
   */
  function aim(event) {
    const bounds = canvas.getBoundingClientRect();
    ndc.set(((event.clientX - bounds.left) / bounds.width) * 2 - 1, -((event.clientY - bounds.top) / bounds.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    return raycaster;
  }

  /**
   * Remembers where a press started.
   * @param {PointerEvent} event Pointer event.
   * @returns {void}
   */
  function handleDown(event) {
    down = { x: event.clientX, y: event.clientY, lastX: event.clientX, lastY: event.clientY, time: performance.now() };
    dragging = false;
    canvas.setPointerCapture?.(event.pointerId);
  }

  /**
   * Reports a tap when the press was short and barely moved.
   * @param {PointerEvent} event Pointer event.
   * @returns {void}
   */
  function handleUp(event) {
    if (!down) {
      return;
    }
    const moved = Math.hypot(event.clientX - down.x, event.clientY - down.y);
    const quick = performance.now() - down.time < 600;
    down = null;
    if (moved < 10 && quick) {
      handlers.onTap?.(aim(event));
    }
  }

  /**
   * Reports drags while pressed, and shows a pointer cursor over things that can be tapped.
   * @param {PointerEvent} event Pointer event.
   * @returns {void}
   */
  function handleMove(event) {
    if (down) {
      dragging ||= Math.hypot(event.clientX - down.x, event.clientY - down.y) >= 10;
      if (dragging) {
        handlers.onDrag?.(event.clientX - down.lastX, event.clientY - down.lastY);
      }
      down.lastX = event.clientX;
      down.lastY = event.clientY;
      return;
    }
    if (event.pointerType !== 'mouse') {
      return;
    }
    canvas.style.cursor = handlers.hoverTest?.(aim(event)) ? 'pointer' : '';
  }

  canvas.addEventListener('pointerdown', handleDown);
  canvas.addEventListener('pointerup', handleUp);
  canvas.addEventListener('pointercancel', () => {
    down = null;
  });
  canvas.addEventListener('pointermove', handleMove);
  return handlers;
}

const FIREWORK_COLORS = ['#FF3B4E', '#FFC86B', '#5D7DFF'].map((hex) => new THREE.Color(hex));
const FIREWORK_WHITE = new THREE.Color('#FFF3E0');
const FIREWORK_LINES = [
  { text: 'Happy Birthday!!!', size: 150 },
  { text: 'АНДРІЙ', size: 270 },
];
const FIREWORK_TEXT_CENTER = new THREE.Vector3(0, 22, -50);
const FIREWORK_TEXT_WIDTH = 38;
const FIREWORK_TEXT_SEEK_SECONDS = 1.8;
const FIREWORK_SCHEDULE = [
  { at: 1.6, x: -14 }, { at: 2.4, x: 12 }, { at: 3.3, x: -4 }, { at: 4, x: 18 }, { at: 4.6, x: -20 },
  { at: 5.6, x: -8 }, { at: 5.7, x: 8 }, { at: 6.8, x: 2 }, { at: 7.6, x: -15 }, { at: 8, x: 15 },
  { at: 9, x: -5 }, { at: 9.4, x: 6 }, { at: 10.5, x: 0, big: true },
  { at: 12, x: 0, finale: true },
  { at: 20, x: -18 }, { at: 20.1, x: 18 }, { at: 20.8, x: -10 }, { at: 21, x: 10 },
];
const PARTICLE_TRAIL = 0;
const PARTICLE_SPARK = 1;
const PARTICLE_SEEK = 2;
const PARTICLE_HOLD = 3;

/**
 * Samples points inside the finale text («Happy Birthday!!!» over «АНДРІЙ»), drawn in Rubik Bold, spread evenly across the letters.
 * @param {number} count Number of points.
 * @returns {Float32Array} Interleaved x, y offsets in metres around the text's centre.
 */
function sampleNamePoints(count) {
  const width = 1800;
  const height = 600;
  const lineGap = 40;
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext('2d', { willReadFrequently: true });
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.fillStyle = '#fff';
  const blockHeight = FIREWORK_LINES.reduce((sum, line) => sum + line.size, 0) + lineGap * (FIREWORK_LINES.length - 1);
  let top = (height - blockHeight) / 2;
  let textWidth = 0;
  for (const line of FIREWORK_LINES) {
    context.font = `700 ${line.size}px Rubik, system-ui, sans-serif`;
    context.fillText(line.text, width / 2, top + line.size / 2);
    textWidth = Math.max(textWidth, context.measureText(line.text).width);
    top += line.size + lineGap;
  }
  const pixels = context.getImageData(0, 0, width, height).data;
  const candidates = [];
  for (let y = 0; y < height; y += 2) {
    for (let x = 0; x < width; x += 2) {
      if (pixels[(y * width + x) * 4 + 3] > 140) {
        candidates.push(x, y);
      }
    }
  }
  const random = createRandom(9);
  const scale = FIREWORK_TEXT_WIDTH / textWidth;
  const step = candidates.length / 2 / count;
  const points = new Float32Array(count * 2);
  for (let i = 0; i < count; i += 1) {
    const pick = Math.min(candidates.length / 2 - 1, Math.floor((i + random() * 0.9) * step)) * 2;
    points[i * 2] = (candidates[pick] - width / 2 + (random() - 0.5) * 2) * scale;
    points[i * 2 + 1] = (height / 2 - candidates[pick + 1] + (random() - 0.5) * 2) * scale;
  }
  return points;
}

/**
 * Creates the fireworks: a fixed pool of additive point particles driven on the CPU, rockets with trails,
 * spherical bursts, a finale whose sparks settle into «Happy Birthday!!!» over «АНДРІЙ» and stay to the end, and a flash light that lights the beach.
 * @param {{tier: string}} quality Quality settings.
 * @returns {object} Fireworks controller.
 */
function createFireworks(quality) {
  const high = quality.tier === 'high';
  const capacity = high ? 6000 : 3000;
  const burstSize = high ? 220 : 110;
  const textCount = high ? 3800 : 1900;
  const textPointSize = high ? 0.32 : 0.42;

  const positions = new Float32Array(capacity * 3);
  let onSound = null;
  const colors = new Float32Array(capacity * 3);
  const sizes = new Float32Array(capacity);
  const alphas = new Float32Array(capacity);
  const velocities = new Float32Array(capacity * 3);
  const targets = new Float32Array(capacity * 3);
  const ages = new Float32Array(capacity);
  const lives = new Float32Array(capacity);
  const baseSizes = new Float32Array(capacity);
  const phases = new Float32Array(capacity);
  const modes = new Uint8Array(capacity);
  const free = Array.from({ length: capacity }, (_, i) => capacity - 1 - i);
  const active = [];
  const rockets = [];
  let textParticles = [];
  let textScale = 1;
  const textCentre = FIREWORK_TEXT_CENTER.clone();
  let namePoints = null;
  let nextLaunch = FIREWORK_SCHEDULE.length;
  let flashLevel = 0;
  let random = createRandom(2024);

  const geometry = new THREE.BufferGeometry();
  const positionAttribute = new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage);
  const colorAttribute = new THREE.BufferAttribute(colors, 3).setUsage(THREE.DynamicDrawUsage);
  const sizeAttribute = new THREE.BufferAttribute(sizes, 1).setUsage(THREE.DynamicDrawUsage);
  const alphaAttribute = new THREE.BufferAttribute(alphas, 1).setUsage(THREE.DynamicDrawUsage);
  geometry.setAttribute('position', positionAttribute);
  geometry.setAttribute('aColor', colorAttribute);
  geometry.setAttribute('aSize', sizeAttribute);
  geometry.setAttribute('aAlpha', alphaAttribute);
  const uniforms = { uScale: { value: 1 } };
  const points = new THREE.Points(geometry, new THREE.ShaderMaterial({
    uniforms,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      uniform float uScale;
      attribute vec3 aColor;
      attribute float aSize;
      attribute float aAlpha;
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        vColor = aColor;
        vAlpha = aAlpha;
        vec4 viewPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * uScale / max(-viewPosition.z, 0.1);
        gl_Position = projectionMatrix * viewPosition;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        float distanceFromCentre = length(gl_PointCoord - 0.5) * 2.0;
        if (distanceFromCentre > 1.0 || vAlpha <= 0.0) {
          discard;
        }
        float core = pow(1.0 - distanceFromCentre, 2.2);
        gl_FragColor = vec4(vColor * (0.45 + core * 1.25), vAlpha * (1.0 - distanceFromCentre));
        #include <colorspace_fragment>
      }
    `,
  }));
  points.frustumCulled = false;
  points.renderOrder = 3;
  const flash = new THREE.PointLight('#ffffff', 0, 0, 0);
  const group = new THREE.Group();
  group.add(points, flash);
  const head = new THREE.Vector3();
  const direction = new THREE.Vector3();

  if (document.fonts) {
    trackAsset(document.fonts.load('700 270px Rubik', FIREWORK_LINES.map((line) => line.text).join(''))).then(() => {
      namePoints = sampleNamePoints(textCount);
    }).catch(() => {});
  }

  /**
   * Takes a particle from the pool.
   * @param {THREE.Vector3} position Start position.
   * @param {THREE.Vector3} velocity Start velocity in metres per second.
   * @param {THREE.Color} color Particle colour.
   * @param {number} size World size in metres.
   * @param {number} life Lifetime in seconds.
   * @param {number} mode One of the PARTICLE_* modes.
   * @returns {number} Pool index, or -1 when the pool is full.
   */
  function spawn(position, velocity, color, size, life, mode) {
    const index = free.pop();
    if (index === undefined) {
      return -1;
    }
    const offset = index * 3;
    position.toArray(positions, offset);
    velocity.toArray(velocities, offset);
    color.toArray(colors, offset);
    baseSizes[index] = size;
    sizes[index] = size;
    alphas[index] = 1;
    ages[index] = 0;
    lives[index] = life;
    modes[index] = mode;
    phases[index] = random() * Math.PI * 2;
    active.push(index);
    return index;
  }

  /**
   * Returns the particle at a slot of the active list to the pool.
   * @param {number} slot Position in the active list.
   * @returns {void}
   */
  function kill(slot) {
    const index = active[slot];
    active[slot] = active[active.length - 1];
    active.pop();
    alphas[index] = 0;
    sizes[index] = 0;
    free.push(index);
  }

  /**
   * Points `direction` a random way on the unit sphere.
   * @returns {THREE.Vector3} The direction vector.
   */
  function randomDirection() {
    const z = random() * 2 - 1;
    const angle = random() * Math.PI * 2;
    const ring = Math.sqrt(1 - z * z);
    return direction.set(ring * Math.cos(angle), z, ring * Math.sin(angle));
  }

  /**
   * Sends a rocket up from the sea.
   * @param {object} entry Schedule entry with `x` and optional `big` or `finale`.
   * @param {number} index Entry index, used to cycle colours.
   * @returns {void}
   */
  function launch(entry, index) {
    const z = entry.finale ? FIREWORK_TEXT_CENTER.z : -48 - random() * 12;
    const end = entry.finale
      ? FIREWORK_TEXT_CENTER.clone()
      : new THREE.Vector3(entry.x + (random() - 0.5) * 4, entry.big ? 24 : 15 + random() * 10, z);
    rockets.push({
      start: new THREE.Vector3(entry.x, 0.5, z),
      end,
      color: FIREWORK_COLORS[index % FIREWORK_COLORS.length],
      flight: entry.finale ? 1.8 : 1.5,
      time: 0,
      trailClock: 0,
      big: Boolean(entry.big),
      finale: Boolean(entry.finale),
    });
    onSound?.('launch', entry.finale ? 1.8 : 1.5);
  }

  /**
   * Starts the name: sparks burst out, then spring onto points inside the letters and stay there until the fireworks are cleared.
   * @param {THREE.Vector3} centre Burst centre, which is also the word's centre.
   * @param {boolean} [settled] When true the sparks start already in place, for jumps past the finale.
   * @returns {void}
   */
  function formName(centre, settled = false) {
    namePoints ??= sampleNamePoints(textCount);
    textParticles = [];
    textCentre.copy(centre);
    for (let i = 0; i < textCount; i += 1) {
      const roll = random();
      const color = roll < 0.12 ? FIREWORK_WHITE : roll < 0.2 ? FIREWORK_COLORS[0] : FIREWORK_COLORS[1];
      const target = head.set(centre.x + namePoints[i * 2] * textScale, centre.y + namePoints[i * 2 + 1] * textScale, centre.z);
      const velocity = settled ? direction.set(0, 0, 0) : randomDirection().multiplyScalar(6 + random() * 8);
      const index = spawn(settled ? target : centre, velocity, color, textPointSize, Infinity, settled ? PARTICLE_HOLD : PARTICLE_SEEK);
      if (index < 0) {
        break;
      }
      target.toArray(targets, index * 3);
      textParticles.push(index);
    }
  }

  /**
   * Explodes a rocket at the top of its flight.
   * @param {object} rocket Rocket that reached its burst point.
   * @returns {void}
   */
  function burst(rocket) {
    flashLevel = Math.max(flashLevel, rocket.finale ? 2.4 : rocket.big ? 1.6 : 1);
    flash.position.copy(rocket.end);
    flash.color.copy(rocket.finale ? FIREWORK_COLORS[1] : rocket.color);
    if (rocket.finale) {
      formName(rocket.end);
      onSound?.('name');
    }
    onSound?.('burst', rocket.finale ? 1.6 : rocket.big ? 1.4 : 1);
    const count = Math.round(burstSize * (rocket.big ? 1.6 : rocket.finale ? 0.6 : 1));
    const speed = rocket.big ? 13 : 9.5;
    for (let i = 0; i < count; i += 1) {
      const velocity = randomDirection().multiplyScalar(speed * (0.82 + random() * 0.18));
      const color = random() < 0.18 ? FIREWORK_WHITE : rocket.color;
      spawn(rocket.end, velocity, color, 0.42, 1.7 + random() * 0.8, PARTICLE_SPARK);
    }
  }

  /**
   * Moves rockets up their paths, leaving trails, and bursts them on arrival.
   * @param {number} dt Seconds since the last frame.
   * @returns {void}
   */
  function updateRockets(dt) {
    for (let i = rockets.length - 1; i >= 0; i -= 1) {
      const rocket = rockets[i];
      rocket.time += dt;
      const t = clamp01(rocket.time / rocket.flight);
      head.lerpVectors(rocket.start, rocket.end, 1 - (1 - t) * (1 - t));
      head.x += Math.sin(rocket.time * 9) * 0.15 * (1 - t);
      rocket.trailClock += dt;
      while (rocket.trailClock > 0.012) {
        rocket.trailClock -= 0.012;
        const velocity = direction.set((random() - 0.5) * 0.8, -0.3 - random() * 0.7, (random() - 0.5) * 0.8);
        spawn(head, velocity, random() < 0.5 ? FIREWORK_WHITE : FIREWORK_COLORS[1], 0.24, 0.5 + random() * 0.3, PARTICLE_TRAIL);
      }
      if (t >= 1) {
        burst(rocket);
        rockets.splice(i, 1);
      }
    }
  }

  /**
   * Integrates every live particle: springs for the name, gravity and drag for sparks and trails.
   * @param {number} dt Seconds since the last frame.
   * @returns {void}
   */
  function updateParticles(dt) {
    const sparkDrag = Math.exp(-1.3 * dt);
    const trailDrag = Math.exp(-3 * dt);
    for (let slot = active.length - 1; slot >= 0; slot -= 1) {
      const index = active[slot];
      const offset = index * 3;
      ages[index] += dt;
      const mode = modes[index];
      if (mode === PARTICLE_SEEK || mode === PARTICLE_HOLD) {
        for (let axis = 0; axis < 3; axis += 1) {
          const velocity = velocities[offset + axis] + (10 * (targets[offset + axis] - positions[offset + axis]) - 6.3 * velocities[offset + axis]) * dt;
          velocities[offset + axis] = velocity;
          positions[offset + axis] += velocity * dt;
        }
        if (mode === PARTICLE_SEEK && ages[index] > FIREWORK_TEXT_SEEK_SECONDS) {
          modes[index] = PARTICLE_HOLD;
        }
        alphas[index] = mode === PARTICLE_HOLD
          ? 0.82 + 0.18 * Math.sin(ages[index] * 9 + phases[index])
          : 0.6 + 0.4 * smoothstep(0, FIREWORK_TEXT_SEEK_SECONDS, ages[index]);
        continue;
      }
      const life = ages[index] / lives[index];
      if (life >= 1) {
        kill(slot);
        continue;
      }
      const trail = mode === PARTICLE_TRAIL;
      const drag = trail ? trailDrag : sparkDrag;
      velocities[offset + 1] -= 3.2 * (trail ? 0.25 : 1) * dt;
      for (let axis = 0; axis < 3; axis += 1) {
        velocities[offset + axis] *= drag;
        positions[offset + axis] += velocities[offset + axis] * dt;
      }
      const flicker = !trail && life > 0.55 && Math.sin(ages[index] * 38 + phases[index]) < 0 ? 0.35 : 1;
      alphas[index] = Math.pow(1 - life, 1.6) * flicker;
      sizes[index] = baseSizes[index] * (1 - life * (trail ? 0.6 : 0.35));
    }
  }

  return {
    object3d: group,
    get activeCount() {
      return active.length;
    },
    /**
     * Sets who hears launches, bursts and the name forming.
     * @param {(type: 'launch'|'burst'|'name', value?: number) => void} handler Sound handler.
     * @returns {void}
     */
    setSoundHandler(handler) {
      onSound = handler;
    },
    /**
     * Clears everything and arms the launch schedule.
     * @returns {void}
     */
    start() {
      this.clear();
      random = createRandom(2024);
      nextLaunch = 0;
    },
    /**
     * Stops launching new rockets; particles already in the air finish naturally.
     * @returns {void}
     */
    stopLaunching() {
      nextLaunch = FIREWORK_SCHEDULE.length;
    },
    /**
     * Sizes the name for the screen shape: a little smaller on tall phone screens so it fits their narrow view.
     * Sparks already holding the name glide to the new size.
     * @param {number} aspect Screen width divided by height.
     * @returns {void}
     */
    setAspect(aspect) {
      textScale = lerp(1, 0.8, clamp01((1 - aspect) / 0.5));
      textParticles.forEach((index, i) => {
        targets[index * 3] = textCentre.x + namePoints[i * 2] * textScale;
        targets[index * 3 + 1] = textCentre.y + namePoints[i * 2 + 1] * textScale;
      });
    },
    /**
     * Puts the finished name in the sky at once unless it is already there, for jumps past the finale.
     * @returns {void}
     */
    showName() {
      if (textParticles.length === 0) {
        formName(FIREWORK_TEXT_CENTER, true);
      }
    },
    /**
     * Removes every rocket and particle at once.
     * @returns {void}
     */
    clear() {
      for (let slot = active.length - 1; slot >= 0; slot -= 1) {
        kill(slot);
      }
      rockets.length = 0;
      textParticles = [];
      flashLevel = 0;
      nextLaunch = FIREWORK_SCHEDULE.length;
      positionAttribute.needsUpdate = true;
      sizeAttribute.needsUpdate = true;
      alphaAttribute.needsUpdate = true;
    },
    /**
     * Launches the rockets that are due by this point in the beat.
